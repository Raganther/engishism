<!DOCTYPE html>
<html lang="en">

<body>
<div id="game-hub-root"></div>

<!-- every unit registers into window.UNITS; add a unit = add its content file here -->

<!-- Physics table shelf (Kit.table) for the flick & stack physics rounds:

     destructures window.Matter at load), then the shelf onto window.HubKit. -->
<script src="game-hub/matter.min.js?v=20260905a"></script>
<script src="game-hub/hub-table.js?v=20260905a"></script>
<script src="game-hub/hub-rounds.js?v=20260905a"></script>

<script src="game-hub/hub-settings.js?v=20260905a"></script>

     the question bench holds the same registry the board does. App-wide rows in
     hub-app-settings.js; each game's rows in games/<id>-settings.js; the round-mode
     rows are built by registerRoundModeSettings (hub-round-settings.js) below. -->
<script src="game-hub/hub-app-settings.js?v=20260905a"></script>
<script src="game-hub/hub-round-settings.js?v=20260905a"></script>

<script src="game-hub/games/bingo-settings.js?v=20260905a"></script>
<script src="game-hub/hub-games.js?v=20260905a"></script>

     everything registered — the same pattern as rounds/*.js into hub-rounds.js. -->
