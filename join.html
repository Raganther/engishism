<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#12263F">
<title>Buzzer — Engishism</title>
<style>
  :root{ --navy:#12263F; --navy2:#1B3556; --blue:#00A0DF; --yellow:#FFC20E; --cream:#FBF3D5; --white:#fff; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{
    background:var(--navy); color:var(--white); min-height:100vh; min-height:100dvh;
    font-family:'Space Grotesk', system-ui, -apple-system, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:22px; gap:18px; text-align:center; overflow:hidden;
  }
  h1{ font-size:1.05rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--blue); font-weight:700; }
  .screen{ display:none; width:100%; max-width:420px; flex-direction:column; gap:16px; align-items:center; }
  .screen.active{ display:flex; }
  label{ font-size:0.74rem; letter-spacing:0.12em; text-transform:uppercase; color:rgba(251,243,213,0.7); align-self:flex-start; }
  input{
    width:100%; padding:16px; border-radius:12px; border:2px solid rgba(255,255,255,0.25);
    background:var(--navy2); color:var(--white); font-family:inherit; font-size:1.25rem; font-weight:700; text-align:center;
  }
  input:focus{ outline:none; border-color:var(--blue); }
  #code{ font-size:2rem; letter-spacing:0.3em; }
  /* A grid, not a row: six teams across a 360px handset gave each button 50px and
     pushed the last ones off the edge, so a class split more than about four ways
     could not pick the team they were actually on. Wraps instead. */
  .teams{ display:grid; grid-template-columns:repeat(auto-fit, minmax(88px, 1fr)); gap:10px; width:100%; }
  .teams button{
    padding:14px 8px; border-radius:12px; border:2px solid rgba(255,255,255,0.25);
    background:var(--navy2); color:var(--white); font-family:inherit; font-weight:700; font-size:0.95rem; cursor:pointer;
    min-width:0; overflow-wrap:anywhere;   /* a team called something long stays inside its button */
  }
  .teams button.on{ background:var(--yellow); color:var(--navy); border-color:var(--yellow); }
  .card{ display:none; grid-template-columns:repeat(3, 1fr); gap:8px; width:100%; }
  .card button{
    padding:14px 5px; border-radius:12px; border:2px solid rgba(255,255,255,0.22);
    background:var(--navy2); color:var(--white); font-family:inherit; font-weight:700;
    font-size:0.78rem; line-height:1.2; min-width:0; cursor:pointer; min-height:64px;
    /* long words are common in a C1 vocabulary bank — break them properly rather
       than letting one letter drop onto its own line */
    overflow-wrap:break-word; hyphens:auto;
  }
  .card button.marked{ background:var(--yellow); color:var(--navy); border-color:var(--yellow); }
  .card button.wrong{ background:#C0392B; border-color:#C0392B; }
  .card button:disabled{ opacity:0.85; }
  .card.live button:not(.marked){ border-color:var(--blue); }
  .go{
    width:100%; padding:17px; border:none; border-radius:12px; background:var(--blue); color:var(--white);
    font-family:inherit; font-weight:700; font-size:1.1rem; text-transform:uppercase; letter-spacing:0.06em; cursor:pointer;
  }
  .go:disabled{ opacity:0.4; }
  .note{ font-size:0.82rem; color:rgba(251,243,213,0.62); line-height:1.5; }
  .who{ font-size:0.8rem; letter-spacing:0.1em; text-transform:uppercase; color:rgba(251,243,213,0.72); }
  .room{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:0.72rem; letter-spacing:0.22em; text-transform:uppercase;
    color:rgba(251,243,213,0.5); margin-bottom:2px;
  }
  .room b{ color:var(--yellow); font-weight:700; letter-spacing:0.26em; }

  /* the buzzer itself — thumb-sized, unmissable, and it fills what's left */
  #buzzer{
    width:min(74vw, 300px); height:min(74vw, 300px); border-radius:50%; border:none;
    background:radial-gradient(circle at 34% 30%, #ff8a7d, #e0271a 62%, #a5170e);
    color:var(--white); font-family:inherit; font-weight:700; font-size:1.7rem;
    text-transform:uppercase; letter-spacing:0.06em; cursor:pointer;
    box-shadow:0 12px 0 #7d1109, 0 18px 34px rgba(0,0,0,0.5);
    transition:transform .06s, box-shadow .06s, filter .15s;
    touch-action:manipulation;
  }
  #buzzer:active{ transform:translateY(9px); box-shadow:0 3px 0 #7d1109, 0 8px 16px rgba(0,0,0,0.45); }
  #buzzer[disabled]{ filter:grayscale(0.75) brightness(0.5); cursor:default; box-shadow:0 12px 0 #3a3a3a, 0 18px 30px rgba(0,0,0,0.4); }
  #buzzer.won{ background:radial-gradient(circle at 34% 30%, #7de08a, #17a52f 62%, #0c6a1e); filter:none; }
  #state{ font-size:1rem; min-height:1.6em; color:var(--cream); }
  #status{ font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; color:rgba(251,243,213,0.45); }
  .rejoin{
    background:none; border:none; padding:8px; cursor:pointer; font-family:inherit;
    font-size:0.78rem; color:rgba(251,243,213,0.55); text-decoration:underline;
  }
  .err{ color:#ff8a7d; font-size:0.85rem; min-height:1.2em; }
  /* the question the teacher is asking, pushed from the host — the back of the
     room can read its own phone even when it cannot read the board */
  .qtext{ font-size:1.15rem; line-height:1.4; margin:0 0 18px; color:#e8eefc; min-height:1.4em; }
  .opts{ display:none; flex-direction:column; gap:10px; width:100%; }
  .opts button{
    font: inherit; font-size:1.1rem; padding:16px; border-radius:12px; cursor:pointer;
    background:#16204f; color:#eaf0ff; border:2px solid rgba(255,255,255,0.22);
  }
  .opts button:disabled{ opacity:0.4; }
  /* Single letters are not a list, they are a keypad: eighteen full-width buttons
     would need scrolling to vote, which is the one thing a vote cannot afford. */
  .opts.grid{ flex-direction:row; flex-wrap:wrap; justify-content:center; }
  .opts.grid button{ flex:0 0 auto; min-width:62px; padding:15px 0; font-size:1.35rem; font-weight:800; }
  .opts button.picked{ background:#ffc83d; color:#0a0d26; border-color:#ffc83d; }
  .write{ display:none; width:100%; gap:10px; flex-direction:column; }
  /* Typing comes before buzzing, so the box sits between the question and the
     button: the flow reads top to bottom and the thumb ends on the thing that
     fires. Ordered explicitly rather than with one negative order, which hoisted
     the box above the question itself. */
  #screen-play.mode-type #who{ order:0; }
  #screen-play.mode-type #qtext{ order:1; }
  #screen-play.mode-type #write{ order:2; }
  #screen-play.mode-type #buzzer{ order:3; }
  #screen-play.mode-type #state{ order:4; }
  #screen-play.mode-type #status{ order:5; }
  .write input{
    font: inherit; font-size:1.1rem; padding:14px; border-radius:12px; width:100%;
    background:#0c1130; color:#eaf0ff; border:2px solid rgba(255,255,255,0.22);
  }
</style>
</head>
<body>

<div class="screen active" id="screen-join">
  <h1>Engishism · Buzzer</h1>
  <label for="code">Game code</label>
  <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="00000" autocomplete="off">
  <label for="name">Your name</label>
  <input id="name" maxlength="24" placeholder="Name" autocomplete="off">
  <label>Your team</label>
  <div class="teams" id="teams"></div>
  <button class="go" id="join-btn" disabled>Join</button>
  <p class="err" id="join-err"></p>
  <p class="note">Your teacher has the code on the big screen.</p>
</div>

<div class="screen" id="screen-play">
  <!-- Which room this phone is in, kept on screen. A student who joined on the
       wrong code, or drifted onto a neighbouring class's game, had no way to tell:
       every screen after joining looked identical whichever room it was. -->
  <p class="room" id="room"></p>
  <p class="who" id="who"></p>
  <p class="qtext" id="qtext"></p>
  <button id="buzzer" disabled>Wait</button>
  <div class="opts" id="opts"></div>
  <!-- Bingo: this phone's own card, which is the first thing here that outlives a
       question. Nine words, tap the one the clue is describing. -->
  <div class="card" id="card"></div>
  <div class="write" id="write">
    <!-- autocorrect and spellcheck off, deliberately: the race is to produce the
         word, and a phone that finishes it turns a language task into a typing one -->
    <input id="reply" maxlength="60" placeholder="Type your answer" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button class="go" id="send">Send</button>
  </div>
  <p id="state">Waiting for the teacher…</p>
  <p id="status"></p>
  <!-- The way out of a remembered seat. Rejoining silently is right for a reload
       mid-round, and wrong the day the phone changes hands or the student picked
       the wrong team — without this, a phone with a seat in the current room could
       never reach the name-and-team screen again. -->
  <button class="rejoin" id="rejoin">Not you? Change name or team</button>
</div>

<script src="game-hub/hub-buzzer.js?v=20260801k"></script>
<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);

  // relay defaults to wherever this page came from; ?relay=https://… overrides it
  const RELAY = params.get('relay') || '';

  let team = 0, teamNames = ['Team 1','Team 2'], client = null;

  function renderTeams(){
    const wrap = $('teams'); wrap.innerHTML='';
    teamNames.forEach((n,i)=>{
      const b=document.createElement('button');
      b.textContent=n; b.className = (i===team) ? 'on' : '';
      b.addEventListener('click', ()=>{ team=i; renderTeams(); });
      wrap.appendChild(b);
    });
  }
  renderTeams();

  /* The real teams, before joining. This screen used to offer a hard-coded two, so
     a class split into four could only pick from the first half — and a team the
     teacher had renamed to something the room actually answers to still read
     "Team 2" here. The room knows; ask it as soon as there is a code to ask about.

     Failure is silent on purpose: a wrong code, a relay that has not heard of this
     room yet, no network. The default pair stays and the student can still join —
     the code is validated by the connection attempt, not by this. */
  let teamsFor = '';
  function loadTeams(force){
    const code = $('code').value.trim();
    if(!/^\d{4,6}$/.test(code) || (!force && code === teamsFor)) return;
    teamsFor = code;
    fetch((RELAY || '') + '/buzzer/room?code=' + encodeURIComponent(code))
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if(!d || !d.teams || !d.teams.length || $('code').value.trim() !== code) return;
        teamNames = d.teams;
        if(team >= teamNames.length) team = 0;   // the choice has to stay on the list
        renderTeams();
      })
      .catch(()=>{});
  }

  function validate(){
    $('join-btn').disabled = !(/^\d{4,6}$/.test($('code').value.trim()) && $('name').value.trim());
  }
  $('code').addEventListener('input', ()=>{ validate(); loadTeams(); });
  $('name').addEventListener('input', validate);
  if(params.get('code')){ $('code').value = params.get('code'); }
  validate();
  loadTeams();               // scanned in? then the code is already there

  /* And keep the list current while the student is still choosing. This fetch used
     to run once per code, so a team the teacher added *after* this page loaded was
     never pickable — the student had to join, or reload, to see it. Joined phones
     get changes pushed over their stream; the join screen has no stream yet, so it
     asks again. Same silent failure as above: a dead relay changes nothing. */
  setInterval(()=>{
    if($('screen-join').classList.contains('active')) loadTeams(true);
  }, 4000);

  function show(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    $(id).classList.add('active');
  }

  // a short tick so a buzz feels like it did something even before the screen changes
  let audio=null;
  function blip(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
      audio = audio || new AC();
      if(audio.state==='suspended') audio.resume();
      const o=audio.createOscillator(), g=audio.createGain(), t=audio.currentTime;
      o.type='square'; o.frequency.setValueAtTime(880,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.16,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t+0.16);
    }catch(e){}
  }

  function setBuzzer(mode, text){
    const b=$('buzzer');
    b.className = mode==='won' ? 'won' : '';
    b.disabled  = mode!=='armed';
    b.textContent = text;
  }

  /* The phone is three things depending on what the teacher is asking for:
     a buzzer racing for the floor, a set of options to pick one of, or a box to
     type into. Only one is ever on screen. */
  let mode = 'buzz', answered = false, coolTimer = null, verdictUntil = 0;
  // the state line, unless a verdict is still being read
  function say(text){ if(Date.now() > verdictUntil) $('state').textContent = text; }
  /* Some rounds belong to one team: Blockbusters asks the team on turn which
     hexagon to attack, and the rest of the room is watching, not choosing. A phone
     that is not entitled shows the question and no controls, rather than a live
     button whose press would be thrown away on arrival. */
  function myRound(d){
    const t = d && d.turnTeam;
    return t == null || Number(t) === Number(team);
  }
  /* This phone's bingo card. `marked` comes back from the relay, so a phone that
     drops off the wifi and rejoins gets its card *and* its marks, rather than a
     blank one — which for a game played over a whole round is the difference
     between rejoining and starting again. */
  let card = null, cardBusy = false;

  function renderCard(){
    const box = $('card');
    box.innerHTML = '';
    if(!card){ return; }
    card.words.forEach((w, i)=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = w;
      if(card.marked[i]) b.classList.add('marked');
      // busy only blocks the tap that is in flight, not the whole card for the rest
      // of the call — two students on the same table tap within a second of each other
      b.disabled = !!card.marked[i] || mode !== 'card';
      b.addEventListener('click', ()=> tapCard(i, b));
      box.appendChild(b);
    });
  }

  function tapCard(i, btn){
    if(!client || !card || card.marked[i] || cardBusy) return;
    cardBusy = true; blip();
    btn.disabled = true;
    $('state').textContent = 'Sent…';
    // judged on the host, which is the only place that knows the answer
    client.respond(card.words[i]);
  }

  function setMode(m, opts, mine){
    mode = m || 'buzz';
    answered = false;
    if(mine === false) mode = 'watch';
    // 'type' is both at once: the box to write in and the button to claim the floor
    $('buzzer').style.display = (mode==='buzz' || mode==='type') ? '' : 'none';
    $('opts').style.display   = mode==='vote'   ? 'flex' : 'none';
    $('write').style.display  = (mode==='answer' || mode==='type') ? 'flex' : 'none';
    // the card stays on screen between calls — it is the student's own board, not
    // a control that belongs to one question
    $('card').style.display   = card ? 'grid' : 'none';
    $('card').classList.toggle('live', mode==='card');
    // 'card-idle' is a card on screen between calls: visible, readable, not tappable
    if(mode === 'card-idle') $('buzzer').style.display = 'none';
    $('send').style.display   = mode==='type' ? 'none' : '';   // the buzzer sends it
    $('screen-play').classList.toggle('mode-type', mode==='type');
    if(mode==='vote'){
      const box=$('opts'); box.innerHTML='';
      box.classList.toggle('grid', (opts||[]).length > 4 &&
                                   (opts||[]).every(o=>String(o).length <= 2));
      (opts||[]).forEach(o=>{
        const b=document.createElement('button');
        b.type='button'; b.textContent=o;
        b.addEventListener('click', ()=>{
          if(answered || !client) return;
          answered = true; blip();
          [...box.children].forEach(x=>{ x.disabled=true; if(x===b) x.classList.add('picked'); });
          $('state').textContent = 'Answer sent';
          client.respond(o);
        });
        box.appendChild(b);
      });
    }
    if(mode==='answer'){ $('reply').value=''; $('reply').disabled=false; $('send').disabled=false; }
    if(mode==='type'){
      $('reply').value=''; $('reply').disabled=false;
      $('reply').placeholder = 'The missing word';
      setBuzzer('off','Type it');
      setTimeout(()=>{ try{ $('reply').focus(); }catch(e){} }, 60);
    }
  }

  /* In 'type' the button is dead until they have written something — the whole
     point is that the race is to produce the word, not to hit a button first. */
  function syncTypeButton(){
    if(mode !== 'type' || answered) return;
    const ready = !!$('reply').value.trim();
    setBuzzer(ready ? 'armed' : 'off', ready ? 'Buzz' : 'Type it');
  }

  /* A wrong answer costs time, never points: this player alone waits out the
     countdown while everyone else keeps racing. */
  function coolDown(until){
    if(coolTimer) clearInterval(coolTimer);
    const tick = ()=>{
      const left = Math.ceil((until - Date.now())/1000);
      if(left > 0){ setBuzzer('off', String(left)); return; }
      clearInterval(coolTimer); coolTimer = null;
      answered = false;
      $('reply').disabled = false;
      syncTypeButton();
      $('state').textContent = 'Try again';
      try{ $('reply').focus(); }catch(e){}
    };
    tick();
    coolTimer = setInterval(tick, 200);
  }
  function sendWritten(){
    const v = $('reply').value.trim();
    if(answered || !client || !v) return;
    answered = true; blip();
    $('reply').disabled = true; $('send').disabled = true;
    $('state').textContent = 'Answer sent';
    client.respond(v);
  }

  /* Scanned in? The code is in the URL, so fill it and get out of the way — the
     whole point of the QR is that a student types nothing but their name. */
  (function(){
    try{
      const code = new URLSearchParams(location.search).get('code');
      if(code && /^\d{4,6}$/.test(code)){
        $('code').value = code;
        // hide the field and its own label only — the label is a sibling, so
        // reaching for parentElement here would hide the whole join form
        const lab = document.querySelector('label[for="code"]');
        if(lab) lab.style.display = 'none';
        $('code').style.display = 'none';
        setTimeout(()=>$('name').focus(), 60);
        validate();
      }
    }catch(e){}
  })();

  /* ---- the seat, remembered ----
     A phone reloads for all sorts of ordinary reasons — battery saver, a stray
     swipe, the screen locking hard enough — and until now that meant retyping the
     code and the name mid-round. It also meant a *new identity*, which is fine for
     a buzzer and wrong for anything the room holds on your behalf: a bingo card is
     dealt to a player id, so a reload was dealt a second card and the marks on the
     first were stranded. Same seat, same id, same card. */
  const SEAT = 'engishism.seat';
  function rememberSeat(d){ try{ localStorage.setItem(SEAT, JSON.stringify(d)); }catch(e){} }
  function forgetSeat(){ try{ localStorage.removeItem(SEAT); }catch(e){} }
  function seat(){
    try{ const d = JSON.parse(localStorage.getItem(SEAT) || 'null');
         return (d && d.code && d.id) ? d : null; }catch(e){ return null; }
  }

  function joinRoom(code, name, id){
    $('join-err').textContent = '';
    client = HubBuzzer.player({ relay:RELAY, code, name, team, id });
    /* The joined handset, exposed the same way the hub exposes HubSettings and
       HubGames: it is the only handle on this phone from outside, and the checks
       that matter here are ones a click cannot reach — sending a vote a phone is
       not entitled to send, for one. */
    window.HubPlayer = client;

    client.on('status', s=>{
      $('status').textContent =
        s.state==='connected'    ? 'connected' :
        s.state==='reconnecting' ? 'reconnecting…' : 'can’t reach the game';
      if(s.state==='unreachable' && $('screen-join').classList.contains('active')){
        $('join-err').textContent = 'No game with that code — check the screen.';
        // a remembered seat in a room that has gone must not keep retrying: last
        // lesson's code is not this lesson's
        forgetSeat();
      }
    });

    client.on('joined', d=>{
      if(d.teams && d.teams.length){ teamNames = d.teams; }
      $('room').innerHTML = 'Room <b>' + String(code).replace(/[^0-9]/g,'') + '</b>';
      $('who').textContent = name + ' · ' + (teamNames[team] || ('Team '+(team+1)));
      show('screen-play');
      rememberSeat({ code, name, team, id:client.id });
      /* Students trickle in — late, on the wrong WiFi, phone locked — so a join
         lands in whatever is currently being asked rather than on a blank screen
         until the next question. The relay sends the room's state with the join,
         and this is the same path an arm takes. */
      if(d.card){ card = { words:d.card.words||[], marked:d.card.marked||[] }; renderCard(); $('card').style.display='grid'; }
      if(d.armed){ applyArmed(d); return; }
      if(d.locked){ setBuzzer('off','Too late'); $('state').textContent = d.locked.name + ' got in first'; }
      else        { setBuzzer('off','Wait');    $('state').textContent = 'Waiting for the teacher…'; }
    });

    client.on('card', d=>{
      card = { words:(d && d.words) || [], marked:(d && d.marked) || [] };
      cardBusy = false;
      $('card').style.display = 'grid';
      renderCard();
      say('Your card — listen for your words');
    });
    client.on('marked', d=>{
      if(!card) return;
      if(d && Array.isArray(d.marked)) card.marked = d.marked;
      else if(d && typeof d.index === 'number') card.marked[d.index] = true;
      cardBusy = false;
      renderCard();
      $('state').textContent = 'Yes — marked off';
      if(navigator.vibrate) navigator.vibrate([30,60,30]);
    });
    client.on('nope', ()=>{
      cardBusy = false;
      const box = $('card');
      box.classList.add('miss');
      const wrong = [...box.querySelectorAll('button')];
      wrong.forEach(b=>b.classList.add('wrong'));
      setTimeout(()=>{ wrong.forEach(b=>b.classList.remove('wrong')); box.classList.remove('miss'); renderCard(); }, 420);
      $('state').textContent = 'Not that one';
    });

    /* Renaming a team mid-lesson, or adding a fifth, has to reach the phones — the
       name on the handset is how a student knows the score on the board is theirs. */
    client.on('teams', d=>{
      if(d.teams && d.teams.length){
        teamNames = d.teams;
        renderTeams();
        $('who').textContent = name + ' · ' + (teamNames[team] || ('Team '+(team+1)));
      }
    });

    function applyArmed(d){
      // the question has always been sent with the arm; it used to be thrown away
      $('qtext').textContent = (d && d.prompt) || '';
      const spent = (d && d.spent) || [];
      /* A reopen is the same question coming back because somebody guessed wrong.
         Re-running setMode would wipe the box — and throwing away half a word
         somebody was racing to finish is exactly the wrong thing to do here. */
      if(d && d.reopen && mode === (d.mode || 'buzz')){
        const mine = ((d.cooling||[]).find(c=>c.id===client.id)||{}).until || 0;
        if(mine > Date.now()){ coolDown(mine); return; }
        answered = false; $('reply').disabled = false;
        syncTypeButton();
        say('Still open — go!');
        return;
      }
      setMode(d && d.mode, d && d.options, myRound(d));
      if(!myRound(d)){
        const who = teamNames[Number(d.turnTeam)] || ('Team ' + (Number(d.turnTeam)+1));
        say(who + ' is choosing');
        return;
      }
      if(spent.indexOf(client.id) !== -1){
        // already had a go this round — see the question, but no second answer
        answered = true;
        setBuzzer('off','Done');
        $('opts').querySelectorAll('button').forEach(b=>b.disabled=true);
        $('reply').disabled = true; $('send').disabled = true;
        $('state').textContent = 'You have already answered this one';
        return;
      }
      if(mode==='buzz') setBuzzer('armed','Buzz');
      if(mode==='type')  syncTypeButton();
      if(mode==='card'){ cardBusy = false; renderCard(); }
      say(mode==='buzz' ? 'Go!'
        : mode==='vote' ? 'Pick one'
        : mode==='card' ? 'Tap the word'
        : mode==='type' ? 'Type it, then buzz' : 'Type your answer');
      if(navigator.vibrate) navigator.vibrate(40);
    }
    client.on('armed', applyArmed);
    /* Both go through say(), because a claimed word resets the room immediately —
       and "waiting for the teacher" landing on top of "you got it" takes the win
       away from the student who just earned it. */
    /* Between questions the phone goes back to waiting — but a bingo card is not a
       control that belongs to one question, it is the student's own board for the
       whole round. Dropping to the buzzer put a full-screen WAIT button over the
       card they were still reading. */
    function standDown(msg){
      setBuzzer('off','Wait');
      $('qtext').textContent = '';
      setMode(card ? 'card-idle' : 'buzz');
      if(card) renderCard();
      say(msg);
    }
    client.on('disarmed', ()=> standDown('Waiting for the teacher…'));
    client.on('reset',    ()=>{ card = null; $('card').style.display='none';
                                standDown('Waiting for the teacher…'); });

    /* The host's verdict on what this phone wrote. 'close' is its own answer, not a
       softer 'wrong': it means the word was produced and mis-spelled, which the
       student should hear said differently. */
    client.on('judged', d=>{
      const v = (d && d.verdict) || 'wrong';
      /* The verdict has to survive the next sentence arriving. Race re-arms the
         moment a word is claimed, so without this the student who just won sees
         "Yes!" for about a frame and then a fresh empty box — which reads as the
         buzz having done nothing. Kept on the body too, so it is still legible to
         anything asking what this phone was last told. */
      verdictUntil = Date.now() + 1500;
      document.body.dataset.verdict = v;
      if(v === 'wrong'){
        setBuzzer('off','…');
        $('state').textContent = (d && d.note) || 'Not quite';
        if(navigator.vibrate) navigator.vibrate([15,60,15]);
        coolDown((d && d.until) || Date.now());
        return;
      }
      setBuzzer('won', v === 'close' ? 'Close!' : 'Yes!');
      $('state').textContent = (d && d.note) ||
        (v === 'close' ? 'Close — check your spelling' : 'You got it!');
      if(navigator.vibrate) navigator.vibrate([30,40,30]);
    });

    client.on('locked', d=>{
      const mine = d.id === client.id;
      if(mode === 'type'){
        // the verdict decides it, so say what is actually happening rather than
        // congratulating somebody who may have typed the wrong word
        setBuzzer('off', mine ? 'Sent' : 'Wait');
        $('reply').disabled = true;
        $('state').textContent = mine ? 'Checking your answer…' : (d.name + ' is in — hold on');
        if(navigator.vibrate) navigator.vibrate(mine ? 20 : 10);
        return;
      }
      setBuzzer(mine ? 'won' : 'off', mine ? 'You!' : 'Too late');
      $('state').textContent = mine ? 'You buzzed first — answer!' : (d.name + ' got in first');
      if(navigator.vibrate) navigator.vibrate(mine ? [30,40,30] : 15);
    });
  }

  $('join-btn').addEventListener('click', ()=>{
    joinRoom($('code').value.trim(), $('name').value.trim(), null);
  });

  /* Back into the same seat on a reload, without retyping anything. If the room has
     gone — a lesson ended, a different class — the stream reports it unreachable and
     the join screen is still there underneath.

     A scanned code outranks the memory. The QR puts the room in the URL, and that is
     an explicit statement of which room this phone belongs in — so a seat remembered
     from a *different* room is last lesson's, not this one's. Resuming it anyway
     skipped the name-and-team screen entirely and dropped the student into the old
     room, buzz button up, deaf to every team change in the room they had actually
     scanned. Keep the name (they are the same person), drop the stale seat, and let
     them join the scanned room properly. */
  (function resume(){
    const d = seat();
    if(!d) return;
    const scanned = params.get('code');
    if(scanned && /^\d{4,6}$/.test(scanned) && String(scanned) !== String(d.code)){
      forgetSeat();
      if(!$('name').value){ $('name').value = d.name || ''; }
      validate();
      return;
    }
    team = Number(d.team) || 0;
    $('code').value = d.code; $('name').value = d.name;
    renderTeams();
    joinRoom(d.code, d.name, d.id);
  })();

  /* Back to the join form, seat and all. The code and name inputs still hold what
     this phone joined with — they were filled, never cleared — so changing team is
     one tap and changing player is retyping the name, not starting over. */
  $('rejoin').addEventListener('click', ()=>{
    forgetSeat();
    try{ if(client) client.close(); }catch(e){}
    client = null; window.HubPlayer = null;
    card = null; $('card').style.display='none';
    show('screen-join');
    loadTeams(true);          // the picker should show the room as it is now
    validate();
  });

  $('send').addEventListener('click', sendWritten);
  $('reply').addEventListener('keydown', e=>{
    if(e.key !== 'Enter') return;
    if(mode === 'type') $('buzzer').click(); else sendWritten();
  });

  $('reply').addEventListener('input', syncTypeButton);

  $('buzzer').addEventListener('click', ()=>{
    if($('buzzer').disabled || !client) return;
    if(mode === 'type'){
      const v = $('reply').value.trim();
      if(!v || answered) return;
      answered = true; blip();
      setBuzzer('off','Sent');
      $('state').textContent = 'Checking your answer…';
      client.buzz(v);
      return;
    }
    blip();
    setBuzzer('off','Sent');
    client.buzz();
  });

  // hitting space/enter on a laptop should work too, for testing
  document.addEventListener('keydown', e=>{
    if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;   // typing, not buzzing
    if((e.code==='Space'||e.code==='Enter') && $('screen-play').classList.contains('active')){
      e.preventDefault(); $('buzzer').click();
    }
  });
})();
</script>
</body>
</html>
