    client.on('done', d=>{
      doneWords = (d && Array.isArray(d.done)) ? d.done : [];
      if(mode !== 'vote') return;
      myPicks = myPicks.filter(w => doneWords.indexOf(w) === -1);
      [...$('opts').children].forEach(x=>{
        const settled = doneWords.indexOf(x.textContent) !== -1;
        x.classList.toggle('done', settled);
        if(settled){ x.classList.remove('picked','wrong'); x.disabled = true; }
        else if(!cooling) x.disabled = false;
      });
    });

    client.on('locked', d=>{
      const mine = d.id === client.id;
      if(mode === 'type'){
        // the verdict decides it, so say what is actually happening rather than
        // congratulating somebody who may have typed the wrong word
        setBuzzer('off', mine ? 'Sent' : 'Wait');
        $('reply').disabled = true;
        $('state').textContent = mine ? 'Checking your answer…' : (d.name + ' is in — hold on');
        if(navigator.vibrate) navigator.vibrate(mine ? 20 : 10);
        return;
      }
      setBuzzer(mine ? 'won' : 'off', mine ? 'You!' : 'Too late');
      const text = mine ? 'You buzzed first — answer!' : (d.name + ' got in first');
      if(d.secs) floorClockRun(d.secs, text);
      else $('state').textContent = text;
      if(navigator.vibrate) navigator.vibrate(mine ? [30,40,30] : 15);
    });
  }

  $('join-btn').addEventListener('click', ()=>{
    joinRoom($('code').value.trim(), $('name').value.trim(), null);
  });

  /* Back into the same seat on a reload, without retyping anything. If the room has
     gone — a lesson ended, a different class — the stream reports it unreachable and
     the join screen is still there underneath.

     A scanned code outranks the memory. The QR puts the room in the URL, and that is
     an explicit statement of which room this phone belongs in — so a seat remembered
     from a *different* room is last lesson's, not this one's. Resuming it anyway
     skipped the name-and-team screen entirely and dropped the student into the old
     room, buzz button up, deaf to every team change in the room they had actually
     scanned. Keep the name (they are the same person), drop the stale seat, and let
     them join the scanned room properly. */
  (function resume(){
    if(SIMULATED) return;      // a fake phone never inherits the real phone's seat
    const d = seat();
    if(!d) return;
    const scanned = params.get('code');
    if(scanned && /^\d{4,6}$/.test(scanned) && String(scanned) !== String(d.code)){
      forgetSeat();
      if(!$('name').value){ $('name').value = d.name || ''; }
      validate();
      return;
    }
    team = Number(d.team) || 0;
    $('code').value = d.code; $('name').value = d.name;
    renderTeams();
    joinRoom(d.code, d.name, d.id);
  })();

  /* The bench's phones join themselves — same path a tap on Join takes. */
  (function autoJoin(){
    if(!SIMULATED) return;
    const code = $('code').value.trim();
    if(!/^\d{4,6}$/.test(code)) return;
    team = Math.max(0, parseInt(params.get('team') || '0', 10) || 0);
    renderTeams();
    joinRoom(code, params.get('name') || 'Phone', null);
  })();

  /* Back to the join form, seat and all. The code and name inputs still hold what
     this phone joined with — they were filled, never cleared — so changing team is
     one tap and changing player is retyping the name, not starting over. */
  $('rejoin').addEventListener('click', ()=>{
    forgetSeat();
    try{ if(client) client.close(); }catch(e){}
    client = null; window.HubPlayer = null;
    card = null; $('card').style.display='none';
    show('screen-join');
    loadTeams(true);          // the picker should show the room as it is now
    validate();
  });

  $('send').addEventListener('click', sendWritten);
  $('reply').addEventListener('keydown', e=>{
    if(e.key !== 'Enter') return;
    if(mode === 'type') $('buzzer').click(); else sendWritten();
  });

  $('reply').addEventListener('input', syncTypeButton);

  $('buzzer').addEventListener('click', ()=>{
    if($('buzzer').disabled || !client) return;
    if(mode === 'type'){
      const v = $('reply').value.trim();
      if(!v || answered) return;
      answered = true; blip();
      setBuzzer('off','Sent');
      $('state').textContent = 'Checking your answer…';
      client.buzz(v);
      return;
    }
    blip();
    setBuzzer('off','Sent');
    client.buzz();
  });

  // hitting space/enter on a laptop should work too, for testing
  document.addEventListener('keydown', e=>{
    if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;   // typing, not buzzing
    if((e.code==='Space'||e.code==='Enter') && $('screen-play').classList.contains('active')){
      e.preventDefault(); $('buzzer').click();
    }
  });
})();
</script>
</body>
</html>
