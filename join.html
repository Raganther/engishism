<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#12263F">
<title>Buzzer — Engishism</title>
<style>
  :root{ --navy:#12263F; --navy2:#1B3556; --blue:#00A0DF; --yellow:#FFC20E; --cream:#FBF3D5; --white:#fff; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{
    background:var(--navy); color:var(--white); min-height:100vh; min-height:100dvh;
    font-family:'Space Grotesk', system-ui, -apple-system, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:22px; gap:18px; text-align:center; overflow:hidden;
  }
  h1{ font-size:1.05rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--blue); font-weight:700; }
  .screen{ display:none; width:100%; max-width:420px; flex-direction:column; gap:16px; align-items:center; }
  .screen.active{ display:flex; }
  label{ font-size:0.74rem; letter-spacing:0.12em; text-transform:uppercase; color:rgba(251,243,213,0.7); align-self:flex-start; }
  input{
    width:100%; padding:16px; border-radius:12px; border:2px solid rgba(255,255,255,0.25);
    background:var(--navy2); color:var(--white); font-family:inherit; font-size:1.25rem; font-weight:700; text-align:center;
  }
  input:focus{ outline:none; border-color:var(--blue); }
  #code{ font-size:2rem; letter-spacing:0.3em; }
  /* A grid, not a row: six teams across a 360px handset gave each button 50px and
     pushed the last ones off the edge, so a class split more than about four ways
     could not pick the team they were actually on. Wraps instead. */
  .teams{ display:grid; grid-template-columns:repeat(auto-fit, minmax(88px, 1fr)); gap:10px; width:100%; }
  .teams button{
    padding:14px 8px; border-radius:12px; border:2px solid rgba(255,255,255,0.25);
    background:var(--navy2); color:var(--white); font-family:inherit; font-weight:700; font-size:0.95rem; cursor:pointer;
    min-width:0; overflow-wrap:anywhere;   /* a team called something long stays inside its button */
  }
  /* A team is a colour, not only a name — the same colour the projector puts
     beside that team's words, so a student can match the handset in their hand to
     the dots on the board without reading anything. The palette is in
     hub-buzzer.js, the one file the board and the handset both load, so the two
     ends cannot drift apart. The swatch is painted per button from there; `.on`
     fills with it, which is why this rule no longer names a colour of its own. */
  .teams button.on{ color:var(--navy); }
  .teams button .swatch{
    display:block; height:6px; border-radius:999px; margin:0 auto 7px; width:34px;
  }
  /* Whose handset this is, in their team's colour, on screen all lesson. */
  .who .tteam{
    display:inline-block; padding:3px 11px; border-radius:999px; margin-left:7px;
    background:var(--team, var(--blue)); color:var(--navy); font-weight:700;
  }
  .card{ display:none; grid-template-columns:repeat(3, 1fr); gap:8px; width:100%; }
  .card button{
    padding:14px 5px; border-radius:12px; border:2px solid rgba(255,255,255,0.22);
    background:var(--navy2); color:var(--white); font-family:inherit; font-weight:700;
    font-size:0.78rem; line-height:1.2; min-width:0; cursor:pointer; min-height:64px;
    /* long words are common in a C1 vocabulary bank — break them properly rather
       than letting one letter drop onto its own line */
    overflow-wrap:break-word; hyphens:auto;
  }
  .card button.marked{ background:var(--yellow); color:var(--navy); border-color:var(--yellow); }
  .card button.wrong{ background:#C0392B; border-color:#C0392B; }
  .card button:disabled{ opacity:0.85; }
  .card.live button:not(.marked){ border-color:var(--blue); }
  .go{
    width:100%; padding:17px; border:none; border-radius:12px; background:var(--blue); color:var(--white);
    font-family:inherit; font-weight:700; font-size:1.1rem; text-transform:uppercase; letter-spacing:0.06em; cursor:pointer;
  }
  .go:disabled{ opacity:0.4; }
  .note{ font-size:0.82rem; color:rgba(251,243,213,0.62); line-height:1.5; }
  /* **Look up — the board just revealed something.** Fixed, never in the flow: a
     banner taking layout space would push the question down the screen, and with
     it the letter tiles under a thumb that is mid-drag. Amber because that is the
     card's given-away colour, so one vocabulary holds at both ends of the room —
     and it says nothing about *what* was revealed, which is on the wall. */
  .lookup{
    position:fixed; left:0; right:0; top:0; z-index:40; padding:13px 14px;
    background:var(--yellow); color:var(--navy);
    font-weight:700; font-size:0.86rem; letter-spacing:0.09em; text-transform:uppercase;
    transform:translateY(-100%); transition:transform 240ms ease; pointer-events:none;
  }
  .lookup.up{ transform:translateY(0); }
  @media (prefers-reduced-motion: reduce){ .lookup{ transition:none; } }
  .who{ font-size:0.8rem; letter-spacing:0.1em; text-transform:uppercase; color:rgba(251,243,213,0.72); }
  .room{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:0.72rem; letter-spacing:0.22em; text-transform:uppercase;
    color:rgba(251,243,213,0.5); margin-bottom:2px;
  }
  .room b{ color:var(--yellow); font-weight:700; letter-spacing:0.26em; }

  /* the buzzer itself — thumb-sized, unmissable, and it fills what's left */
  #buzzer{
    width:min(74vw, 300px); height:min(74vw, 300px); border-radius:50%; border:none;
    background:radial-gradient(circle at 34% 30%, #ff8a7d, #e0271a 62%, #a5170e);
    color:var(--white); font-family:inherit; font-weight:700; font-size:1.7rem;
    text-transform:uppercase; letter-spacing:0.06em; cursor:pointer;
    box-shadow:0 12px 0 #7d1109, 0 18px 34px rgba(0,0,0,0.5);
    transition:transform .06s, box-shadow .06s, filter .15s;
    touch-action:manipulation;
  }
  #buzzer:active{ transform:translateY(9px); box-shadow:0 3px 0 #7d1109, 0 8px 16px rgba(0,0,0,0.45); }
  #buzzer[disabled]{ filter:grayscale(0.75) brightness(0.5); cursor:default; box-shadow:0 12px 0 #3a3a3a, 0 18px 30px rgba(0,0,0,0.4); }
  #buzzer.won{ background:radial-gradient(circle at 34% 30%, #7de08a, #17a52f 62%, #0c6a1e); filter:none; }
  #state{ font-size:1rem; min-height:1.6em; color:var(--cream); }
  #status{ font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; color:rgba(251,243,213,0.45); }
  .rejoin{
    background:none; border:none; padding:8px; cursor:pointer; font-family:inherit;
    font-size:0.78rem; color:rgba(251,243,213,0.55); text-decoration:underline;
  }
  .err{ color:#ff8a7d; font-size:0.85rem; min-height:1.2em; }
  /* The round clock. Its own line rather than the state line, which is busy
     saying what just happened to *this* phone. */
  .clock{
    display:none; font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:0.95rem; letter-spacing:0.12em; color:var(--cream);
    background:rgba(255,255,255,0.08); border-radius:999px; padding:5px 14px;
  }
  .clock.on{ display:block; }
  .clock.urgent{ background:#C0392B; color:#fff; }
  /* the question the teacher is asking, pushed from the host — the back of the
     room can read its own phone even when it cannot read the board */
  .qtext{ font-size:1.15rem; line-height:1.4; margin:0 0 18px; color:#e8eefc; min-height:1.4em; }
  /* The rule this question is played under. Quiet on purpose — it is not the
     question, and it must not compete with it for a thumb's attention. No
     `min-height`: most arms carry none, and a permanently reserved line is height a
     handset spends on nothing. `:empty` collapses the margin with it. */
  .qnote{
    font-size:0.78rem; line-height:1.35; margin:0 0 8px; color:#9db0d8;
    letter-spacing:0.01em; text-transform:none;
  }
  .qnote:empty{ display:none; }
  /* A sixteen-option vote is already tight; the rule is the first thing to give. */
  #screen-play.many-opts #qnote{ display:none; }
  /* The list scrolls within the screen as a last resort: the body deliberately
     never scrolls (a buzzer page in a thumb should not move), which cut a
     sixteen-option vote off at the fold with no way to reach the rest. */
  .opts{ display:none; flex-direction:column; gap:10px; width:100%;
         max-height:64vh; overflow-y:auto; }
  .opts button{
    font: inherit; font-size:1.1rem; padding:16px; border-radius:12px; cursor:pointer;
    background:#16204f; color:#eaf0ff; border:2px solid rgba(255,255,255,0.22);
  }
  .opts button:disabled{ opacity:0.4; }
  /* Single letters are not a list, they are a keypad: eighteen full-width buttons
     would need scrolling to vote, which is the one thing a vote cannot afford. */
  .opts.grid{ flex-direction:row; flex-wrap:wrap; justify-content:center; }
  .opts.grid button{ flex:0 0 auto; min-width:62px; padding:15px 0; font-size:1.35rem; font-weight:800; }
  /* And whole words are not a list either once there are more than a handful:
     sixteen full-width rows do not fit any handset, and scrolling to compare the
     options is the one thing a vote cannot afford — you cannot choose between
     things you cannot see at once. Two columns, shorter rows, everything on
     screen. Sized off the count so a four-option question keeps its big buttons. */
  /* 140px, not 100: a C1 word like "consequently" needs the width, and three
     columns on a 390px handset broke words mid-letter ("consequentl y"), which is
     harder to read than a longer list. Two columns on a phone, three on a tablet. */
  .opts.compact{ display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:8px; }
  .opts.compact button{ padding:11px 6px; font-size:0.95rem; line-height:1.15;
                        overflow-wrap:anywhere; }
  /* A long list needs the room the instruction was using — the prompt is a label
     here ("Pick a word"), not the question itself. */
  #screen-play.many-opts #qtext{ font-size:0.95rem; margin-bottom:8px; }
  #screen-play.many-opts #buzzer{ display:none; }
  /* A held word takes the team's own colour, not one shared yellow — so what this
     phone is holding and the dots beside that word on the projector are the same
     colour, and a student can check their team's answer against the board without
     being told which dots are theirs. */
  .opts button.picked{
    background:var(--team, #ffc83d); color:#0a0d26; border-color:var(--team, #ffc83d);
  }
  /* **Settled and wrong, said on the word itself.** A class of sixteen asked for
     this by describing what was wrong with the alternative: a placed word used to
     *leave* the list, so the buttons shuffled up under a thumb mid-question and
     there was nothing anywhere saying whether the last thing you sent had been any
     good. Green is earned and stays — that word is on your ladder and is not worth
     tapping again. Red is the wrong Send that is being waited out; it clears the
     moment the player chooses something else, because it describes one answer
     rather than the word. */
  .opts button.done{
    background:rgba(60,190,120,0.16); color:#8fe6b4; border-color:rgba(60,190,120,0.55);
    opacity:1;                       /* it is finished, not unavailable */
  }
  .opts button.done::after{ content:' ✓'; opacity:0.8; }
  .opts button.done:disabled{ cursor:default; }
  .opts button.wrong{
    background:rgba(224,74,58,0.18); color:#ff9d90; border-color:rgba(224,74,58,0.6);
  }
  /* ---------- the anagram round ----------
     A tray of letters and the boxes they go into, dragged with pointer events —
     HTML5 drag-and-drop does not exist on touch, so this is press, move, release,
     hit-tested with elementFromPoint. A tap is honoured too, and that is not a
     fallback for tidiness: dragging on a small screen misses, and a letter that
     refuses to move because the thumb travelled four pixels is a student who thinks
     the round is broken. */
  #arrange{ display:none; width:100%; flex-direction:column; gap:14px; align-items:center; }
  /* `touch-action:none` or the browser claims the gesture as a scroll and the
     pointermove events stop arriving halfway through a drag. */
  #arrange *{ touch-action:none; }
  /* **One row each, divided, never wrapped.** A fixed minimum width wrapped a
     seven-letter word to six-and-one on a 390px handset, which reads as a mistake
     rather than as a word — and the stray box on its own line is exactly where a
     thumb aims first. A grid of `n` equal columns keeps the whole word on one line
     at any length, and it lines the tray up *under its own boxes*, so the letter a
     student is dragging is directly below where it has to go.

     `--ana-n` is the letter count, set from the arm, because CSS cannot count the
     children it is laying out. */
  #ana-slots, #ana-tray{
    display:grid; grid-template-columns:repeat(var(--ana-n, 7), minmax(0, 1fr));
    gap:6px; width:100%;
  }
  /* **Words break at four a line, and the board breaks at the same four.** A
     letter row divides into `--ana-n` equal columns because every tile is one
     character wide; a sentence cannot, so it used to wrap to whatever fitted 390px
     — and the clue card wrapped to whatever fitted 636px, so the same nine words
     were 3·3·3 here and 6·3 on the wall. One question wearing two shapes, and a
     student looking up has to find their place again.

     The column count is `HubBuzzer.wordCols`, the one file this page and the board
     both load, so the two agree by construction rather than by measurement. Rows
     first, then the words spread evenly across them, so nine are 3·3·3 and never
     4·4·1 — a box alone on a line reads as a mistake and is where a thumb aims.

     Flex until `buildArrange` has measured its widest word, then gridded: in the
     grid a tile is as wide as its column, so measuring then would report the
     layout back to itself. */
  #arrange.words #ana-slots, #arrange.words #ana-tray{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center;
  }
  #arrange.words #ana-slots.gridded, #arrange.words #ana-tray.gridded{
    display:grid; justify-content:center;
    grid-template-columns:repeat(var(--ana-cols, 4), minmax(0, var(--ana-slot-w, 1fr)));
  }
  #arrange.words .gridded > *{ width:100%; min-width:0; }
  /* `--ana-fit` is 1 unless four columns of the longest word are wider than the
     screen. Only the type scales — the padding here is px, not em — which is why
     the fit is worked out against the word inside the box in `buildArrange`. */
  #arrange.words .ana-slot, #arrange.words .ana-tile{
    font-size:calc(1rem * var(--ana-fit, 1));
    height:auto; min-height:42px; padding:8px 12px;
    min-width:2.4em; text-transform:none; white-space:nowrap;
  }
  /* A number rather than an empty box: on a ten-word sentence it is the only way to
     see which slot is which without counting from the left every time.
     **Quieter by opacity and weight, never by font-size** — a smaller font makes a
     shorter box, so the first word to land in a row made that row taller and the
     card grew under the room. The clue card paid for this one; the handset had the
     same bug and it was never reported because nobody watches two phones at once. */
  #arrange.words .ana-slot:not(.filled){ opacity:0.5; font-weight:500; }
  /* Sized off the column rather than fixed, so a ten-letter word shrinks instead of
     overflowing. Capped, or a three-letter word draws three enormous tiles. */
  .ana-slot, .ana-tile{
    font-size:min(1.5rem, calc((100vw - 46px) / var(--ana-n, 7) * 0.62));
    height:min(54px, calc((100vw - 46px) / var(--ana-n, 7) * 1.25));
  }
  .ana-slot{
    min-width:0; border-radius:12px;
    display:inline-flex; align-items:center; justify-content:center;
    font-weight:700; text-transform:uppercase;
    border:2px dashed rgba(255,255,255,0.3); color:#eaf0ff; background:transparent;
  }
  .ana-slot.filled{
    border-style:solid; background:var(--team, #ffc83d); color:#0a0d26;
    border-color:var(--team, #ffc83d);
  }
  /* The box the finger is currently over. Without it a drag is a guess about where
     the letter will land. */
  .ana-slot.over{ border-color:var(--blue); border-style:solid; background:rgba(0,160,223,0.25); }
  .ana-tile{
    min-width:0; border-radius:12px; padding:0;
    display:inline-flex; align-items:center; justify-content:center;
    font-family:inherit; font-weight:700; text-transform:uppercase;
    background:#16204f; color:#eaf0ff; border:2px solid rgba(255,255,255,0.28);
  }
  /* A letter that is in a box stays in the tray, greyed. Removing it would reflow
     the tray under the thumb mid-puzzle, and the tray is also the reference list of
     what the word is made of. */
  .ana-tile.used{ opacity:0.28; }
  /* The tile that follows the finger. Fixed, and out of the way of hit-testing, or
     elementFromPoint would return the clone on every move.

     **It is the size of the tile you picked up, and nothing else.** It used to be
     appended to `document.body`, which put it outside `#arrange` — so in words mode
     none of the `#arrange.words` rules reached it and it took the *letters* sizing,
     `padding:0`, its content width instead of its column width, and uppercase. Four
     changes at once, which reads as the word warping the moment you touch it. It is
     drawn inside `#arrange` now, and `anaGrab` pins the width, height and type size
     off the tile it came from.

     `scale(1.14)` went with it. It was there to say "lifted", and saying that by
     changing the size is the same complaint one step smaller — a shadow says it
     without moving anything. */
  #ana-drag{
    position:fixed; z-index:99; pointer-events:none; opacity:0.94;
    box-sizing:border-box; transform:translate(-50%,-50%);
    box-shadow:0 8px 18px rgba(0,0,0,0.45);
  }
  #ana-note{ font-size:0.85rem; opacity:0.7; text-align:center; min-height:1.2em; }
  .write{ display:none; width:100%; gap:10px; flex-direction:column; }
  /* Typing comes before buzzing, so the box sits between the question and the
     button: the flow reads top to bottom and the thumb ends on the thing that
     fires. Ordered explicitly rather than with one negative order, which hoisted
     the box above the question itself. */
  #screen-play.mode-type #who{ order:0; }
  #screen-play.mode-type #qtext{ order:1; }
  #screen-play.mode-type #write{ order:2; }
  #screen-play.mode-type #buzzer{ order:3; }
  #screen-play.mode-type #state{ order:4; }
  #screen-play.mode-type #status{ order:5; }
  .write input{
    font: inherit; font-size:1.1rem; padding:14px; border-radius:12px; width:100%;
    background:#0c1130; color:#eaf0ff; border:2px solid rgba(255,255,255,0.22);
  }
</style>
</head>
<body>

<div class="screen active" id="screen-join">
  <h1>Engishism · Buzzer</h1>
  <label for="code">Game code</label>
  <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="00000" autocomplete="off">
  <label for="name">Your name</label>
  <input id="name" maxlength="24" placeholder="Name" autocomplete="off">
  <label id="team-label">Your team</label>
  <div class="teams" id="teams"></div>
  <button class="go" id="join-btn" disabled>Join</button>
  <p class="err" id="join-err"></p>
  <p class="note">Your teacher has the code on the big screen.</p>
</div>

<!-- Fires when the projector reveals a part of the answer. Outside every screen
     because it is fixed and belongs to none of them. -->
<div class="lookup" id="lookup" aria-live="polite">↑ Look up — something appeared</div>

<div class="screen" id="screen-play">
  <!-- Which room this phone is in, kept on screen. A student who joined on the
       wrong code, or drifted onto a neighbouring class's game, had no way to tell:
       every screen after joining looked identical whichever room it was. -->
  <p class="room" id="room"></p>
  <p class="who" id="who"></p>
  <!-- How this question is being played, in the round's own words — "A team answers
       only when all of them agree". A teacher sets that per game and cannot then
       remember which board is running which, and the phone is the one screen
       actually in the room's hands. It sits above the question because it is a rule
       you read once and then stop looking at, not part of what is being asked. -->
  <p class="qnote" id="qnote"></p>
  <p class="qtext" id="qtext"></p>
  <!-- how long is left on this round, when the host set a clock -->
  <p class="clock" id="round-clock"></p>
  <button id="buzzer" disabled>Wait</button>
  <div class="opts" id="opts"></div>
  <!-- The anagram round: a tray of letters and the boxes they go into. Its own
       element rather than a shape inside #opts, because a tile here is identified
       by its *slot*, not by its text — three Es in SENTENCE are three tiles, and
       everything in #opts keys a pick by what it says. -->
  <div id="arrange">
    <div id="ana-slots"></div>
    <div id="ana-tray"></div>
    <p id="ana-note"></p>
  </div>
  <!-- The commit beat for a room of individuals: taps only select, this sends.
       Shown only when the arm asks for it (`send`), which the host does in solo —
       in a team room the live taps are the negotiation and this never appears. -->
  <button class="go" id="commit" style="display:none">Send</button>
  <!-- Bingo: this phone's own card, which is the first thing here that outlives a
       question. Nine words, tap the one the clue is describing. -->
  <div class="card" id="card"></div>
  <div class="write" id="write">
    <!-- autocorrect and spellcheck off, deliberately: the race is to produce the
         word, and a phone that finishes it turns a language task into a typing one -->
    <input id="reply" maxlength="60" placeholder="Type your answer" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button class="go" id="send">Send</button>
  </div>
  <p id="state">Waiting for the teacher…</p>
  <p id="status"></p>
  <!-- The way out of a remembered seat. Rejoining silently is right for a reload
       mid-round, and wrong the day the phone changes hands or the student picked
       the wrong team — without this, a phone with a seat in the current room could
       never reach the name-and-team screen again. -->
  <button class="rejoin" id="rejoin">Not you? Change name or team</button>
</div>

<script src="game-hub/hub-buzzer.js?v=20260818a"></script>
<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);

  // relay defaults to wherever this page came from; ?relay=https://… overrides it
  const RELAY = params.get('relay') || '';

  /* A simulated phone (the bench opens this page in iframes: ?auto=1&name=&team=).
     It joins by itself and — crucially — never touches the seat: every iframe on
     the bench shares this origin's localStorage, so one seat key would be fought
     over by every fake phone and clobber the real phone's. */
  const SIMULATED = params.get('auto') === '1';

  let team = 0, teamNames = ['Team 1','Team 2'], client = null;

  /* The one palette, shared with the projector via hub-buzzer.js. Guarded because
     this page has to survive that script being absent — the whole phone layer is
     optional, and a missing colour must not stop anybody joining. */
  const colourOf = i => (window.HubBuzzer && HubBuzzer.teamColour)
                        ? HubBuzzer.teamColour(i) : '#00A0DF';

  function renderTeams(){
    const wrap = $('teams'); wrap.innerHTML='';
    teamNames.forEach((n,i)=>{
      const b=document.createElement('button');
      const sw = document.createElement('span');
      sw.className = 'swatch';
      /* On the chosen button the whole surface is already the team's colour, so
         the swatch goes dark to stay visible against it. Decided here rather than
         in a `.on .swatch` rule, which an inline background would have beaten. */
      sw.style.background = (i===team) ? 'rgba(18,38,63,0.42)' : colourOf(i);
      b.appendChild(sw);
      b.appendChild(document.createTextNode(n));
      b.className = (i===team) ? 'on' : '';
      // the chosen team fills with its own colour rather than one shared yellow,
      // so the choice and the identity are the same fact
      b.style.background   = (i===team) ? colourOf(i) : '';
      b.style.borderColor  = colourOf(i);
      b.addEventListener('click', ()=>{ team=i; renderTeams(); });
      wrap.appendChild(b);
    });
  }
  renderTeams();

  /* Who this handset belongs to, in their team's colour. One definition because it
     was written out in two places already. Takes the name rather than reading one:
     the player's name is a parameter of joinRoom, and an undeclared `name` here
     would quietly resolve to `window.name` — an empty string, on every handset. */
  function paintWho(who){
    $('who').textContent = who + ' ';
    /* **A room of individuals gets no tag and no colour, and that is a decision
       rather than a tidy-up.** A colour on a handset means "this is the side you are
       on" — it is how a student matches themselves to a coloured row on the board.
       In individual play there are no sides, so a colour would be decoration that
       looks like information, and the tag would print the name the line above
       already says.

       It also removes a whole class of wrong: the tag read whatever competitor sat
       at this phone's index, so a handset that had not been re-seated announced
       somebody else's name in confident blue. Nothing to be stale when nothing is
       drawn. */
    if(joinSolo){
      document.documentElement.style.removeProperty('--team');
      return;
    }
    document.documentElement.style.setProperty('--team', colourOf(team));
    const pill = document.createElement('span');
    pill.className = 'tteam';
    pill.textContent = teamNames[team] || ('Team ' + (team+1));
    $('who').appendChild(pill);
  }

  /* The real teams, before joining. This screen used to offer a hard-coded two, so
     a class split into four could only pick from the first half — and a team the
     teacher had renamed to something the room actually answers to still read
     "Team 2" here. The room knows; ask it as soon as there is a code to ask about.

     Failure is silent on purpose: a wrong code, a relay that has not heard of this
     room yet, no network. The default pair stays and the student can still join —
     the code is validated by the connection attempt, not by this. */
  let teamsFor = '';
  function loadTeams(force){
    const code = $('code').value.trim();
    if(!/^\d{4,6}$/.test(code) || (!force && code === teamsFor)) return;
    teamsFor = code;
    fetch((RELAY || '') + '/buzzer/room?code=' + encodeURIComponent(code))
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if(!d || $('code').value.trim() !== code) return;
        /* **In a room of individuals there is nothing to pick.** Everyone gets their
           own score, and the teacher's board gives this phone a slot of its own the
           moment it arrives — so asking a student to choose a team here would be
           asking them to answer a question that has no answer, and whatever they
           chose would be overwritten a second later. Name only. */
        setSolo(!!d.solo);
        if(!d.teams || !d.teams.length) return;
        teamNames = d.teams;
        if(team >= teamNames.length) team = 0;   // the choice has to stay on the list
        renderTeams();
      })
      .catch(()=>{});
  }

  /* Solo is a property of the room, learned from it — never a thing this page can
     decide. Both the label and the buttons go, because a heading over nothing reads
     as a list that failed to load. */
  let joinSolo = false;
  function setSolo(on){
    if(joinSolo === on) return;
    joinSolo = on;
    /* **The handset does not reset its own team here, and that one line cost three
       wrong diagnoses.** It used to zero `team` on the way into solo — which looks
       harmless, because solo draws no tag and no colour so nothing reads it there.
       What it actually did was make the phone disagree with the relay in a way only
       the phone knew about: the relay tells a handset its team **only when its own
       record changes**, so when the board later restored this student to the side
       they chose, the relay saw the number it already held, sent nothing, and the
       phone stayed on 0. One flip to solo and back looked fine; the next left every
       handset reading TEAM 1.

       `team` is now written in exactly two places — the student picking a side, and
       a `team` event from the room. Nothing local guesses at it. */
    $('team-label').style.display = on ? 'none' : '';
    $('teams').style.display      = on ? 'none' : '';
    /* The way back offers what there is to change. In a room of individuals there
       is no team to pick — the screen it returns to does not ask for one — so
       saying "or team" offers something that cannot happen. Small, and it is the
       same complaint as a rack drawing team headers over a room of people: the
       handset should say what the room actually is. */
    $('rejoin').textContent = on ? 'Not you? Change name' : 'Not you? Change name or team';
  }

  function validate(){
    $('join-btn').disabled = !(/^\d{4,6}$/.test($('code').value.trim()) && $('name').value.trim());
  }
  $('code').addEventListener('input', ()=>{ validate(); loadTeams(); });
  $('name').addEventListener('input', validate);
  if(params.get('code')){ $('code').value = params.get('code'); }
  validate();
  loadTeams();               // scanned in? then the code is already there

  /* And keep the list current while the student is still choosing. This fetch used
     to run once per code, so a team the teacher added *after* this page loaded was
     never pickable — the student had to join, or reload, to see it. Joined phones
     get changes pushed over their stream; the join screen has no stream yet, so it
     asks again. Same silent failure as above: a dead relay changes nothing. */
  setInterval(()=>{
    if($('screen-join').classList.contains('active')) loadTeams(true);
  }, 4000);

  function show(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    $(id).classList.add('active');
  }

  // a short tick so a buzz feels like it did something even before the screen changes
  let audio=null;
  function blip(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
      audio = audio || new AC();
      if(audio.state==='suspended') audio.resume();
      const o=audio.createOscillator(), g=audio.createGain(), t=audio.currentTime;
      o.type='square'; o.frequency.setValueAtTime(880,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.16,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t+0.16);
    }catch(e){}
  }

  function setBuzzer(mode, text){
    const b=$('buzzer');
    b.className = mode==='won' ? 'won' : '';
    b.disabled  = mode!=='armed';
    b.textContent = text;
  }

  /* The phone is three things depending on what the teacher is asking for:
     a buzzer racing for the floor, a set of options to pick one of, or a box to
     type into. Only one is ever on screen. */
  let mode = 'buzz', answered = false, coolTimer = null, verdictUntil = 0;
  /* The commit beat. `needSend` is the arm asking for it; `sentValue` is what
     this phone last transmitted, so Send only lights when the answer changed;
     `cooling` is a wrong Send being waited out — it gates every input the round
     offers, because a countdown you can tap through is not a penalty. */
  let needSend = false, sentValue = null, cooling = false, preview = false;
  /* Which of this phone's options are finished with — its own placed words, sent by
     the host on the arm and on the join. Held here rather than read off the DOM so a
     reconnect repaints them: the marks are the player's record of their own ladder,
     and losing them on a reload was the same bug as losing the answer. */
  let doneWords = [];
  let canRethink = false, timeUp = false, roundTimer = null;
  /* How many options this phone may hold at once, and which it is holding. One is
     a vote; more is a *selection*, which is what a team assembling a group needs —
     a team of two phones cannot build a four-word answer at one vote each. */
  let maxPicks = 1, myPicks = [];
  // the state line, unless a verdict is still being read
  function say(text){ if(Date.now() > verdictUntil) $('state').textContent = text; }
  /* Some rounds belong to one team: Blockbusters asks the team on turn which
     hexagon to attack, and the rest of the room is watching, not choosing. A phone
     that is not entitled shows the question and no controls, rather than a live
     button whose press would be thrown away on arrival. */
  function myRound(d){
    const t = d && d.turnTeam;
    return t == null || Number(t) === Number(team);
  }
  /* This phone's bingo card. `marked` comes back from the relay, so a phone that
     drops off the wifi and rejoins gets its card *and* its marks, rather than a
     blank one — which for a game played over a whole round is the difference
     between rejoining and starting again. */
  let card = null, cardBusy = false;

  function renderCard(){
    const box = $('card');
    box.innerHTML = '';
    if(!card){ return; }
    card.words.forEach((w, i)=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = w;
      if(card.marked[i]) b.classList.add('marked');
      // busy only blocks the tap that is in flight, not the whole card for the rest
      // of the call — two students on the same table tap within a second of each other
      b.disabled = !!card.marked[i] || mode !== 'card';
      b.addEventListener('click', ()=> tapCard(i, b));
      box.appendChild(b);
    });
  }

  function tapCard(i, btn){
    if(!client || !card || card.marked[i] || cardBusy) return;
    cardBusy = true; blip();
    btn.disabled = true;
    $('state').textContent = 'Sent…';
    // judged on the host, which is the only place that knows the answer
    client.respond(card.words[i]);
  }

  function setMode(m, opts, mine){
    mode = m || 'buzz';
    answered = false;
    if(mine === false) mode = 'watch';
    // 'type' is both at once: the box to write in and the button to claim the floor
    $('buzzer').style.display = (mode==='buzz' || mode==='type') ? '' : 'none';
    $('opts').style.display   = mode==='vote'   ? 'flex' : 'none';
    $('arrange').style.display = mode==='arrange' ? 'flex' : 'none';
    $('write').style.display  = (mode==='answer' || mode==='type') ? 'flex' : 'none';
    // the card stays on screen between calls — it is the student's own board, not
    // a control that belongs to one question
    $('card').style.display   = card ? 'grid' : 'none';
    $('card').classList.toggle('live', mode==='card');
    // 'card-idle' is a card on screen between calls: visible, readable, not tappable
    if(mode === 'card-idle') $('buzzer').style.display = 'none';
    $('send').style.display   = mode==='type' ? 'none' : '';   // the buzzer sends it
    /* A fresh mode retires the last question's commit state with it. */
    cooling = false; sentValue = null;
    $('commit').style.display = (needSend && (mode==='vote' || mode==='arrange')) ? '' : 'none';
    $('commit').disabled = true;
    $('commit').textContent = 'Send';
    $('screen-play').classList.toggle('mode-type', mode==='type');
    /* Cleared on every round, not only when a vote sets it: it hides the buzzer,
       so a leftover from the previous question would leave a buzz round with no
       button at all. */
    $('screen-play').classList.remove('many-opts');
    $('opts').classList.remove('compact');
    if(mode==='vote'){
      const box=$('opts'); box.innerHTML='';
      const list = opts || [];
      const keypad  = list.length > 4 && list.every(o=>String(o).length <= 2);
      // more than a handful of *words*: two columns, so they all fit at once
      const compact = !keypad && list.length > 6;
      box.classList.toggle('grid', keypad);
      box.classList.toggle('compact', compact);
      $('screen-play').classList.toggle('many-opts', compact);
      /* The inline display set above wins over any class, so the layout has to be
         chosen here rather than in CSS alone. */
      box.style.display = compact ? 'grid' : 'flex';
      list.forEach(o=>{
        const b=document.createElement('button');
        b.type='button'; b.textContent=o;
        /* Finished with: green, and not tappable. It stays on the list because a
           list that shrinks moves every other box on the screen. */
        if(doneWords.indexOf(o) !== -1){ b.classList.add('done'); b.disabled = true; }
        b.addEventListener('click', ()=>{
          if(!client) return;
          if(cooling) return;        // a wrong Send is being waited out
          if(b.classList.contains('done')) return;   // already on your ladder
          // a new choice retires the last wrong one — the red described that answer
          [...box.children].forEach(x=>x.classList.remove('wrong'));
          /* A team vote is an argument, not a submission: the point is that they
             talk and move. So while the host allows rethinking, a tap replaces
             this phone's choice instead of locking the handset — the relay keys
             replies by player, so the tally follows. Without it the first tap was
             final and there was nothing left to negotiate with. */
          if(!needSend && answered && !canRethink && maxPicks === 1) return;
          if(timeUp) return;
          blip();
          if(maxPicks > 1){
            // a selection: tap to add, tap again to drop, up to the cap
            const at = myPicks.indexOf(o);
            if(at !== -1) myPicks.splice(at, 1);
            else if(myPicks.length < maxPicks) myPicks.push(o);
            else { $('state').textContent = 'Drop one first — ' + maxPicks + ' is the most'; return; }
          } else {
            myPicks = [o];
          }
          paintPicks(box);
          /* The commit beat: a tap only selects. Nothing leaves this phone until
             Send, which is what makes a guess cost a decision rather than being
             free — the button lights when the selection differs from what was
             last sent. */
          if(needSend){
            /* **Send follows what is in your hand, not what you last transmitted.**
               It used to stay dead until the answer *changed* — a second guard on
               top of the cooldown, meant to stop somebody re-sending the same wrong
               thing. What it actually produced was a dead end: a word you had sent
               once could never be sent again, so a phone whose reply was dropped
               rather than judged was stuck on it for the rest of the question with
               the line below telling it to press a button that did nothing. Seen in
               a real class of sixteen and reproduced exactly. The escalating
               cooldown is the anti-mash mechanism and it is enough on its own. */
            $('commit').disabled = cooling || !voteReady();
            $('commit').textContent = 'Send';
            /* **A preview, not an answer.** Marked so the host can tell the two
               apart on one wire, and suppressed while a Send is still waiting for
               its verdict — a preview overwrites the held reply, so sending one on
               top of an answer in flight would throw that answer away, which is the
               "it did not register" bug in a new coat. */
            if(preview && !sentValue && myPicks.length && window.HubBuzzer)
              client.respond(window.HubBuzzer.PREVIEW + myPicks.join('|'));
            /* The message and the button have to agree — that they did not is half
               of what made the dead end so hard to read from the front of a room. */
            $('state').textContent = maxPicks > 1 ? shareLine()
              : ($('commit').disabled ? 'Waiting…' : 'Press Send when you are sure');
            return;
          }
          answered = true;
          $('state').textContent = maxPicks > 1 ? shareLine()
            : (canRethink ? 'Tap another to change' : 'Answer sent');
          if(maxPicks === 1 && !canRethink) [...box.children].forEach(x=>{ x.disabled = true; });
          /* One reply carrying the whole selection: the relay stores one value per
             player, and what that value *means* is the host's business. */
          client.respond(myPicks.join('|'));
        });
        box.appendChild(b);
      });
    }
    if(mode==='arrange') buildArrange(opts || []);
    if(mode==='answer'){ $('reply').value=''; $('reply').disabled=false; $('send').disabled=false; }
    if(mode==='type'){
      $('reply').value=''; $('reply').disabled=false;
      $('reply').placeholder = 'The missing word';
      setBuzzer('off','Type it');
      setTimeout(()=>{ try{ $('reply').focus(); }catch(e){} }, 60);
    }
  }

  /* ---------- the anagram round: letters into boxes ----------
     Everything here keys a tile by its **slot in the tray**, never by the letter on
     it. That is the whole reason this is not a shape inside `#opts`: SENTENCE has
     three Es, and keying by text would light all three at once and make the word
     impossible to assemble. The relay is untouched by any of it — the reply is the
     same `|`-joined list a multi-pick vote sends, in the order the letters were
     placed, and what that means stays the host's business. */
  let anaTiles = [];        // [{ ch, el }] the tray, in the order the card drew it
  let anaSlots = [];        // slot -> tray index, or null
  let anaDrag  = null;      // the in-flight drag, if any

  function buildArrange(list){
    const tray = $('ana-tray'), slots = $('ana-slots');
    // the column count, which CSS cannot work out for itself
    $('arrange').style.setProperty('--ana-n', String(list.length || 1));
    /* Letters or words, decided by looking rather than by being told — the arm
       carries a list of strings and nothing about what they are, which is what let
       the word order round reuse this mode without the relay or the handset
       learning a second thing. Same test `#opts` uses to pick a keypad over a
       list. */
    $('arrange').classList.toggle('words', list.some(o => String(o).length > 2));
    /* Back to wrapping flex and no measured width, so the tiles below are laid out
       at their natural size for the measure. Last round's numbers must not be the
       ruler this round is measured against. */
    slots.classList.remove('gridded'); tray.classList.remove('gridded');
    $('arrange').style.removeProperty('--ana-slot-w');
    $('arrange').style.removeProperty('--ana-fit');
    // the dragged tile lives in here now, so a re-arm mid-drag must not leave one behind
    const stray = document.getElementById('ana-drag');
    if(stray) stray.remove();
    tray.innerHTML = ''; slots.innerHTML = '';
    anaTiles = []; anaSlots = list.map(()=> null); anaDrag = null;
    list.forEach((ch, i)=>{
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'ana-tile'; b.textContent = ch;
      b.dataset.i = String(i);
      b.addEventListener('pointerdown', e => anaGrab(e, i, null));
      tray.appendChild(b);
      anaTiles.push({ ch, el:b });
    });
    list.forEach((_, s)=>{
      const d = document.createElement('div');
      d.className = 'ana-slot'; d.dataset.slot = String(s);
      d.dataset.n = String(s + 1);
      d.addEventListener('pointerdown', e => anaGrab(e, anaSlots[s], s));
      slots.appendChild(d);
    });
    /* One column width for both rows, taken from the widest tray tile — same word,
       same font, same padding, so the measure is exact. Fixed here, once, is what
       keeps the grid of boxes identical on every phone whatever each has placed;
       letting a slot grow to its word reflowed the row on every drop, and eight
       phones on the bench then showed eight different grids. */
    if($('arrange').classList.contains('words')){
      const a = $('arrange');
      let w = 0;
      anaTiles.forEach(t => { w = Math.max(w, t.el.offsetWidth); });
      /* The same line break as the clue card, from the one file both load. */
      const cols = (window.HubBuzzer && window.HubBuzzer.wordCols)
                     ? window.HubBuzzer.wordCols(list.length) : list.length;
      a.style.setProperty('--ana-cols', String(cols));
      /* **Four columns of a long word can be wider than the phone.** The columns
         give way first, and the type after them: the padding here is px, so only
         the word inside the box scales, and the fit is worked out against the word
         rather than the box. Floored, because a word nobody can read is not a
         better answer than a word that wraps. */
      const room = tray.clientWidth || 0;
      const per  = room > 0 ? Math.floor((room - (cols - 1) * 6) / cols) : w;
      const PAD  = 26;                       // 12px each side, plus the 2px border
      if(w){
        a.style.setProperty('--ana-slot-w', Math.min(w, per > 0 ? per : w) + 'px');
        const fit = (per > 0 && per < w && w > PAD)
                      ? Math.max(0.62, (per - PAD) / (w - PAD)) : 1;
        a.style.setProperty('--ana-fit', String(Math.round(fit * 100) / 100));
      }
      slots.classList.add('gridded'); tray.classList.add('gridded');
    }
    paintArrange();
  }

  function paintArrange(){
    const slots = [...$('ana-slots').children];
    slots.forEach((d, s)=>{
      const t = anaSlots[s];
      d.classList.toggle('filled', t != null);
      d.classList.remove('over');
      /* The slot number when empty, in words mode: a blank box in a row of ten
         tells a student nothing about which position they are filling. Letters keep
         a blank box, because there the boxes spell the word and a row of digits
         would be noise. */
      d.textContent = t != null ? anaTiles[t].ch
        : ($('arrange').classList.contains('words') ? d.dataset.n : '');
    });
    anaTiles.forEach((t, i) => t.el.classList.toggle('used', anaSlots.indexOf(i) !== -1));
    const placed = anaSlots.filter(x => x != null).length;
    /* Letters or words, from the same look at the options that chose the layout —
       "drag the letters" over a shuffled sentence is the round telling a student
       the wrong thing about what they are holding. */
    const what = $('arrange').classList.contains('words') ? 'word' : 'letter';
    $('ana-note').textContent = timeUp ? 'Time!'
      : placed === anaSlots.length ? (needSend ? 'Press Send when you are sure'
                                              : ('Sent — drag a ' + what + ' out to change it'))
      : ('Drag the ' + what + 's into the boxes · ' + placed + ' of ' + anaSlots.length);
  }

  /* The answer: what is in each box, **in box order and including the empty ones**,
     which is why a gap goes on the wire as an empty segment rather than being
     skipped. Every reader on the other side already drops empties before judging —
     the round filters them out — so this is the same dense list it always was to a
     game, and the host still only judges an arrangement once every box is full.

     What the positions buy is the restore below: a phone that reconnects mid-puzzle
     gets its words back **in the boxes it put them in**. Sending only the filled
     ones lost that — three words with a gap between them came back packed against
     the left, which is a different answer from the one the student built. */
  function arrangeWire(){
    return anaSlots.map(i => i == null ? '' : anaTiles[i].ch).join('|');
  }
  function sendArrange(){
    if(!client) return;
    /* The commit beat: an arrangement travels when the player presses Send, not
       on every placement — which is what stops trying permutations against the
       judge. The button lights only when the boxes differ from what was sent. */
    if(needSend){
      /* Same rule as the vote branch: what is in your hand, never what you last
         sent — a comparison against history is a dead end when a reply goes astray. */
      $('commit').disabled = cooling || !arrangeWire();
      return;
    }
    answered = true;
    client.respond(arrangeWire());
  }

  /* Send — the commit beat's one button, for vote and arrange alike. What is in
     hand travels exactly as the live path would have sent it, so the relay and
     the host cannot tell the two apart. */
  $('commit').addEventListener('click', ()=>{
    if(!client || cooling || timeUp) return;
    const cur = mode === 'arrange' ? arrangeWire() : myPicks.join('|');
    if(cur === sentValue) return;
    blip();
    sentValue = cur;
    answered = true;
    client.respond(cur);
    $('commit').disabled = true;
    $('commit').textContent = 'Sent';
    $('state').textContent = 'Answer sent — change it to send again';
  });

  /* Put a phone back where it was. A handset holds its arrangement in memory only,
     so *anything* that rebuilds the page threw it away — a reconnect, the screen
     locking, the browser backgrounding the tab, a wobble on the school wifi. To the
     student that reads as "my sentence just vanished", with nothing to blame it on,
     which is exactly how it was reported.

     The relay has held each player's own reply all along and hands it back as
     `yours` on the way in; the restore was simply written for `vote` and never
     extended when `arrange` was added. Tiles are consumed as they are matched, so
     a sentence with "The" and "the" in it puts each one back in its own box. */
  function restoreArrange(seq){
    const used = anaTiles.map(()=> false);
    seq.forEach((w, slot)=>{
      if(!w || slot >= anaSlots.length) return;
      const i = anaTiles.findIndex((t, k) => !used[k] && t.ch === w);
      if(i === -1) return;
      used[i] = true; anaSlots[slot] = i;
    });
    paintArrange();
  }

  function anaPut(tile, slot){
    if(tile == null) return;
    // a letter can only be in one box, so taking it somewhere else empties the old
    const was = anaSlots.indexOf(tile);
    if(was !== -1) anaSlots[was] = null;
    if(slot != null){
      // dropping onto a full box sends whatever was there back to the tray
      anaSlots[slot] = tile;
    }
    paintArrange();
    sendArrange();
  }

  function anaGrab(e, tile, fromSlot){
    if(timeUp || tile == null || !client) return;
    if(cooling) return;              // a wrong Send is being waited out

    e.preventDefault();
    const el = document.createElement('div');
    el.id = 'ana-drag'; el.className = 'ana-tile filled';
    el.style.background = 'var(--team, #ffc83d)'; el.style.color = '#0a0d26';
    el.textContent = anaTiles[tile].ch;
    /* **The same size as the tile it came from.** Pinned off that tile rather than
       left to the stylesheet: a tray tile is as wide as its grid column and a slot
       is as wide as its own, so there is no rule that could say it — only the
       element. Inside `#arrange`, not on `document.body`, so everything the pin
       does not cover (the type face, the case, the padding) is inherited instead
       of guessed. */
    const src = fromSlot == null ? anaTiles[tile].el
                                 : $('ana-slots').children[fromSlot];
    if(src){
      el.style.width  = src.offsetWidth + 'px';
      el.style.height = src.offsetHeight + 'px';
      el.style.fontSize = getComputedStyle(src).fontSize;
    }
    $('arrange').appendChild(el);
    anaDrag = { tile, fromSlot, el, x:e.clientX, y:e.clientY, moved:0 };
    anaMoveTo(e.clientX, e.clientY);
    try{ e.target.setPointerCapture(e.pointerId); }catch(err){}
    const move = ev => {
      if(!anaDrag) return;
      anaDrag.moved += Math.abs(ev.clientX - anaDrag.x) + Math.abs(ev.clientY - anaDrag.y);
      anaDrag.x = ev.clientX; anaDrag.y = ev.clientY;
      anaMoveTo(ev.clientX, ev.clientY);
    };
    const up = ev => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      anaDrop(ev.clientX, ev.clientY);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  }

  function anaMoveTo(x, y){
    if(!anaDrag) return;
    anaDrag.el.style.left = x + 'px';
    anaDrag.el.style.top  = y + 'px';
    const over = anaSlotAt(x, y);
    [...$('ana-slots').children].forEach((d, s) => d.classList.toggle('over', s === over));
  }

  /* The clone carries `pointer-events:none`, so this returns what is *under* the
     finger rather than the thing following it. */
  function anaSlotAt(x, y){
    const el = document.elementFromPoint(x, y);
    const box = el && el.closest ? el.closest('.ana-slot') : null;
    return box ? Number(box.dataset.slot) : null;
  }

  function anaDrop(x, y){
    if(!anaDrag) return;
    const { tile, fromSlot, moved, el } = anaDrag;
    el.remove(); anaDrag = null;
    let target = anaSlotAt(x, y);
    /* A tap, not a drag. Dragging on a phone misses, and a letter that will not
       move because the thumb travelled a few pixels reads as a broken round — so a
       tap on a tray tile fills the first empty box, and a tap on a full box empties
       it. Same two gestures every word game on a phone offers. */
    if(moved < 8){
      if(fromSlot != null) target = null;
      else target = anaSlots.indexOf(null);
      if(target === -1){ paintArrange(); return; }   // every box already full
    }
    // dropped on nothing: back to the tray, which is how a letter is taken out
    anaPut(tile, target);
    blip();
  }

  /* How this phone is doing against its share. Separate from the tap handler
     because the share can move without anybody tapping: a team gains or loses a
     player and every handset on it gets a new cap mid-round. Being *over* the cap
     is a legitimate state — it is what a team has to talk its way out of — so it
     is reported rather than corrected. */
  function shareLine(){
    if(myPicks.length > maxPicks)
      return 'Drop ' + (myPicks.length - maxPicks) + ' — it is ' + maxPicks + ' each now';
    if(maxPicks > 1 && voteReady())
      return 'All ' + maxPicks + ' chosen — press Send';
    return myPicks.length + ' of ' + maxPicks + ' chosen';
  }
  /* **Send waits for the full allotment.** A single-pick vote (`maxPicks` 1) sends on
     its one choice, as it always has; a multi-pick — Connections is the only one — goes
     only once all of them are chosen, so a half-built group cannot be sent and the
     player must complete a set before the board judges it. `maxPicks` is the phone's
     share, so in a room of individuals that is all four, and on a team it is that
     phone's part of the four. */
  function voteReady(){
    return maxPicks > 1 ? myPicks.length >= maxPicks : myPicks.length > 0;
  }

  /* Which of this phone's options are currently held. Kept as a function because
     the picks come back from the relay on a rejoin as well as from a tap. */
  function paintPicks(box){
    [...(box || $('opts')).children].forEach(x=>{
      x.classList.toggle('picked', myPicks.indexOf(x.textContent) !== -1);
    });
  }

  /* In 'type' the button is dead until they have written something — the whole
     point is that the race is to produce the word, not to hit a button first. */
  function syncTypeButton(){
    if(mode !== 'type' || answered) return;
    const ready = !!$('reply').value.trim();
    setBuzzer(ready ? 'armed' : 'off', ready ? 'Buzz' : 'Type it');
  }

  /* The answer clock, when the host armed with one: whoever took the floor has this
     many seconds, and every phone watches it run. Display only — the host's clock
     is the authority, and this one is a duration counted from receipt, so phone
     clocks never need to agree with anybody. */
  let floorClock = null;
  function floorClockStop(){ if(floorClock){ clearInterval(floorClock); floorClock = null; } }
  function floorClockRun(secs, text){
    floorClockStop();
    let left = Math.max(0, Math.round(secs));
    const paint = ()=>{ $('state').textContent = text + ' · ' + left; };
    if(left <= 0){ $('state').textContent = text + ' · time!'; return; }
    paint();
    floorClock = setInterval(()=>{
      left--;
      if(left <= 0){ floorClockStop(); $('state').textContent = text + ' · time!'; return; }
      paint();
    }, 1000);
  }

  /* The round clock — how long the whole room has, as opposed to the answer clock
     which belongs to whoever took the floor. Sent once as a duration and counted
     down from receipt, so no phone ever compares clocks with anybody. Display
     plus a local stop: the host decides what expiry *means*. */
  function roundClockStop(){
    if(roundTimer){ clearInterval(roundTimer); roundTimer = null; }
    const el = $('round-clock');
    el.className = 'clock'; el.textContent = '';
  }
  function roundClockRun(secs){
    roundClockStop();
    let left = Math.max(0, Math.round(secs));
    const el = $('round-clock');
    if(!left) return;
    timeUp = false;
    const paint = ()=>{
      el.className = 'clock on' + (left <= 10 ? ' urgent' : '');
      el.textContent = left + 's';
    };
    paint();
    roundTimer = setInterval(()=>{
      left--;
      if(left <= 0){
        clearInterval(roundTimer); roundTimer = null;
        timeUp = true;
        el.className = 'clock on urgent'; el.textContent = 'time';
        // nothing more can be changed, but what was chosen stays on screen
        $('opts').querySelectorAll('button').forEach(b=>{ b.disabled = true; });
        say('Time — pencils down');
        return;
      }
      paint();
    }, 1000);
  }

  /* A wrong answer costs time, never points: this player alone waits out the
     countdown while everyone else keeps racing. Two shapes, one clock: the typed
     dynamics count down on the buzzer button, the commit rounds (vote and
     arrange) count down on the Send button that caused it — with every input the
     round offers locked, because a penalty you can tap through is not one. */
  function coolDown(until){
    if(coolTimer) clearInterval(coolTimer);
    const commitRound = ()=> (mode === 'vote' || mode === 'arrange');
    const tick = ()=>{
      const left = Math.ceil((until - Date.now())/1000);
      if(left > 0){
        if(commitRound()){
          cooling = true;
          $('opts').querySelectorAll('button').forEach(b=>{ b.disabled = true; });

          $('commit').disabled = true;
          $('commit').textContent = 'Wait ' + left + 's';
        } else setBuzzer('off', String(left));
        return;
      }
      clearInterval(coolTimer); coolTimer = null;
      answered = false;
      if(commitRound()){
        cooling = false;
        /* Everything except what is already settled — a word on this player's ladder
           stays green and untappable, and a blanket re-enable would quietly hand it
           back as a choice. */
        $('opts').querySelectorAll('button').forEach(b=>{
          b.disabled = b.classList.contains('done');
        });
        $('commit').textContent = 'Send';
        /* Ready again the moment the wait is over. It used to stay dead until the
           answer *changed*, which stranded anybody whose reply had gone astray
           rather than come back wrong. The wait is what a wrong Send costs. */
        $('commit').disabled = (mode === 'arrange') ? !arrangeWire() : !voteReady();
        /* The verdict on that Send has been and gone, so the record of it stops
           standing in the way — of sending the same word again if the player still
           believes it, and of previews, which stay quiet while an answer is in
           flight. */
        sentValue = null;
        $('state').textContent = 'Try again — you can send when you are ready';
        return;
      }
      $('reply').disabled = false;
      syncTypeButton();
      $('state').textContent = 'Try again';
      try{ $('reply').focus(); }catch(e){}
    };
    tick();
    coolTimer = setInterval(tick, 200);
  }
  function sendWritten(){
    const v = $('reply').value.trim();
    if(answered || !client || !v) return;
    answered = true; blip();
    $('reply').disabled = true; $('send').disabled = true;
    $('state').textContent = 'Answer sent';
    client.respond(v);
  }

  /* Scanned in? The code is in the URL, so fill it and get out of the way — the
     whole point of the QR is that a student types nothing but their name. */
  (function(){
    try{
      const code = new URLSearchParams(location.search).get('code');
      if(code && /^\d{4,6}$/.test(code)){
        $('code').value = code;
        // hide the field and its own label only — the label is a sibling, so
        // reaching for parentElement here would hide the whole join form
        const lab = document.querySelector('label[for="code"]');
        if(lab) lab.style.display = 'none';
        $('code').style.display = 'none';
        setTimeout(()=>$('name').focus(), 60);
        validate();
      }
    }catch(e){}
  })();

  /* ---- the seat, remembered ----
     A phone reloads for all sorts of ordinary reasons — battery saver, a stray
     swipe, the screen locking hard enough — and until now that meant retyping the
     code and the name mid-round. It also meant a *new identity*, which is fine for
     a buzzer and wrong for anything the room holds on your behalf: a bingo card is
     dealt to a player id, so a reload was dealt a second card and the marks on the
     first were stranded. Same seat, same id, same card. */
  const SEAT = 'engishism.seat';
  function rememberSeat(d){ if(SIMULATED) return;
    try{ localStorage.setItem(SEAT, JSON.stringify(d)); }catch(e){} }
  function forgetSeat(){ try{ localStorage.removeItem(SEAT); }catch(e){} }
  function seat(){
    try{ const d = JSON.parse(localStorage.getItem(SEAT) || 'null');
         return (d && d.code && d.id) ? d : null; }catch(e){ return null; }
  }

  function joinRoom(code, name, id){
    $('join-err').textContent = '';
    /* The stream now reopens itself after the browser gives up on it, which is
       what a phone needs — and what an *abandoned* client must not do. Joining a
       second room (a mistyped code corrected, a stale seat retried) would leave
       the first client polling a dead room in the background forever. */
    if(client){ try{ client.close(); }catch(e){} }
    client = HubBuzzer.player({ relay:RELAY, code, name, team, id });
    /* The joined handset, exposed the same way the hub exposes HubSettings and
       HubGames: it is the only handle on this phone from outside, and the checks
       that matter here are ones a click cannot reach — sending a vote a phone is
       not entitled to send, for one. */
    window.HubPlayer = client;

    client.on('status', s=>{
      $('status').textContent =
        s.state==='connected'    ? 'connected' :
        s.state==='reconnecting' ? 'reconnecting…' : 'can’t reach the game';
      if(s.state==='unreachable' && $('screen-join').classList.contains('active')){
        $('join-err').textContent = 'No game with that code — check the screen.';
        // a remembered seat in a room that has gone must not keep retrying: last
        // lesson's code is not this lesson's
        forgetSeat();
      }
    });

    client.on('joined', d=>{
      if('solo' in d) setSolo(!!d.solo);
      if(d.teams && d.teams.length){ teamNames = d.teams; }
      $('room').innerHTML = 'Room <b>' + String(code).replace(/[^0-9]/g,'') + '</b>';
      paintWho(name);
      show('screen-play');
      rememberSeat({ code, name, team, id:client.id });
      /* Students trickle in — late, on the wrong WiFi, phone locked — so a join
         lands in whatever is currently being asked rather than on a blank screen
         until the next question. The relay sends the room's state with the join,
         and this is the same path an arm takes. */
      if(d.card){ card = { words:d.card.words||[], marked:d.card.marked||[] }; renderCard(); $('card').style.display='grid'; }
      if(d.armed){ applyArmed(d); return; }
      // a late joiner lands mid-lock: the relay sends what is *left* on the clock
      if(d.locked){ setBuzzer('off','Too late');
                    if(d.locked.secs) floorClockRun(d.locked.secs, d.locked.name + ' got in first');
                    else $('state').textContent = d.locked.name + ' got in first'; }
      else        { setBuzzer('off','Wait');    $('state').textContent = 'Waiting for the teacher…'; }
    });

    client.on('card', d=>{
      card = { words:(d && d.words) || [], marked:(d && d.marked) || [] };
      cardBusy = false;
      $('card').style.display = 'grid';
      renderCard();
      say('Your card — listen for your words');
    });
    client.on('marked', d=>{
      if(!card) return;
      if(d && Array.isArray(d.marked)) card.marked = d.marked;
      else if(d && typeof d.index === 'number') card.marked[d.index] = true;
      cardBusy = false;
      renderCard();
      $('state').textContent = 'Yes — marked off';
      if(navigator.vibrate) navigator.vibrate([30,60,30]);
    });
    client.on('nope', ()=>{
      cardBusy = false;
      const box = $('card');
      box.classList.add('miss');
      const wrong = [...box.querySelectorAll('button')];
      wrong.forEach(b=>b.classList.add('wrong'));
      setTimeout(()=>{ wrong.forEach(b=>b.classList.remove('wrong')); box.classList.remove('miss'); renderCard(); }, 420);
      $('state').textContent = 'Not that one';
    });

    /* Renaming a team mid-lesson, or adding a fifth, has to reach the phones — the
       name on the handset is how a student knows the score on the board is theirs. */
    client.on('teams', d=>{
      /* The mode can change mid-lesson — a teacher switching the room to
         individuals between games — and it arrives on the same push as the names. */
      if('solo' in d) setSolo(!!d.solo);
      if(d.teams && d.teams.length){
        teamNames = d.teams;
        renderTeams();
        paintWho(name);
      }
    });

    /* This phone's own team moved — a team was removed on the board and the
       indices shifted under everyone. The pill repaints so the student can see
       where they now are, and the seat is re-remembered so a reload comes back
       to the right team rather than the lesson-old one. */
    client.on('team', d=>{
      team = Math.max(0, Number(d && d.team) || 0);
      renderTeams();
      paintWho(name);
      rememberSeat({ code, name, team, id:client.id });
    });

    function applyArmed(d){
      floorClockStop();          // a fresh floor retires whoever was on the clock
      /* **A round deals its card on the arm**, and updates its marks the same way —
         a round cannot send the relay a second message, so the card rides the arm.
         Applied before the mode is set up, or the grid below draws last call's
         marks for a frame. */
      if(d && d.card){
        card = { words:d.card.words || [], marked:d.card.marked || [] };
        cardBusy = false;
        renderCard();
      }
      canRethink = !!(d && d.rethink);
      /* The commit beat travels on the arm — the host asks for it in a room of
         individuals. Read before the reopen branch, because a reopen skips
         setMode and the flag must still be current. */
      needSend = !!(d && d.send);
      timeUp = false;
      maxPicks = Math.max(1, Number(d && d.multi) || 1);
      myPicks = [];
      /* Read before setMode, which is what paints them. Absent means none, which is
         every round that does not settle its options one at a time. */
      doneWords = (d && Array.isArray(d.done)) ? d.done : [];
      /* Whether the board wants to see what this phone is *looking at*, not only
         what it commits. Absent means no, which is every round before this. */
      preview = !!(d && d.preview);
      // the question has always been sent with the arm; it used to be thrown away
      $('qtext').textContent = (d && d.prompt) || '';
      /* Empty for the four shared dynamics and for a round with one way to play —
         there is no choice to report there, and a line saying nothing is a line of
         screen a handset cannot spare. */
      $('qnote').textContent = (d && d.note) || '';
      const spent = (d && d.spent) || [];
      /* A reopen is the same question coming back because somebody guessed wrong.
         Re-running setMode would wipe the box — and throwing away half a word
         somebody was racing to finish is exactly the wrong thing to do here. */
      if(d && d.reopen && mode === (d.mode || 'buzz')){
        const mine = ((d.cooling||[]).find(c=>c.id===client.id)||{}).until || 0;
        if(mine > Date.now()){ coolDown(mine); return; }
        answered = false; $('reply').disabled = false;
        syncTypeButton();
        say('Still open — go!');
        return;
      }
      setMode(d && d.mode, d && d.options, myRound(d));
      if(!myRound(d)){
        const who = teamNames[Number(d.turnTeam)] || ('Team ' + (Number(d.turnTeam)+1));
        say(who + ' is choosing');
        return;
      }
      if(spent.indexOf(client.id) !== -1){
        // already had a go this round — see the question, but no second answer
        answered = true;
        setBuzzer('off','Done');
        $('opts').querySelectorAll('button').forEach(b=>b.disabled=true);
        $('reply').disabled = true; $('send').disabled = true;
        $('state').textContent = 'You have already answered this one';
        return;
      }
      if(d && d.secs) roundClockRun(d.secs); else roundClockStop();
      /* Back after a reload, or joining mid-vote: show what this phone already
         chose rather than a blank set of options. */
      if(d && d.yours && mode === 'vote'){
        answered = true;
        myPicks = String(d.yours).split('|').filter(Boolean);
        /* What the relay holds is what this phone last *sent*, so the commit
           button comes back saying so rather than offering to send it again. */
        if(needSend){ sentValue = String(d.yours); $('commit').textContent = 'Sent'; }
        paintPicks();
        if(!needSend && !canRethink) [...$('opts').children].forEach(x=>{ x.disabled = true; });
        if(maxPicks > 1) say(myPicks.length + ' of ' + maxPicks + ' chosen');
      }
      /* The same thing for a dragged arrangement, which never had it. `buildArrange`
         has just run and cleared the boxes, so this has to come after it. */
      if(d && d.yours && mode === 'arrange'){
        answered = true;
        if(needSend) sentValue = String(d.yours);
        restoreArrange(String(d.yours).split('|'));
      }
      /* A reload mid-penalty comes back still on the clock — the relay carries
         every live cooldown, and a countdown a reload can skip is not one. The
         reopen path above already does this for the typed dynamics. */
      if(needSend){
        const mine = ((d && d.cooling || []).find(c => c.id === client.id) || {}).until || 0;
        if(mine > Date.now()) coolDown(mine);
      }
      if(mode==='buzz') setBuzzer('armed','Buzz');
      if(mode==='type')  syncTypeButton();
      if(mode==='card'){ cardBusy = false; renderCard(); }
      say(mode==='buzz' ? 'Go!'
        : mode==='vote' ? (maxPicks > 1 ? 'Choose ' + maxPicks + ' — tap to add or drop'
                          : canRethink ? 'Tap to choose — you can change it' : 'Pick one')
        : mode==='card' ? 'Tap the word'
        /* Blank, because `#ana-note` under the tray already says what to do and
           carries the running count. Left to fall through, this line inherited the
           `answer` mode's "Type your answer" and sat under a drag puzzle telling
           students to type — two instructions, one of them wrong. `#state` stays
           free for what the host says back. */
        : mode==='arrange' ? ''
        : mode==='type' ? 'Type it, then buzz' : 'Type your answer');
      if(navigator.vibrate) navigator.vibrate(40);
    }
    client.on('armed', applyArmed);
    /* The team's share of the answer changed under a live round: somebody joined
       this team or dropped off it, and four words split three ways is not what it
       was split two ways. Deliberately not a re-arm — that clears every handset's
       picks, and a latecomer walking in must not wipe what the others had just
       agreed on. So the cap moves and what this phone holds stays, which can leave
       it holding more than its share. That is the honest state: the handset says
       what to drop and refuses to add, and the team settles it by talking, which
       is the whole reason this mode exists. */
    /* The board has revealed a part of the answer — look up. A moment rather than
       a meter, deliberately: a bar in the corner is ambient and stops being read by
       the third question, where something that fires rarely keeps its force. And
       the thing it points at exists *only* on the wall, so the cue can do nothing
       except send eyes there.

       The vibrate is the half a projector cannot do — it reaches a phone lying
       face-down on the desk, which is exactly the phone whose owner has stopped
       looking at anything. */
    let lookTimer = 0;
    client.on('nudge', ()=>{
      const el = $('lookup');
      if(!el) return;
      el.classList.add('up');
      if(navigator.vibrate) navigator.vibrate([25,45,25]);
      clearTimeout(lookTimer);
      lookTimer = setTimeout(()=>el.classList.remove('up'), 2200);
    });
    client.on('shares', d=>{
      const next = Math.max(1, Number(d && d.multi) || 1);
      if(next === maxPicks || mode !== 'vote') return;
      maxPicks = next;
      paintPicks();
      say(myPicks.length ? shareLine() : 'Choose ' + maxPicks + ' — tap to add or drop');
    });
    /* This phone's own view of the question moved — the information gap recuts
       its deal when somebody joins or leaves. Same rule as `shares`: only the
       question line repaints, and whatever is half-typed in the box stays. */
    client.on('prompt', d=>{
      const view = d && d.prompt;
      if(typeof view === 'string' && view) $('qtext').textContent = view;
    });
    /* Both go through say(), because a claimed word resets the room immediately —
       and "waiting for the teacher" landing on top of "you got it" takes the win
       away from the student who just earned it. */
    /* Between questions the phone goes back to waiting — but a bingo card is not a
       control that belongs to one question, it is the student's own board for the
       whole round. Dropping to the buzzer put a full-screen WAIT button over the
       card they were still reading. */
    function standDown(msg){
      floorClockStop(); roundClockStop();
      setBuzzer('off','Wait');
      $('qtext').textContent = '';
      // the rule went with the question — it described that one, not the next
      $('qnote').textContent = '';
      setMode(card ? 'card-idle' : 'buzz');
      if(card) renderCard();
      say(msg);
    }
    client.on('disarmed', ()=> standDown('Waiting for the teacher…'));
    client.on('reset',    ()=>{ card = null; $('card').style.display='none';
                                standDown('Waiting for the teacher…'); });

    /* The teacher removed this phone. Back to the join form with the reason on it —
       and the seat is forgotten first, or a reload would resume straight back into
       the room and undo the teacher's only tool against a phantom. The code and
       name stay filled, so a phone kicked by mistake rejoins in two taps. */
    client.on('kicked', ()=>{
      forgetSeat();
      try{ client.close(); }catch(e){}
      client = null; window.HubPlayer = null;
      card = null; $('card').style.display='none';
      show('screen-join');
      loadTeams(true);
      validate();
      $('join-err').textContent = 'The teacher removed this phone from the game.';
    });

    /* The host's verdict on what this phone wrote. 'close' is its own answer, not a
       softer 'wrong': it means the word was produced and mis-spelled, which the
       student should hear said differently. */
    client.on('judged', d=>{
      floorClockStop();          // the verdict outranks whatever the clock was saying
      const v = (d && d.verdict) || 'wrong';
      /* **A commit round hears its verdict on the word it sent.** This phone already
         knows what it last transmitted, so the host names no word and the wire learns
         nothing new. Green is kept — that word is on this player's ladder — and red
         describes the one answer, so the next tap clears it. */
      /* Only when what was sent *is* one of the options — a round whose answer is a
         set sends `a|b|c|d`, matches no button, and keeps the wording it always had. */
      const sentBtn = (mode === 'vote' && sentValue)
        ? [...$('opts').children].find(x => x.textContent === sentValue) : null;
      if(sentBtn){
        const btn = sentBtn;
        verdictUntil = Date.now() + 1500;   // the verdict outlives the next message
        if(v === 'wrong'){
          if(btn){ btn.classList.remove('picked'); btn.classList.add('wrong'); }
          document.body.dataset.verdict = v;
          $('state').textContent = (d && d.note) || 'Not that one';
          if(navigator.vibrate) navigator.vibrate([15,60,15]);
          coolDown((d && d.until) || Date.now());
          return;
        }
        if(btn){ btn.classList.remove('picked','wrong'); btn.classList.add('done'); btn.disabled = true; }
        if(doneWords.indexOf(sentValue) === -1) doneWords.push(sentValue);
        /* Ready for the next one without an arm — which is the whole point: an arm
           would clear every other handset in the room to tell this one it was right. */
        myPicks = []; sentValue = null; answered = false; cooling = false;
        document.body.dataset.verdict = v;
        $('commit').disabled = true; $('commit').textContent = 'Send';
        $('state').textContent = (d && d.note) || 'Yes — now the next one';
        if(navigator.vibrate) navigator.vibrate([30,40,30]);
        return;
      }
      /* The verdict has to survive the next sentence arriving. Race re-arms the
         moment a word is claimed, so without this the student who just won sees
         "Yes!" for about a frame and then a fresh empty box — which reads as the
         buzz having done nothing. Kept on the body too, so it is still legible to
         anything asking what this phone was last told. */
      verdictUntil = Date.now() + 1500;
      document.body.dataset.verdict = v;
      if(v === 'wrong'){
        setBuzzer('off','…');
        $('state').textContent = (d && d.note) || 'Not quite';
        if(navigator.vibrate) navigator.vibrate([15,60,15]);
        coolDown((d && d.until) || Date.now());
        return;
      }
      setBuzzer('won', v === 'close' ? 'Close!' : 'Yes!');
      $('state').textContent = (d && d.note) ||
        (v === 'close' ? 'Close — check your spelling' : 'You got it!');
      if(navigator.vibrate) navigator.vibrate([30,40,30]);
    });

    /* Which of this phone's options are finished with, moved without a re-arm. The
       same shape as `shares`: repaint what changed, touch nothing the player is
       holding. It is also how a reload gets its ladder back, since the relay hands
       the stored list to a rejoining phone. */
