<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engishism — Classic Games</title>
  <link rel="stylesheet" href="styles/main.css?v=picture-choice">
  <link rel="stylesheet" href="styles/themes.css">
  <style>
    /* Floating layout switcher — lets the teacher flip to the new Unit-first app */
    .layout-switch {
      position: fixed;
      top: 0.6rem;
      right: 0.6rem;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.85rem;
      border-radius: 999px;
      border: 2px solid var(--accent, #e6ac00);
      background: rgba(13, 17, 23, 0.85);
      color: var(--accent, #e6ac00);
      font: 700 0.85rem/1 'Segoe UI', system-ui, sans-serif;
      text-decoration: none;
      backdrop-filter: blur(4px);
    }
    .layout-switch:hover { background: var(--accent, #e6ac00); color: #0d1117; }
  </style>
</head>
<body>
  <a class="layout-switch" href="app.html" title="Switch to the new Unit-first app">⚡ New app →</a>

  <div id="app">
    <div id="session-bar"></div>
    <div id="timer-bar"><div id="timer-fill"></div></div>
    <div id="module-bar-top" class="module-bar hidden"></div>
    <div id="slide-container"></div>
    <div id="module-bar-bottom" class="module-bar hidden"></div>
    <nav id="nav-bar">
      <button id="btn-lessons">&#8592; Activities</button>
      <button id="btn-prev">&#8592; Prev</button>
      <button id="btn-menu">&#8592; Menu</button>
      <span id="slide-counter"></span>
      <button id="btn-next">Next &#8594;</button>
    </nav>
  </div>

  <script>
    // Restore saved theme before first paint
    const t = localStorage.getItem('theme');
    if (t) document.documentElement.dataset.theme = t;
  </script>

  <!-- Engine utilities -->
  <script src="engine/events.js"></script>
  <script src="engine/session.js"></script>

  <!-- Activity types -->
  <script src="activities/title-card.js"></script>
  <script src="activities/reveal-card.js?v=unit1-image"></script>
  <script src="activities/fill-blank.js"></script>
  <script src="activities/picture-choice.js?v=unit1-picture-choice"></script>
  <script src="activities/meaning-pair.js"></script>
  <script src="activities/sentence-complete.js"></script>
  <script src="activities/true-false.js"></script>
  <script src="activities/hot-seat.js"></script>
  <script src="activities/noughts-crosses.js"></script>
  <script src="activities/millionaire.js"></script>
  <script src="activities/countdown.js"></script>
  <script src="activities/jeopardy.js"></script>
  <script src="activities/anagram.js"></script>
  <script src="activities/call-my-bluff.js"></script>
  <script src="activities/odd-one-out.js"></script>
  <script src="activities/missing-vowels.js"></script>
  <script src="activities/scenario-cards.js"></script>
  <script src="activities/fluency-tree.js"></script>

  <!-- Modules -->
  <script src="modules/timer.js"></script>
  <script src="modules/scoreboard.js"></script>
  <script src="modules/teams.js"></script>

  <!-- Topic adapters + topic manifest -->
  <script src="adapters/index.js"></script>
  <script src="topics/index.js"></script>

  <!-- Lesson manifest — lists available lessons -->
  <script src="lessons/index.js?v=picture-choice"></script>

  <!-- Engine — must load last -->
  <script src="engine/engine.js?v=picture-choice"></script>
</body>
</html>
