<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Battle Scrabble — Engishism Playground</title>
<style>
  /* Playground page: its own chrome, NOT the hub skin — same as Throw Lab, which
     this copies. Stage 1 of Battle Scrabble proves one player's whole loop on one
     screen: letters rain in, a live checker says what the rack can spell, flicking
     them into the slots builds a word, Bank cashes it and deals replacements, the
     clock ends it. No relay, no phones, no other players — the throw-at-a-
     neighbour half is stage 2 and needs a wire this page deliberately avoids. */
  :root{
    --bg:#101318; --panel:#171b22; --text:#f2f2ec; --muted:#9aa0aa;
    --border:#2a2f38; --accent:#00A0DF; --good:#6FB04A; --bad:#E2603B; --gold:#E8B93E;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column;
    /* The REAL visible height on a phone: mobile browser chrome (the URL bar)
       grows and shrinks, and 100% is the layout viewport, not what is on
       screen — the pile ended up crushed behind the bank bar. dvh follows the
       chrome; the 100% line above stays as the older-browser fallback. */
    height:100dvh;
    /* The canvas owns the gesture — without this a fast flick pans the page. */
    touch-action:none; -webkit-user-select:none; user-select:none;
    overscroll-behavior:none;
  }
  header{ flex:0 0 auto; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding:10px 14px 6px; }
  h1{ font-size:1.15rem; margin:0; letter-spacing:0.01em; }
  h1 small{ color:var(--muted); font-weight:400; font-size:0.8rem; margin-left:6px; }
  .tune{ margin-left:auto; align-self:center; white-space:nowrap; }

  .controls{
    flex:0 0 auto; display:flex; gap:14px; flex-wrap:wrap; align-items:center;
    padding:4px 14px 10px; border-bottom:1px solid var(--border);
  }
  body.controls-hidden .controls{ display:none; }
  .ctl{ display:flex; flex-direction:column; gap:2px; min-width:96px; }
  .ctl label{ font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  .ctl input[type=range]{ width:120px; accent-color:var(--accent); }
  .ctl .val{ font-size:0.72rem; color:var(--text); font-variant-numeric:tabular-nums; }
  button{
    font:inherit; font-size:0.82rem; padding:7px 14px; border-radius:999px;
    border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer;
  }
  button:hover{ border-color:var(--accent); }

  /* Score · hints · clock — always visible, one thin strip. */
  .strip{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:6px 14px; border-bottom:1px solid var(--border); min-height:40px;
  }
  .score{ font-size:1.05rem; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .score small{ color:var(--muted); font-weight:400; font-size:0.68rem; display:block; text-transform:uppercase; letter-spacing:0.05em; }
  .hints{ flex:1 1 auto; display:flex; gap:6px; flex-wrap:wrap; justify-content:center; min-width:0; }
  .hint-chip{
    font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase;
    padding:3px 10px; border-radius:999px; border:1px solid var(--border);
    background:var(--panel); color:var(--muted); white-space:nowrap;
  }
  body.hints-off .hint-chip{ display:none; }
  .clock{ font-size:1.05rem; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .clock.urgent{ color:var(--bad); }

  .stage{ flex:1 1 auto; position:relative; min-height:0; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  canvas.grabbing{ cursor:grabbing; }
  /* The status pill lives at the BOTTOM of the stage, floating over the pile
     band, so the grid can start at the very top — reserving a header lane for
     it cost every row 3-4px of square on a real phone. The pile is 1-2 tiles
     deep at the floor, so the pill floats just above the settled heap. */
  .status{
    position:absolute; left:50%; bottom:62px; transform:translateX(-50%);
    color:var(--muted); font-size:0.75rem; text-align:center; white-space:nowrap;
    max-width:94%; overflow:hidden; text-overflow:ellipsis;
    pointer-events:none; background:rgba(16,19,24,0.72); padding:4px 10px; border-radius:999px;
  }
  /* The banked-points flash: a reward beat that sells the redeal as a new hand
     rather than as the board being wiped. */
  .flash{
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%);
    font-size:2.2rem; font-weight:800; color:var(--gold); pointer-events:none;
    opacity:0; transition:opacity 0.25s, transform 0.9s;
  }
  .flash.show{ opacity:1; transform:translate(-50%,-90%); }

  /* The action bar lives in the thumb zone; Bank is the whole game so it gets
     the width. safe-area padding keeps it above an iPhone home bar. */
  .actions{
    flex:0 0 auto; display:flex; gap:10px; align-items:stretch;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);
  }
  #bank{
    flex:1 1 auto; min-height:56px; font-size:1rem; font-weight:700;
    border-radius:14px; letter-spacing:0.02em;
  }
  #bank:disabled{ color:var(--muted); cursor:default; border-color:var(--border); }
  #bank.ready{ background:var(--accent); border-color:var(--accent); color:#08131a; }
  #redeal{ flex:0 0 auto; min-height:56px; border-radius:14px; }

  /* ---- stage 2: the room ---- */
  .joinbar{
    flex:0 0 auto; display:none; gap:8px; align-items:center;
    padding:6px 14px 10px; border-bottom:1px solid var(--border);
  }
  .joinbar.on{ display:flex; }
  .joinbar input{
    font:inherit; font-size:0.9rem; padding:7px 10px; border-radius:10px;
    border:1px solid var(--border); background:var(--panel); color:var(--text);
    min-width:0;
  }
  #j-name{ flex:1 1 auto; }
  #j-code{ flex:0 0 92px; letter-spacing:0.15em; font-variant-numeric:tabular-nums; }
  #roomchip{ font-size:0.72rem; color:var(--muted); white-space:nowrap; align-self:center; }
  #roomchip b{ color:var(--accent); letter-spacing:0.1em; }

  /* The neighbour tags: WHO each open edge throws at — name only, in the lower
     corners (left pill = left throw edge), floating over the pile band's
     mostly-empty upper half, above the status pill. The word they are spelling
     lives on the grid overlay below, WHERE it sits on their grid — the pill
     merely goes gold when they have a live word worth attacking. Not a drop
     target: the whole edge is open and only a tile that actually flies out
     travels, so they steal no pointer. */
  .nbtag{
    position:absolute; bottom:94px; display:none; align-items:baseline; gap:7px;
    max-width:46%; padding:4px 10px; border-radius:999px;
    background:rgba(16,19,24,0.82); border:1px solid var(--border);
    pointer-events:none; color:var(--muted);
    font-size:0.7rem; text-transform:uppercase; letter-spacing:0.08em;
  }
  .nbtag.on{ display:flex; }
  .nbtag.dim{ opacity:0.3; }
  .nbtag b{ font-size:0.7rem; white-space:nowrap; }
  .nbtag.lit{ border-color:var(--gold); }
  #nb-l{ left:6px; } #nb-r{ right:6px; }

  /* The neighbour-word overlay: a neighbour's VALID word drawn as translucent
     ghost tiles over this grid, at the same cells it occupies on theirs — so
     the player knows where to aim a knock. pointer-events:none and see-through:
     the player's own tiles stay grabbable and visible beneath. Knocked, the
     ghosts explode (bs-boom scatters each tile by its own --dx/--dy) and the
     next paint shows the post-knock truth. */
  .nbov{ position:absolute; inset:0; pointer-events:none; }
  .nbov-tile{
    position:absolute; display:flex; align-items:center; justify-content:center;
    border-radius:8px; border:2px solid var(--gold);
    background:rgba(232,185,62,0.16); color:var(--gold);
    font-weight:800; opacity:0.55; will-change:transform,opacity;
  }
  .nbov-tile.boom{ animation:bs-boom 0.5s forwards; }
  @keyframes bs-boom{
    0%{ transform:translate(0,0) scale(1); opacity:0.95; }
    100%{ transform:translate(var(--dx,0), var(--dy,-60px)) scale(1.7) rotate(var(--rot,0deg));
          opacity:0; filter:blur(2px); }
  }

  @keyframes bs-shake{
    0%,100%{ transform:translate(0,0); } 20%{ transform:translate(-9px,3px); }
    40%{ transform:translate(8px,-4px); } 60%{ transform:translate(-6px,-3px); }
    80%{ transform:translate(5px,2px); }
  }
  .stage.shake{ animation:bs-shake 0.45s; }
  .flash.bad{ color:var(--bad); font-size:1.7rem; }

  .over{
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; background:rgba(16,19,24,0.88); text-align:center;
  }
  .over.show{ display:flex; }

  /* A short visible screen (browser bars shown — the realistic classroom case,
     see playground/phone-profiles.js) compacts the page chrome, so the height
     goes to the grid and the pile instead of headers. Without this the 8×8's
     squares fell well under the width-driven size on real handsets. */
  /* A narrow screen (a real handset) gets ONE header row, whatever it costs in
     button padding — the wrapped second row was ~55px that belonged to the
     grid: on a 412px Samsung the squares fell to ~33px while the width could
     carry 43. The board's mirror panels are the look this chases: the grid IS
     the screen, chrome stays a sliver. */
  @media (max-width:520px){
    header{ flex-wrap:nowrap; align-items:center; gap:8px; padding:8px 10px 4px; }
    h1{ font-size:0.92rem; white-space:nowrap; }
    h1 small{ display:none; }
    header button{ font-size:0.72rem; padding:5px 10px; }
    #roomchip{ font-size:0.68rem; }
  }
  @media (max-height:780px){
    header{ padding:6px 12px 2px; }
    h1{ font-size:0.95rem; }
    h1 small{ display:none; }
    .strip{ padding:3px 12px; min-height:32px; }
    .hint-chip{ font-size:0.7rem; padding:2px 8px; }
    .actions{ padding:6px 12px calc(6px + env(safe-area-inset-bottom)); }
    #bank, #redeal{ min-height:46px; }
  }
  .over .final{ font-size:3rem; font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums; }
  .over .label{ color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; font-size:0.8rem; }
</style>
</head>
<body>
  <header>
    <h1>Battle Scrabble <small>spell from your rack, bank before the clock — solo, or join a room</small></h1>
    <span id="roomchip"></span>
    <button id="btn-hints" type="button">Hints on</button>
    <button id="btn-tune" type="button" class="tune">⚙ Tune</button>
  </header>

  <div class="controls">
    <div class="ctl"><label>Game time</label><input id="s-secs" type="range" min="30" max="300" step="15" value="120"><span class="val" id="v-secs"></span></div>
    <div class="ctl"><label>Multiplier rate</label><input id="s-mrate" type="range" min="0" max="0.5" step="0.05" value="0.15"><span class="val" id="v-mrate"></span></div>
    <div class="ctl"><label>Multiplier max</label><input id="s-mmax" type="range" min="1" max="3" step="0.25" value="2"><span class="val" id="v-mmax"></span></div>
    <div class="ctl"><label>Min vowels</label><input id="s-vow" type="range" min="0" max="4" step="1" value="2"><span class="val" id="v-vow"></span></div>
    <!-- The physics rows are NOT here: Kit.table.dialsPanel builds them from
         the shelf's dial registry, so this page holds no copy of any feel
         default and a dial declared on the shelf appears here by existing. -->
  </div>

  <div class="joinbar" id="joinbar">
    <input id="j-name" placeholder="Your name" maxlength="20" autocomplete="off">
    <input id="j-code" placeholder="Code" inputmode="numeric" maxlength="6" autocomplete="off">
    <button id="j-go" type="button">Join</button>
  </div>

  <div class="strip">
    <div class="score"><small>Score</small><span id="score">0</span></div>
    <div class="hints" id="hints"></div>
    <div class="clock" id="clock">2:00</div>
  </div>

  <div class="stage">
    <canvas id="stage"></canvas>
    <div class="nbov" id="nbov"></div>
    <div class="nbtag" id="nb-l"><b id="nbname-l"></b></div>
    <div class="nbtag" id="nb-r"><b id="nbname-r"></b></div>
    <div class="status" id="status">Flick letters into the slots to spell a word.</div>
    <div class="flash" id="flash"></div>
    <div class="over" id="over">
      <div class="label">Time!</div>
      <div class="final" id="final">0</div>
      <div class="label" id="best-line"></div>
      <button id="again" type="button">Play again ⟳</button>
    </div>
  </div>

  <div class="actions">
    <button id="bank" type="button" disabled>Spell a word to bank it</button>
    <button id="redeal" type="button">Redeal ⟳</button>
  </div>

  <!-- Same shelf and same order as Throw Lab: matter.min.js → hub-kit.js (the
       object Kit.table hangs off) → hub-table.js. word-list.js is this page's own
       vendored dictionary — a <script src>, never a fetch, so file:// works. -->
  <script src="../game-hub/hub-buzzer.js?v=20260902b"></script>
  <script src="../game-hub/matter.min.js?v=20260902b"></script>
  <script src="../game-hub/hub-kit.js?v=20260902b"></script>
  <script src="../game-hub/hub-table.js?v=20260902b"></script>
  <script src="word-list.js?v=20260902b"></script>
  <script>
  (function(){
    'use strict';
    const K = window.HubKit;
    if(!K || !K.table){ document.getElementById('status').textContent = 'Kit.table failed to load.'; return; }
    if(!window.WORDS){ document.getElementById('status').textContent = 'word-list.js failed to load.'; return; }

    /* ==================== CONTENT — a teacher can edit this ====================
       Standard Scrabble bag: letter → [how many in the bag, points]. No blanks —
       a blank tile has no letter to read on a physics board. */
    const BAG = {
      A:[9,1], B:[2,3], C:[2,3], D:[4,2], E:[12,1], F:[2,4], G:[3,2], H:[2,4],
      I:[9,1], J:[1,8], K:[1,5], L:[4,1], M:[2,3],  N:[6,1], O:[8,1], P:[2,3],
      Q:[1,10], R:[6,1], S:[4,1], T:[6,1], U:[4,1], V:[2,4], W:[2,4], X:[1,8],
      Y:[2,4], Z:[1,10]
    };
    const LENGTH_BONUS = { 5:3, 6:6, 7:12, 8:20 };   // on top of letter values
    const RACK_SIZE  = 8;
    const COLS = 7, ROWS = 7;      // the grid: words read across AND down. 7 columns, not 8 — the squares gain ~4px each on a phone and no ESL hand needs an 8-letter row
    const GRID = { cols: COLS, rows: ROWS, top: 10 };   // the status pill sits at the stage's bottom, so row 0 owns the top
    const MIN_WORD   = 3;
    const HINT_COUNT = 3;
    /* ========================================================================= */

    /* ---- dictionary: a Set for "is this a word", the array for the hint scan ---- */
    const WORD_LIST = window.WORDS.split(' ');
    const DICT = new Set(WORD_LIST);
    /* Letter-multiset check — can `rack` spell `word`? The same six lines as
       the toss round's `fits`, copied rather than imported: a playground page
       may not load round files, and a shelf home waits for a second caller
       (axiom 5). */
    function canSpell(word, rack){
      const pool = {};
      rack.forEach(ch => { pool[ch] = (pool[ch] || 0) + 1; });
      for(const ch of word.toUpperCase()){
        if(!pool[ch]) return false;
        pool[ch]--;
      }
      return true;
    }
    function wordScore(word){
      let pts = 0;
      for(const ch of word.toUpperCase()) pts += (BAG[ch] ? BAG[ch][1] : 0);
      return pts + (LENGTH_BONUS[word.length] || 0);
    }
    /* Recomputed on each deal only — a 22k-word multiset scan is a few
       milliseconds, but it has no business running per frame. */
    function spellable(rack){
      // capped at COLS as well as the rack: a word longer than a row can never be laid
      const max = Math.min(rack.length, COLS);
      return WORD_LIST.filter(w => w.length >= MIN_WORD && w.length <= max && canSpell(w, rack));
    }
    /* Best + two reachable: the top-scoring word is the stretch, a four- and a
       three-letter word are the targets a struggling student can actually hit. */
    function pickHints(list){
      if(!list.length) return [];
      const byScore = list.slice().sort((a, b) => wordScore(b) - wordScore(a));
      const out = [byScore[0]];
      [4, 3].forEach(len => {
        const hit = byScore.find(w => w.length === len && out.indexOf(w) === -1);
        if(hit) out.push(hit);
      });
      return out.slice(0, HINT_COUNT);
    }

    /* ---- the bag: drawn without replacement, reshuffled when dry ---- */
    const VOWELS = 'AEIOU';
    let bag = [];
    function refillBag(){
      bag = [];
      Object.keys(BAG).forEach(ch => { for(let i = 0; i < BAG[ch][0]; i++) bag.push(ch); });
      for(let i = bag.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        const t = bag[i]; bag[i] = bag[j]; bag[j] = t;
      }
    }
    function drawOne(vowelOnly){
      if(!bag.length) refillBag();
      if(vowelOnly){
        const at = bag.findIndex(ch => VOWELS.indexOf(ch) !== -1);
        if(at !== -1) return bag.splice(at, 1)[0];
      }
      return bag.pop();
    }
    /* An ESL rack with no vowels is a dead hand, so the last draws are forced to
       vowels when the count is short — a guard, not a stack of retries. */
    function draw(n, have){
      const out = [];
      let vowels = have.filter(ch => VOWELS.indexOf(ch) !== -1).length;
      for(let i = 0; i < n; i++){
        const left = n - i;
        const need = minVowels() - vowels;
        const ch = drawOne(need >= left);
        if(VOWELS.indexOf(ch) !== -1) vowels++;
        out.push(ch);
      }
      return out;
    }

    /* ---- game state ---- */
    let rack = [];            // the letters in play, slots included
    let hints = [];
    let score = 0;
    let bestWord = null;      // {word, pts} — for the game-over line
    let validRuns = [];       // [{word, idx}] — every valid straight run >= MIN_WORD
    let badRuns = [];         // runs >= MIN_WORD that are not words
    let validKey = '';        // the sorted valid words, joined — the multiplier resets when it changes
    let validSince = 0;       // performance.now() when the current valid set formed
    let playing = false;
    let secsLeft = 0;
    let banked = 0;           // words banked this game — reported to the board

    const canvas  = document.getElementById('stage');
    const status  = document.getElementById('status');
    const bankBtn = document.getElementById('bank');

    /* No feel overrides: every tuning number comes from the shelf's dial
       registry (Kit.table.dials), where it has its one home. */
    const world = K.table({
      canvas,
      onArrange(){ readBoard(); },
      /* a free tile crossed an open side edge: it has been thrown, mid-air,
         at whatever speed it was doing — same wire as a band release */
      onExit(t){ throwOut(t.side, t.ch, t.hue, t.vx, t.vy, t.ny); },
      /* a knock broke this board's word: the shelf fires this AFTER report(),
         so readBoard has already re-read — resend the live word immediately,
         tagged k, and the neighbours' overlays explode instead of just
         swapping text */
      onKnock(k){
        sendLiveWord(true, (k && k.tag) || 'Someone');
        /* the same quick self-clearing beat as INCOMING: who broke your word */
        const flash = document.getElementById('flash');
        flash.textContent = (k && k.tag ? k.tag : 'Someone') + ' hit your word!';
        flash.classList.add('show', 'bad');
        setTimeout(() => flash.classList.remove('show', 'bad'), 1100);
        status.textContent = (k && k.tag ? k.tag : 'Someone') + ' knocked a letter out of your word!';
      }
    });
    function val(id){ return document.getElementById(id).value; }
    function minVowels(){ return +val('s-vow'); }
    function multRate(){ return +val('s-mrate'); }
    function multMax(){ return +val('s-mmax'); }

    /* Words are the straight contiguous runs on the grid — across every row
       and down every column, Scrabble-fashion. A single letter belongs to a
       1-run both ways and is dropped; a 2-run is neutral ("keep going"); a run
       of MIN_WORD+ is judged. Each valid word's slots glow green and each
       failed run's glow red, via the shelf's scoped setResult. Judged on every
       arrangement change; 16 short scans of a 64-cell array. */
    function scanRuns(){
      const cells = world.cells(), runs = [];
      const line = at => {
        let w = '', idx = [];
        for(let k = 0;; k++){
          const i = at(k), ch = i == null ? '' : cells[i];
          if(ch){ w += ch; idx.push(i); }
          else {
            if(w.length >= 2) runs.push({ word: w, idx });
            w = ''; idx = [];
            if(i == null) return;
          }
        }
      };
      for(let r = 0; r < ROWS; r++) line(k => k < COLS ? r*COLS + k : null);
      for(let c = 0; c < COLS; c++) line(k => k < ROWS ? k*COLS + c : null);
      return runs;
    }
    function readBoard(){
      const runs = scanRuns();
      validRuns = []; badRuns = [];
      runs.forEach(r => {
        if(r.word.length < MIN_WORD) return;   // a 2-run is neutral
        (DICT.has(r.word.toLowerCase()) ? validRuns : badRuns).push(r);
      });
      world.setResult(null);
      validRuns.forEach(r => world.setResult('right', r.idx));
      badRuns.forEach(r => world.setResult('wrong', r.idx));
      const key = validRuns.map(r => r.word).sort().join('+');
      if(key !== validKey){ validKey = key; validSince = key ? performance.now() : 0; }
      status.textContent =
        badRuns.length ? '✗ ' + badRuns[0].word + ' is not a word here.' :
        validRuns.length ? '✓ ' + validRuns.map(r => r.word).join(', ') + ' — bank, or hold for the multiplier.' :
        'Flick letters into the grid — words read across and down.';
      sendLiveWord();
      sendGrid();
      paintBank();
    }

    function multNow(){
      if(!validRuns.length || !validSince || !multRate()) return 1;
      return Math.min(multMax(), 1 + multRate() * (performance.now() - validSince) / 1000);
    }
    function bankTotal(){ return validRuns.reduce((t, r) => t + wordScore(r.word), 0); }
    function paintBank(){
      if(!playing){ bankBtn.disabled = true; bankBtn.classList.remove('ready'); bankBtn.textContent = '—'; return; }
      if(!validRuns.length){
        bankBtn.disabled = true; bankBtn.classList.remove('ready');
        bankBtn.textContent = 'Spell a word to bank it';
        return;
      }
      const m = multNow();
      const label = validRuns.length === 1 ? validRuns[0].word : validRuns.length + ' WORDS';
      bankBtn.disabled = false; bankBtn.classList.add('ready');
      bankBtn.textContent = 'BANK ' + label + ' · ' + bankTotal() + ' pts' +
                            (m > 1.001 ? ' ×' + m.toFixed(1) : '');
    }

    /* ---- the deal: wholesale, framed as a beat ----
       Kit.table has one spawn path (setPieces replaces everything) and setPieces
       does not clear the slot row's back-references — so pieces first, slots
       second, every time, or the new deal docks into ghosts. Everything rains
       from the top again, kept letters included; that is the "new hand" moment,
       not a defect. */
    function deal(kept){
      rack = kept.concat(draw(RACK_SIZE - kept.length, kept));
      world.setPieces(rack);
      world.slots(GRID);
      world.setResult(null);
      validRuns = []; badRuns = []; validKey = ''; validSince = 0;
      sendLiveWord(true);          // a fresh hand clears the neighbours' view of us
      sendGrid(true);              // and the board's mirror of this grid
      hints = [];                  // a fresh hand re-picks in full
      refreshHints();
      status.textContent = 'Flick letters into the grid — words read across and down.';
      paintBank();
      /* The refill re-opens the edges. edgesPaint closes both sides when the
         rack is down to its last spellable letters; without this call a bank
         from a low rack left the walls built — throws bounced off a
         visually-open edge until an INCOMING tile happened to repaint. */
      edgesPaint();
      nbovPaint();                 // slot geometry can change with the size dial
    }

    function renderHints(){
      const box = document.getElementById('hints');
      box.innerHTML = '';
      hints.forEach(w => {
        const el = document.createElement('span');
        el.className = 'hint-chip';
        el.textContent = w + ' · ' + wordScore(w);
        box.appendChild(el);
      });
    }

    /* The hint strip must only ever show words the CURRENT rack can spell —
       the rack changes outside the deal too (a tile thrown away, a tile
       arriving), and a chip advertising a word you can no longer make reads
       as the dictionary being broken. Hints that survive the change are kept
       (no churn on every throw); the gaps refill from what is spellable now. */
    function refreshHints(){
      const kept = hints.filter(w => canSpell(w, rack));
      const fresh = pickHints(spellable(rack)).filter(w => kept.indexOf(w) === -1);
      hints = kept.concat(fresh).slice(0, HINT_COUNT);
      renderHints();
    }

    function bank(){
      if(!validRuns.length || !playing) return;
      const m = multNow();
      /* Every valid word cashes at once. A crossing letter scores in BOTH its
         words (that is the reward for the cross) but sits on one slot, so the
         spend below is the union of slots, never a double charge. */
      const pts = Math.floor(bankTotal() * m * 10) / 10;
      score = Math.round((score + pts) * 10) / 10;
      validRuns.forEach(r => {
        const p = Math.floor(wordScore(r.word) * m * 10) / 10;
        if(!bestWord || p > bestWord.pts) bestWord = { word: r.word, pts: p };
      });
      banked += validRuns.length;
      document.getElementById('score').textContent = score;
      const flash = document.getElementById('flash');
      flash.textContent = '+' + pts;
      flash.classList.add('show');
      setTimeout(() => flash.classList.remove('show'), 900);
      /* The banked letters are spent; the rest come back with the next hand.
         An invalid run never blocks a bank — its letters simply come back. */
      const cells = world.cells();
      const spent = {};
      const used = new Set();
      validRuns.forEach(r => r.idx.forEach(i => used.add(i)));
      used.forEach(i => { const ch = cells[i]; if(ch) spent[ch] = (spent[ch] || 0) + 1; });
      const kept = [];
      rack.forEach(ch => { if(spent[ch]) spent[ch]--; else kept.push(ch); });
      deal(kept);
      report(false);           // the board's standings follow every bank
    }

    /* ---- clock ---- */
    let tick = null;
    function paintClock(){
      const m = Math.floor(secsLeft / 60), s = secsLeft % 60;
      const el = document.getElementById('clock');
      el.textContent = m + ':' + String(s).padStart(2, '0');
      el.classList.toggle('urgent', secsLeft <= 10);
    }
    function startGame(roomSecs){
      score = 0; bestWord = null; banked = 0;
      document.getElementById('score').textContent = '0';
      document.getElementById('over').classList.remove('show');
      refillBag();
      /* In a room the board's arm carries the duration, sent once — the same
         clock model every round uses, so no handset agrees the time with
         anybody. Solo reads the slider. */
      secsLeft = Number(roomSecs) > 0 ? Math.round(Number(roomSecs)) : +val('s-secs');
      paintClock();
      playing = true;
      nbWords.l = nbWords.r = null;   // a rematch starts with clean grids everywhere
      deal([]);
      clearInterval(tick);
      tick = setInterval(() => {
        secsLeft--;
        paintClock();
        if(secsLeft <= 0) endGame();
      }, 1000);
      edgesPaint();
    }
    function endGame(){
      clearInterval(tick); tick = null;
      playing = false;
      paintBank(); edgesPaint(); nbovPaint();
      report(true);
      document.getElementById('final').textContent = score;
      document.getElementById('best-line').textContent =
        bestWord ? 'best word: ' + bestWord.word + ' (+' + bestWord.pts + ')' : 'no words banked';
      /* In a room the board deals the rematch — a phone restarting itself would
         desync the whole circle. */
      document.getElementById('again').style.display = client ? 'none' : '';
      document.getElementById('over').classList.add('show');
    }

    /* ==================== the room — stage 2 ====================
       Protocol, duplicated verbatim on the board page (battle-scrabble-board):
       JSON rides the relay's existing messages — nothing new on the wire.
       Up, via respond() (<=120 chars), tagged `t`, per-phone sequence `q`
         (the receiver drops replays per TYPE — w and g leave as concurrent
         POSTs, so one shared counter dropped whichever lost the race):
         {"t":"s","q":7,"sc":41.5,"w":"QUIZ","n":4[,"f":1]}   score (f = final)
         {"t":"th","q":8,"d":"L","l":"Q","c":"#F5C542","vx":-14.2,"vy":-3.1,"ny":0.42}
           throw: the tile (letter and colour), plus the velocity it left the
           screen with and the release height as a fraction — the tile travels
         {"t":"w","q":9,"w":"QUIZ","ok":1[,"x":2,"y":0,"o":"a"][,"k":1,"h":"Ben"]}
           word in progress (ok = a real word); a valid word carries its start
           cell and orientation (o = a/d, across/down) so neighbours can ghost
           it in place; k = this update is a knock's aftermath, h = who hit
         {"t":"g","q":10,"b":"<COLS*ROWS chars, . = empty>","v":"<hex valid mask, a nibble per 4 cells>"}
           the grid, row-major, for the board's live mirror (v only when set);
           the board derives the grid's shape from b's length
       Down, to one phone via nope():
         {"t":"tile","by":"Maria","d":"L","l":"Q","c":"#F5C542","vx":-14.2,"vy":-3.1,"ny":0.42}
           an incoming tile: it enters this board moving as it left theirs,
           wearing its own colour, and it is this player's from then on
         {"t":"nw","d":"l","w":"QUIZ","ok":1[,"x":2,"y":0,"o":"a"][,"k":1]}
           your left/right neighbour's word, position and knock flag carried
           through from their "w" — valid words ghost onto this grid in place
         {"t":"nb","l":"Maria","r":"Ken"}    your neighbours' names
         {"t":"hm","m":"ghost"|"edge"|"off"}  the room's word-hint mode (a board
           setting): in-place ghost, edge-anchored at row height, or none
         {"t":"sync","left":48}              clock sync for a late joiner
         {"t":"full"}                        the board seats four; wait out this game
       Start rides arm({mode:'answer',rethink:true,secs}); the board holds the
       room armed through a grace period after time-up so finals still land.
       Receivers ignore non-JSON and unknown `t` — that is the compat rule. */
    const SEAT_KEY = 'engishism.battle.seat';   // never join.html's 'engishism.seat'
    const qs    = new URLSearchParams(location.search);
    const RELAY = qs.get('relay') || '';

    /* A simulated phone (the phone bench opens this page in iframes:
       ?auto=1&code=&name=). It joins by itself and — crucially — never touches
       the seat: every bench iframe shares this origin's localStorage, so one
       seat key would be fought over by every fake phone and clobber the real
       phone's. The contract's one home is HubBuzzer.sim(), shared with
       join.html. */
    const SIM = (window.HubBuzzer && window.HubBuzzer.sim) ? window.HubBuzzer.sim() : null;
    const SIMULATED = !!SIM;
    let client = null, roomCode = null;
    let nbL = '', nbR = '';        // neighbour names, only ever from the board's nb push
    let full = false;              // the board seats four; a fifth phone is told so
    let seq = 0;

    function seatGet(){ try{ return JSON.parse(localStorage.getItem(SEAT_KEY) || 'null') || {}; }catch(_){ return {}; } }
    function seatKeep(o){ if(SIMULATED) return;
      try{ localStorage.setItem(SEAT_KEY, JSON.stringify(o)); }catch(_){} }

    function send(o){ if(!client) return; o.q = ++seq; client.respond(JSON.stringify(o)); }
    function report(final){
      if(!client) return;
      const o = { t:'s', sc:score, w:(bestWord && bestWord.word) || '', n:banked };
      if(final) o.f = 1;
      send(o);
    }

    function roomChip(txt){ document.getElementById('roomchip').innerHTML = txt || ''; }

    function edgesPaint(){
      const openTo = { l:false, r:false };
      ['l','r'].forEach(side => {
        const tag = document.getElementById('nb-' + side);
        const name = side === 'l' ? nbL : nbR;
        const on = !!client && playing && !!name;
        tag.classList.toggle('on', on);
        // below three spare-ish letters a throw would leave the rack unspellable
        tag.classList.toggle('dim', on && rack.length <= MIN_WORD);
        document.getElementById('nbname-' + side).textContent = name || '';
        openTo[side] = on && rack.length > MIN_WORD;
      });
      /* The walls follow the tags: an entitled side is an OPEN edge, and the
         ONLY throw is a tile that actually flies out through it — releasing a
         tile near the edge just drops it. Solo, lobby, game over, or down to
         the last spellable letters: the edge closes and is a wall again. */
      world.openSides(openTo);
    }

    /* ---- the neighbour-word overlay ----
       A neighbour's VALID word ghosts onto THIS grid at the cells it occupies
       on theirs (both grids are COLS×ROWS, so cells map 1:1) — the player sees
       WHERE the word is and aims the knock. Only valid words show; a work-in-
       progress stays off the grid. Geometry comes from world.slotBox, so a
       resize or a size-dial change wants a repaint. */
    const nbWords = { l:null, r:null };   // last state per side: {w, ok, x, y, o}
    /* The room's hint mode, a BOARD setting pushed as {t:'hm'} — 'ghost' is
       today's in-place overlay and stays the default so a phone that never
       hears the message (old board, degraded room) plays exactly as before. */
    let hintMode = 'ghost';
    const nbov = document.getElementById('nbov');
    function nbovCells(st){
      const out = [];
      for(let j = 0; j < st.w.length; j++){
        const cx = st.o === 'd' ? st.x : st.x + j;
        const cy = st.o === 'd' ? st.y + j : st.y;
        if(cx >= COLS || cy >= ROWS) break;   // a malformed position never paints off-grid
        out.push(cy * COLS + cx);
      }
      return out;
    }
    function tileEl(side, ch, left, top, size){
      const el = document.createElement('div');
      el.className = 'nbov-tile';
      el.dataset.side = side;
      el.textContent = ch;
      el.style.left = left + 'px';
      el.style.top = top + 'px';
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.fontSize = Math.round(size * 0.5) + 'px';
      nbov.appendChild(el);
    }
    function nbovPaint(){
      /* ghost mode only: in a 2-player ring the one opponent is BOTH
         neighbours, so their word arrives once per side — identical states
         paint once, or the stacked ghosts read at double opacity. Edge mode
         wants the opposite: the same word on both edges says honestly that
         either throw reaches them. */
      const dupR = nbWords.l && nbWords.r &&
                   JSON.stringify(nbWords.l) === JSON.stringify(nbWords.r);
      ['l','r'].forEach(side => {
        nbov.querySelectorAll('[data-side="' + side + '"]').forEach(el => el.remove());
        const st = nbWords[side];
        if(!playing || hintMode === 'off' || !st || !st.ok || !st.w || st.x == null) return;
        if(hintMode !== 'edge'){
          /* in place: the word at the cells it occupies on their grid */
          if(side === 'r' && dupR) return;
          nbovCells(st).forEach((idx, j) => {
            const box = world.slotBox(idx);
            if(box) tileEl(side, st.w[j], box.x - box.w / 2, box.y - box.w / 2, box.w);
          });
          return;
        }
        /* on the edges: the word hugs its OWNER's edge at the row height it
           sits at on their grid — the edge is who and which way to throw, the
           height is where to aim (a thrown tile enters at the height it left).
           Mini tiles so two neighbours' words never crowd the grid; across
           words run inward from the edge, down words stack. */
        const anchor = world.slotBox(Math.min(st.y, ROWS - 1) * COLS + Math.min(st.x, COLS - 1));
        if(!anchor) return;
        const mini = Math.max(16, Math.round((world.tileSize() || 56) * 0.4));
        const gap = 2, W = canvas.offsetWidth, H = canvas.offsetHeight;
        const vert = st.o === 'd';
        const len = st.w.length * mini + (st.w.length - 1) * gap;
        const top0 = Math.min(Math.max(0, anchor.y - mini / 2), Math.max(0, H - (vert ? len : mini)));
        const left0 = side === 'l' ? 4 : W - 4 - (vert ? mini : len);
        for(let j = 0; j < st.w.length; j++)
          tileEl(side, st.w[j],
                 vert ? left0 : left0 + j * (mini + gap),
                 vert ? top0 + j * (mini + gap) : top0, mini);
      });
    }
    /* The knock beat: the ghosts scatter and fade. Each tile gets its own
       flight, the data-side is dropped so the truth can paint underneath
       while the explosion plays, and the debris removes itself. */
    function nbovBoom(side){
      nbov.querySelectorAll('[data-side="' + side + '"]').forEach(el => {
        el.dataset.side = '';
        el.style.setProperty('--dx', Math.round((Math.random() - 0.5) * 140) + 'px');
        el.style.setProperty('--dy', Math.round((Math.random() - 0.5) * 100 - 40) + 'px');
        el.style.setProperty('--rot', Math.round((Math.random() - 0.5) * 220) + 'deg');
        el.classList.add('boom');
        setTimeout(() => el.remove(), 550);
      });
    }

    /* The word-in-progress, sent up so the ring can see who is spelling what
       — the neighbours' grids ghost it at the cells it occupies here, the
       board's panel prints it. A VALID word carries its position (x,y = start
       cell, o = across/down), which is what places the ghost. Debounced (a
       drag can chatter) and deduped, so the wire only carries changes; force
       sends immediately (a bank or a fresh hand must not linger on a
       neighbour's screen). knocked marks the update as a knock's aftermath —
       it always sends (the same word could survive a knock elsewhere on the
       grid, and the dedupe would swallow the bang) and carries the hitter's
       name for the board's toast. */
    let lwTimer = null, lastLw = null;
    function sendLiveWord(force, knocked){
      if(!client) return;
      const best = validRuns[0] || null;
      const all = validRuns.concat(badRuns);
      const longest = all.length ? all.reduce((a, b) => b.word.length > a.word.length ? b : a) : null;
      const w = ((best || longest || { word: '' }).word).slice(0, 10);
      const ok = best ? 1 : 0;
      const key = w + '|' + ok;
      if(!knocked && key === lastLw){ clearTimeout(lwTimer); return; }
      clearTimeout(lwTimer);
      const fire = () => {
        lastLw = key;
        const o = { t:'w', w, ok };
        if(best){
          o.x = best.idx[0] % COLS;
          o.y = Math.floor(best.idx[0] / COLS);
          o.o = (best.idx.length > 1 && best.idx[1] === best.idx[0] + 1) ? 'a' : 'd';
        }
        if(knocked){
          o.k = 1;
          // who landed the hit, for the board's toast — the victim is the
          // only one who knows (the tag came in riding the tile)
          if(typeof knocked === 'string') o.h = knocked.slice(0, 20);
        }
        send(o);
      };
      if(force || knocked){ fire(); return; }
      lwTimer = setTimeout(fire, 250);
    }

    /* The grid mirror: the board draws every player's grid live, so the whole
       room watches each word form on the projector. COLS*ROWS chars ('.' for
       empty, row-major) stays well under the relay's 120-char truncation, and
       the BOARD derives the grid's shape from the string's length — this
       constant has one home, here. v is a hex mask of the cells in a currently
       VALID word (a nibble per 4 cells, bit 8>>k for cell 4j+k), sent only
       when any bit is set — the board lights those cells gold. Same
       debounce+dedupe as the live word; force sends at once (a fresh hand
       clears the mirror). */
    let gTimer = null, lastG = null;
    function sendGrid(force){
      if(!client) return;
      const cells = world.cells();
      let b = '';
      for(let i = 0; i < COLS * ROWS; i++) b += cells[i] || '.';
      const valid = new Array(COLS * ROWS).fill(false);
      validRuns.forEach(r => r.idx.forEach(i => { valid[i] = true; }));
      let v = '';
      for(let j = 0; j < (COLS * ROWS) / 4; j++){
        let n = 0;
        for(let k = 0; k < 4; k++) if(valid[j * 4 + k]) n |= (8 >> k);
        v += n.toString(16);
      }
      const key = b + '|' + v;
      if(key === lastG){ clearTimeout(gTimer); return; }
      clearTimeout(gTimer);
      const fire = () => {
        lastG = key;
        const o = { t:'g', b };
        if(/[^0]/.test(v)) o.v = v;
        send(o);
      };
      if(force){ fire(); return; }
      gTimer = setTimeout(fire, 250);
    }

    /* One sender for both throw paths — a tile released in the side band and
       a tile that flew out through the open edge take the same wire. The
       colour rides with it, so the tile lands on the neighbour's board
       looking like itself. */
    function throwOut(side, ch, hue, vx, vy, ny){
      const at = rack.indexOf(ch);
      if(at !== -1) rack.splice(at, 1);
      refreshHints();              // a hint needing the thrown letter must go
      const r1 = v => Math.round(v * 10) / 10;
      send({ t:'th', d: side.toUpperCase(), l: ch, c: hue || '',
             vx: r1(vx), vy: r1(vy),
             ny: Math.round(Math.max(0, Math.min(1, ny)) * 100) / 100 });
      // status LAST: readBoard always writes the status line, and the throw
      // announcement is the one worth leaving on screen
      readBoard(); edgesPaint();
      status.textContent = 'Thrown at ' + (side === 'l' ? nbL : nbR) + '!';
    }

    /* An incoming tile: the neighbour's throw arrives as a real piece, entering
       from the side it was thrown through, moving as it left their screen. It
       is this player's letter now — the rack grows, the hints re-pick — and its
       shot flag arms the shelf's knock rule, so a hard first impact punches a
       slotted letter out of the word it hits. Nothing resets and nothing is
       deleted: the only damage is what the impact physically does. */
    function onTile(d){
      if(!playing) return;
      const ch = String(d.l || '').slice(0, 1).toUpperCase();
      if(!/^[A-Z]$/.test(ch)) return;
      rack.push(ch);
      refreshHints();
      /* d is the side of the THROWER's screen it left through: off their left
         edge it crosses to their left neighbour — this screen — entering at the
         right edge, still moving left; mirrored for 'R'. A gently-dropped throw
         still has to actually enter, so the inward speed keeps a floor. */
      const fromRight = String(d.d || 'R').toUpperCase() === 'L';
      const w = canvas.offsetWidth, h = canvas.offsetHeight;
      /* Entry speed is clamped into [MINV, MAXV]. The floor makes a gently
         dropped throw actually enter; the ceiling is the fix for "it comes in
         faster than it was thrown": the wire transfers the exit speed exactly,
         but a release is the flick times the Throw power dial, and the
         thrower barely sees the boosted flight — it leaves their screen in a
         couple of frames — while the receiver watches it cross their whole
         screen. The throw FEEL stays the sender's; only the arrival is tamed.
         Knocks still land: the knock threshold is 6, far under the cap. */
      const MINV = 9, MAXV = 30;
      let vx = Number(d.vx) || 0;
      const vy = Math.max(-30, Math.min(30, Number(d.vy) || 0));
      vx = fromRight ? Math.max(-MAXV, Math.min(vx, -MINV)) : Math.min(MAXV, Math.max(vx, MINV));
      /* ny caps at 0.68, above the tray lip at the bottom of each open edge —
         an arrival aimed lower would hit the lip from OUTSIDE and never enter */
      const ny = Math.max(0.08, Math.min(0.68, Number(d.ny) || 0.3));
      // the tile keeps the colour it wore on the thrower's board — it is the
      // SAME tile arriving, not a marker; palette fallback if none rode along
      const hue = /^#[0-9a-fA-F]{6}$/.test(String(d.c || '')) ? d.c : undefined;
      /* Spawn the centre just OUTSIDE the edge so the tile SLIDES in, clipped
         by the canvas exactly as it clipped leaving the thrower's screen —
         centred 16px inside, a ~50px tile popped in whole on its first frame.
         Half a tile out sits within tickExits' tile*0.6 crossing margin (not
         an exit), the arrival hold reflects only OUTWARD motion, and the
         MINV floor guarantees it comes in. */
      const half = (world.tileSize() || 56) / 2;
      world.addPiece(ch, { x: fromRight ? w + half : -half, y: ny * h, vx, vy, hue, shot: true,
                           tag: String(d.by || '').slice(0, 20) });   // the thrower's name rides the tile, so a knock can say who did it
      status.textContent = (d.by || 'Someone') + ' threw you a ' + ch + '!';
      const flash = document.getElementById('flash');
      flash.textContent = 'INCOMING ' + ch + '!';
      flash.classList.add('show', 'bad');
      setTimeout(() => flash.classList.remove('show', 'bad'), 1100);
      paintBank(); edgesPaint();
    }

    function toLobby(){
      clearInterval(tick); tick = null;
      playing = false;
      world.reset();
      document.getElementById('hints').innerHTML = '';
      document.getElementById('over').classList.remove('show');
      document.getElementById('clock').textContent = '–:––';
      status.textContent = 'Waiting for the board to start the game…';
      paintBank(); edgesPaint(); nbovPaint();
    }

    /* The full room state arrives on `joined` (resent on every reconnect) and
       the live start on `armed`. One handler; the `playing` guard is what
       stops a reconnect replay restarting a game in progress. */
    function onArmState(d, isJoinedEvent){
      if(full) return;             // a fifth phone never starts, whatever the relay replays
      if(isJoinedEvent && !d.armed){ toLobby(); return; }
      if(playing) return;
      document.getElementById('over').classList.remove('show');
      startGame(d && d.secs);
      edgesPaint();
    }

    function join(code, name){
      // a fake phone never inherits the real phone's seat — a reused id would
      // fold every bench iframe into one player on the circle
      const old = SIMULATED ? {} : seatGet();
      const id = (old.code === code && old.id)
        ? old.id
        : ('bs' + Date.now().toString(36) + Math.floor(Math.random() * 1e4));
      seatKeep({ id, name, code });
      roomCode = code;
      client = window.HubBuzzer.player({ relay: RELAY, code, name, id });
      document.getElementById('joinbar').classList.remove('on');
      roomChip('room <b>' + code + '</b>');
      toLobby();
      client.on('joined',   d => onArmState(d, true));
      client.on('armed',    d => onArmState(d, false));
      client.on('disarmed', () => { if(playing) endGame(); });
      client.on('nope', d => {
        let m = null;
        try{ m = JSON.parse((d && d.word) || ''); }catch(_){ return; }
        if(!m || !m.t) return;
        if(m.t === 'tile') onTile(m);
        else if(m.t === 'nb'){
          // a new neighbour on a side must not inherit the old one's ghost word
          if((m.l || '') !== nbL) nbWords.l = null;
          if((m.r || '') !== nbR) nbWords.r = null;
          nbL = m.l || ''; nbR = m.r || '';
          edgesPaint(); nbovPaint();
        }
        else if(m.t === 'nw'){
          /* a neighbour's word: ghosted onto this grid at its real cells when
             valid, pill lit. k = a knock just broke it — explode the ghosts,
             then paint whatever their grid truthfully holds now. */
          const side = m.d === 'l' ? 'l' : 'r';
          const prev = nbWords[side];
          const next = { w: String(m.w || '').slice(0, 10), ok: !!m.ok,
                         x: m.x != null ? Math.max(0, Math.floor(+m.x) || 0) : null,
                         y: m.y != null ? Math.max(0, Math.floor(+m.y) || 0) : null,
                         o: m.o === 'd' ? 'd' : 'a' };
          if(m.k && prev && prev.ok && prev.w) nbovBoom(side);
          nbWords[side] = next;
          document.getElementById('nb-' + side).classList.toggle('lit', next.ok && !!next.w);
          nbovPaint();
        }
        else if(m.t === 'hm'){
          // the room's word-hint mode, the board's setting — repaint in place
          hintMode = (m.m === 'edge' || m.m === 'off') ? m.m : 'ghost';
          nbovPaint();
        }
        else if(m.t === 'full'){
          /* The board seats four. The relay's armed replay may have started
             this phone before the board's verdict arrived, so stand down. */
          full = true;
          toLobby();
          status.textContent = 'Room full — 4 players max.';
          roomChip('room <b>' + roomCode + '</b> · <span style="color:var(--bad)">full</span>');
        }
        else if(m.t === 'sync' && playing && Number(m.left) > 0){
          secsLeft = Math.round(Number(m.left)); paintClock();
        }
      });
      client.on('kicked', () => { roomChip('<span style="color:var(--bad)">removed from the room</span>'); client = null; edgesPaint(); });
      client.on('status', st => {
        const state = (st && st.state) || '';
        roomChip('room <b>' + code + '</b>' +
                 (state === 'connected' ? '' : ' · <span style="color:var(--bad)">' + state + '</span>'));
      });
    }

    /* ?code= (the board's QR) opens the join strip with the code locked in and
       the name focused — nothing starts until Join. Returns true when the solo
       autostart should stand down. */
    function maybeRoomBoot(){
      const code = (qs.get('code') || '').trim();
      /* The bench's phones join themselves — same path a Join press takes,
         no strip, a fresh id per iframe (join() mints one when SIMULATED). */
      if(SIMULATED && /^\d{4,6}$/.test(SIM.code || code) && window.HubBuzzer){
        join(SIM.code || code, SIM.name);
        return true;
      }
      const bar  = document.getElementById('joinbar');
      const nameIn = document.getElementById('j-name'), codeIn = document.getElementById('j-code');
      nameIn.value = seatGet().name || '';
      document.getElementById('j-go').addEventListener('click', () => {
        const c = codeIn.value.trim(), n = nameIn.value.trim() || 'Player';
        if(!/^\d{4,6}$/.test(c) || !window.HubBuzzer) return;
        join(c, n);
      });
      if(!code || !window.HubBuzzer) return false;
      bar.classList.add('on');
      codeIn.value = code; codeIn.readOnly = true;
      status.textContent = 'Enter your name and press Join.';
      nameIn.focus();
      return true;                    // lobby: no autostart, table stays empty
    }

    world.resize();
    /* No code and no Join press = stage 1, byte for byte: solo starts at once.
       A ?code= (the board's QR) opens the join strip instead — the lobby. */
    if(!maybeRoomBoot()) startGame();
    (function loop(){ world.step(); world.draw(); if(validRuns.length) paintBank(); requestAnimationFrame(loop); })();

    /* ---- pointer -> grab / move / drop, exactly as Throw Lab ---- */
    const pt = e => world.pt(e);   // the shelf maps a touch through the painted/natural ratio
    canvas.addEventListener('pointerdown', e => {
      if(!playing) return;                       // time is up; the board is frozen
      const p = pt(e);
      if(world.grab(e.pointerId, p.x, p.y)){
        canvas.classList.add('grabbing');
        canvas.setPointerCapture(e.pointerId);
      }
    });
    canvas.addEventListener('pointermove', e => {
      if(world.heldBy(e.pointerId)){ const p = pt(e); world.move(e.pointerId, p.x, p.y); }
    });
    function endDrag(e){
      if(!world.heldBy(e.pointerId)) return;
      /* Releasing is only ever a drop — a tile is thrown by actually FLYING
         out through the open side edge (the shelf's onExit), never by where
         the finger happened to let go. */
      world.drop(e.pointerId);
      try{ canvas.releasePointerCapture(e.pointerId); }catch(_){}
      if(!world.anyHeld()) canvas.classList.remove('grabbing');
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    /* ---- buttons ---- */
    bankBtn.addEventListener('click', bank);
    document.getElementById('redeal').addEventListener('click', () => { if(playing) deal([]); });
    document.getElementById('again').addEventListener('click', startGame);
    const hintsBtn = document.getElementById('btn-hints');
    hintsBtn.addEventListener('click', () => {
      const off = document.body.classList.toggle('hints-off');
      hintsBtn.textContent = off ? 'Hints off' : 'Hints on';
    });

    /* ---- sliders ---- */
    function bindSlider(id, valId, fmt, apply){
      const el = document.getElementById(id), out = document.getElementById(valId);
      function show(){ out.textContent = fmt(+el.value); }
      el.addEventListener('input', () => { show(); if(apply) apply(+el.value); });
      show();
    }
    bindSlider('s-secs','v-secs',   v => v + 's', null);   // read at the next Play again
    bindSlider('s-mrate','v-mrate', v => '+' + v.toFixed(2) + '/s', null);
    bindSlider('s-mmax','v-mmax',   v => '×' + v.toFixed(2), null);
    bindSlider('s-vow','v-vow',     v => String(v), null);
    /* The physics rows build themselves from the shelf's dial registry — one
       row per dial, wired to setFeel, no defaults repeated on this page. */
    K.table.dialsPanel(document.querySelector(".controls"), world, {
      onChange(k){ if(k === 'size' && playing) deal([]); }   // a new box size wants a fresh rain
    });

    /* ---- collapsible controls: folded away by default on a phone ---- */
    const btnTune = document.getElementById('btn-tune');
    function applyTune(){
      const hidden = document.body.classList.contains('controls-hidden');
      btnTune.textContent = hidden ? '⚙ Tune' : 'Close ✕';
      requestAnimationFrame(() => world.resize());
    }
    if(window.innerWidth < 720) document.body.classList.add('controls-hidden');
    applyTune();
    btnTune.addEventListener('click', () => { document.body.classList.toggle('controls-hidden'); applyTune(); });

    let rz;
    const refit = () => { clearTimeout(rz); rz = setTimeout(() => { world.resize(); nbovPaint(); }, 150); };
    window.addEventListener('resize', refit);
    /* Mobile chrome collapsing/expanding fires on the VISUAL viewport, often
       without a window resize — without this the canvas keeps the height the
       page loaded with and the pile sits behind the bank bar. */
    if(window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    // A handle for driving the page from a test (world.place docks a letter
    // directly); the question bench sets the same kind of debug handle.
    /* `read` is here because world.place() (the reconnect-restore path a test
       drives) fires no onArrange — a driven board must ask for the re-read a
       real dock performs itself. */
    window.__bs = { world, deal, bank, startGame, endGame, read: readBoard,
      /* the suite's throw — the same path as a zone drop, minus the pointer.
         Returns the letter thrown, so a test can watch for it arriving. */
      throw: dir => {
        const side = String(dir || 'R').toUpperCase() === 'L' ? 'l' : 'r';
        const name = side === 'l' ? nbL : nbR;
        if(!client || !playing || !name || rack.length <= MIN_WORD) return false;
        const ch = rack.pop();
        refreshHints();
        world.setPieces(rack); world.slots(GRID);
        validRuns = []; badRuns = []; validKey = ''; validSince = 0;
        send({ t:'th', d: side.toUpperCase(), l: ch,
               vx: side === 'l' ? -18 : 18, vy: -4, ny: 0.4 });
        readBoard(); edgesPaint();
        return ch;
      },
      join, connected: () => !!client,
      /* candidate/candValid kept as views of the run set, so nothing that
         reads the old shape breaks */
      state: () => ({ rack, score, words: validRuns.map(r => r.word),
        candidate: validRuns.length ? validRuns[0].word : '', candValid: !!validRuns.length,
        secsLeft, hints, playing, banked, nbL, nbR, full }) };
  })();
  </script>
</body>
</html>
