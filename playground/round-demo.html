<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Round Demo</title>
<link rel="stylesheet" href="../game-hub/huddle.css?v=20261120b">
<!--
  Round demos — show, don't tell. A prototype of the animation a round plays in its
  intro beat, before the question appears: a finger playing one tiny example of the
  round, so a student knows what to do without reading a word.

  One demo per physics round, each on the REAL table: the same Kit.table a phone
  runs for that round's flick face, with the slot shape the round's own arm sends
  (Multiple Choice: one slot; Connections: a row of four; Word Thermometer: a
  one-column ladder with its two ends; Drag the Words: a flowed word row; Drag the
  Letters: square letter slots), dealt the same way, so the tiles fall and pile
  exactly as a student will see them. The finger is scripted through the shelf's own
  grab / move / drop — the path a student's thumb takes — so every tile travels,
  docks and lands with the real physics, and the slots go green from the shelf's own
  setResult. The question always arrives first and alone, then the tiles fall. The
  examples need as little English as possible (2 + 2, a cat, numbers vs letters).

  Standalone, no relay, no hub. Nothing here is wired into a game yet; when the look
  is agreed the demo moves onto the round's own declaration and the intro beat plays
  it. Tune the timeline in the TIMING block below.
-->
<style>
  html, body { margin:0; height:100%; background:var(--hd-ground); color:var(--hd-paper);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; height:100dvh; }
  #stage { position:relative; flex:1; overflow:hidden; }
  #head { position:absolute; left:0; right:0; top:0; padding:18px 16px 6px; text-align:center;
    font-size:clamp(2rem, 10vw, 3rem); font-weight:800; letter-spacing:0.02em; pointer-events:none; z-index:2; }
  /* the yellow bar that sweeps under the question as it lands — the eye's first stop */
  #hl { position:absolute; left:50%; height:6px; border-radius:3px; background:var(--hd-yellow);
    transform:translateX(-50%) scaleX(0); transform-origin:left center; pointer-events:none; z-index:2; }
  #table { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* The finger: big, coming up out of the bottom of the screen. Its tip is the
     hotspot; the rest runs off the bottom edge. */
  #finger { position:absolute; left:0; top:0; width:120px; height:640px; pointer-events:none; z-index:4;
    transform-origin:60px 14px; filter:drop-shadow(0 10px 18px rgba(0,0,0,0.5)); will-change:transform; }
  #press { position:absolute; width:70px; height:70px; margin:-35px 0 0 -35px; border-radius:50%;
    border:4px solid rgba(255,255,255,0.9); opacity:0; pointer-events:none; z-index:3; }

  #head .end { font-size:0.42em; font-weight:700; color:var(--hd-muted); letter-spacing:0.08em; margin-top:4px; }
  /* A scale's two ends ARE its question: they arrive together as one line, then
     split — the top end to the top of the ladder, the bottom end under its last rung. */
  #head.ends { font-size:clamp(1.5rem, 7.5vw, 2.1rem); }
  #foot { position:absolute; left:0; right:0; margin:0 auto; width:max-content; text-align:center; font-weight:800;
    color:var(--hd-paper); letter-spacing:0.02em; font-size:clamp(1.5rem, 7.5vw, 2.1rem);
    pointer-events:none; z-index:2; display:none; }
  #rounds { display:flex; gap:6px; padding:8px 10px 0; overflow-x:auto; scrollbar-width:none; }
  #rounds::-webkit-scrollbar { display:none; }
  #rounds button { flex:none; font:inherit; font-size:0.78rem; padding:7px 10px; cursor:pointer; color:var(--hd-paper); }
  #rounds button.on { color:var(--hd-ink); }
  #bar { display:flex; gap:10px; justify-content:center; padding:8px 16px calc(12px + env(safe-area-inset-bottom)); }
  #bar button { font:inherit; font-size:0.95rem; padding:10px 16px; cursor:pointer; }
  #bar button.slot-btn { color:var(--hd-paper); }
  #bar button.on { border-style:solid; border-color:var(--hd-yellow); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="table"></canvas>
  <div id="head">2 + 2 = ?</div>
  <div id="hl"></div>
  <div id="foot"></div>
  <div id="press"></div>
  <svg id="finger" viewBox="0 0 120 640" aria-hidden="true">
    <defs>
      <!-- the finger fades out toward its base, so only the tip and first joint read:
           a fingertip coming up out of the screen, not a long pole -->
      <linearGradient id="fadeBack" x1="0" y1="0" x2="0" y2="260" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fff"/><stop offset="0.45" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
      </linearGradient>
      <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="640">
        <rect x="0" y="0" width="120" height="640" fill="url(#fadeBack)"/>
      </mask>
      <linearGradient id="skin" x1="0" x2="1">
        <stop offset="0" stop-color="#f3c9a8"/><stop offset="0.55" stop-color="#ffdcc0"/><stop offset="1" stop-color="#e5b08c"/>
      </linearGradient>
    </defs>
    <!-- one long finger, the tip at (60, 14), the base running off the bottom -->
    <g mask="url(#fade)">
    <path d="M20 640 L20 70 Q20 8 60 8 Q100 8 100 70 L100 640 Z" fill="url(#skin)" stroke="#101318" stroke-width="4"/>
    <!-- the nail -->
    <path d="M38 64 Q38 24 60 24 Q82 24 82 64 L82 92 Q60 100 38 92 Z" fill="#fff3ea" stroke="#101318" stroke-width="3" opacity="0.95"/>
    <!-- knuckle creases -->
    <path d="M36 200 Q60 212 84 200" fill="none" stroke="#b9805e" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 214 Q60 222 80 214" fill="none" stroke="#b9805e" stroke-width="3" stroke-linecap="round"/>
  </g>
  </svg>
</div>
<div id="rounds"></div>
<div id="bar">
  <button id="replay" class="hd-tile yellow">↻ Replay</button>
  <button id="slow" class="hd-slot slot-btn">Slow</button>
</div>

<script src="../game-hub/hub-brand.js?v=20261120b"></script>
<script src="../game-hub/matter.min.js?v=20261120b"></script>
<script>window.HubKit = window.HubKit || {};</script>
<script src="../game-hub/hub-table.js?v=20261120b"></script>
<script>
(function(){
  /* ---- TIMING (ms) ---- */
  const T = {
    qPop: 220,       // the question bursts in, big, in the middle of the screen
    qHold: 380,      // …and stays there long enough to be read first
    qFly: 300,       // then it swooshes up to its place at the top
    settle: 750,     // the tiles fall and pile before the finger comes
    rise: 420,       // the finger comes up out of the bottom edge to the first tile
    press: 150,      // it presses down
    drag: 560,       // the first tile is pushed into its slot at a quick hand's pace
    next: 300,       // the finger glides to the next tile…
    dragNext: 400,   // …and every later tile goes in quicker: the idea is already shown
    rest: 180,       // a still moment over the slot: the table reads the last 120ms of the finger to tell a place from a throw
    sink: 350,       // the finger drops back out of the screen
    hold: 1100       // look at the answer, then go again
  };

  /* ---- THE DEMOS — one per physics round. `shape` is what that round's arm sends a
     phone (the same fields join.html threads into Kit.table); `tiles` are dealt in
     that order; `moves` are [tile label, slot index] in the order the finger plays
     them. Labels match each round's own registered label. ---- */
  const DEMOS = [
    { id:'choice', label:'Multiple Choice', q:'2 + 2 = ?',
      tiles:['3','5','4','6'], shape:{ cols:1, rows:1, count:1, bar:true, upright:true },
      moves:[['4',0]] },
    { id:'grouping', label:'Connections', q:'Find the 4 numbers',
      tiles:['A','3','C','1','B','4','D','2'], shape:{ cols:4, rows:1, count:4, bar:true, upright:true },
      moves:[['1',0],['2',1],['3',2],['4',3]] },
    { id:'ordering', label:'Word Thermometer', q:null, ends:{ top:'↑ biggest', bottom:'smallest ↓' },
      tiles:['dog','mouse','elephant'], shape:{ cols:1, rows:3, bar:true, upright:true },
      moves:[['elephant',0],['dog',1],['mouse',2]] },
    { id:'scramble', label:'Drag the Words', q:'Make the sentence',
      tiles:['cats','I','like'], shape:{ cols:'auto', bar:true, upright:true },
      moves:[['I',0],['like',1],['cats',2]] },
    { id:'anagram', label:'Drag the Letters', q:'🐱',
      tiles:['T','C','A'], shape:null,
      moves:[['C',0],['A',1],['T',2]] }
  ];

  const $ = s => document.querySelector(s);
  const stage = $('#stage'), canvas = $('#table'), head = $('#head'), hl = $('#hl'), foot = $('#foot'),
        finger = $('#finger'), press = $('#press');
  const TIP = { x:60, y:14 };   // the fingertip inside the SVG
  const ID = 'demo';            // the pointer id the script grabs with
  let tbl = null, speed = 1, run = 0, demo = DEMOS[0], headTop = 0;

  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const fingerAt = (x, y, s, tilt) =>
    finger.style.transform = `translate(${x + F.x - TIP.x}px, ${y + F.y - TIP.y}px) rotate(${tilt == null ? -14 : tilt}deg) scale(${s || 1})`;
  const offscreen = x => ({ x: x + 60, y: stage.clientHeight + 40 });   // below the bottom edge, a little right

  // A promise that resolves after ms of demo time; a newer run cancels the older one.
  const wait = (ms, id) => new Promise((ok, no) => setTimeout(() => id === run ? ok() : no('stale'), ms / speed));
  // Animate t 0→1 over ms, calling fn(eased t) every frame.
  const tween = (ms, id, fn) => new Promise((ok, no) => {
    const t0 = performance.now();
    (function f(){
      if(id !== run) return no('stale');
      const t = Math.min(1, (performance.now() - t0) / (ms / speed));
      fn(ease(t), t);
      if(t < 1) requestAnimationFrame(f); else ok();
    })();
  });

  /* Build the table for the chosen round: the question (and a ladder's top end) in
     the overlay, the table's roof under it, and the slots the round's arm declares —
     exactly join.html's order: slots before pieces, labels defaulting to the tiles. */
  function build(){
    head.innerHTML = '';
    const q = document.createElement('div'); q.className = 'q'; q.textContent = demo.ends ? demo.ends.top : demo.q;
    head.appendChild(q); head.classList.toggle('ends', !!demo.ends);
    head.style.left = demo.ends ? '50%' : ''; head.style.right = demo.ends ? 'auto' : '';
    head.style.marginLeft = ''; head.style.width = demo.ends ? 'max-content' : '';
    headTop = Math.ceil(head.getBoundingClientRect().height) + 8;
    tbl = window.HubKit.table({ canvas, upright: !!(demo.shape && demo.shape.upright), sweepGrid: false,
                                lowLatency: true, ceiling: headTop });
    tbl.resize();
    window.__demo = { tbl, demo };   // the probe's window onto the table
  }
  function clear(){
    if(tbl.heldBy(ID)) tbl.drop(ID);
    tbl.reset();
    const sh = demo.shape;
    tbl.slots(sh ? { cols: sh.cols, rows: sh.rows, count: sh.count, bar: sh.bar, labels: demo.tiles, top: headTop }
                 : demo.tiles.length);
    tbl.setResult(null);
    // the ladder's bottom end goes under its last rung, as join.html places it
    foot.style.display = 'none';
    if(demo.ends){
      const last = tbl.slotBox((sh.rows || 1) - 1);
      if(last){ foot.textContent = demo.ends.bottom; foot.style.top = Math.round(last.y + last.h / 2 + 8) + 'px'; foot.style.display = 'block'; }
    }
    if(demo.ends) head.style.marginLeft = (-head.getBoundingClientRect().width / 2) + 'px';   // centred over the ladder
  }
  const deal = () => tbl.setPieces(demo.tiles);

  /* The question first, on its own: it bursts in big in the middle of the screen,
     holds a moment, then swooshes up to its place and a yellow bar sweeps under it.
     The tiles only fall after that, so the eye meets the question before anything
     moves. */
  async function question(id){
    if(demo.ends) return split(id);
    const h = head.getBoundingClientRect(), st = stage.getBoundingClientRect();
    const dy = (st.height * 0.42) - (h.top - st.top + h.height / 2);
    const big = `translateY(${dy}px) scale(1.7)`;
    hl.style.top = (h.bottom - st.top - 2) + 'px';
    hl.style.width = Math.min(h.width - 40, 260) + 'px';
    hl.getAnimations().forEach(a => a.cancel());
    head.getAnimations().forEach(a => a.cancel());
    head.animate([{ opacity:0, transform:`translateY(${dy}px) scale(0.6)` },
                  { opacity:1, transform:`translateY(${dy}px) scale(1.85)`, offset:0.7 },
                  { opacity:1, transform:big }],
                 { duration:T.qPop / speed, easing:'cubic-bezier(.2,1.3,.4,1)', fill:'forwards' });
    await wait(T.qPop + T.qHold, id);
    head.animate([{ transform:big, filter:'blur(0)' },
                  { transform:`translateY(${dy * 0.4}px) scale(1.25)`, filter:'blur(1.5px)', offset:0.45 },
                  { transform:'none', filter:'blur(0)' }],
                 { duration:T.qFly / speed, easing:'cubic-bezier(.6,0,.3,1)', fill:'forwards' });
    await wait(T.qFly, id);
    hl.animate([{ transform:'translateX(-50%) scaleX(0)', opacity:1 },
                { transform:'translateX(-50%) scaleX(1)', opacity:1, offset:0.5 },
                { transform:'translateX(-50%) scaleX(1)', opacity:0 }],
               { duration:900 / speed, easing:'ease-out', fill:'forwards' });
  }

  /* A scale's question is its two ends. They burst in side by side in the middle of
     the screen — "↑ biggest  smallest ↓" — hold a moment, then split: the top end
     flies up to the top of the ladder, the bottom end down under its last rung, so
     the class sees which way the ladder runs before a tile falls. */
  async function split(id){
    const st = stage.getBoundingClientRect(), h = head.getBoundingClientRect(), f = foot.getBoundingClientRect();
    const gap = 18, W = h.width + f.width + gap, cy = st.top + st.height * 0.42, cx = st.left + st.width / 2;
    const hx = (cx - W / 2 + h.width / 2) - (h.left + h.width / 2), hy = cy - (h.top + h.height / 2);
    const fx = (cx + W / 2 - f.width / 2) - (f.left + f.width / 2), fy = cy - (f.top + f.height / 2);
    [head, foot, hl].forEach(el => el.getAnimations().forEach(a => a.cancel()));
    const pop = (dx, dy) => [{ opacity:0, transform:`translate(${dx}px, ${dy}px) scale(0.6)` },
                             { opacity:1, transform:`translate(${dx}px, ${dy}px) scale(1.2)`, offset:0.7 },
                             { opacity:1, transform:`translate(${dx}px, ${dy}px) scale(1.1)` }];
    const o = { duration:T.qPop / speed, easing:'cubic-bezier(.2,1.3,.4,1)', fill:'forwards' };
    head.animate(pop(hx, hy), o); foot.animate(pop(fx, fy), o);
    await wait(T.qPop + T.qHold, id);
    const fly = (dx, dy) => [{ transform:`translate(${dx}px, ${dy}px) scale(1.1)`, filter:'blur(0)' },
                             { transform:`translate(${dx * 0.4}px, ${dy * 0.4}px) scale(1.05)`, filter:'blur(1.5px)', offset:0.45 },
                             { transform:'none', filter:'blur(0)' }];
    const o2 = { duration:(T.qFly + 120) / speed, easing:'cubic-bezier(.6,0,.3,1)', fill:'forwards' };
    head.animate(fly(hx, hy), o2); foot.animate(fly(fx, fy), o2);
    await wait(T.qFly + 120, id);
  }

  /* Grip a tile at its CENTRE. Gripped off-centre a word tile hangs like a pendulum
     and swings under gravity, so it is still moving when the finger lets go and the
     table reads a throw, not a place — the tile bounced back out. The finger is only
     DRAWN low and right of the grip (F), so its tip never covers the word. */
  const G = { x: 0, y: 0 };
  const F = { x: 16, y: 14 };
  const grip = p => ({ x: p.x + G.x, y: p.y + G.y });
  const tileOf = ch => tbl.loose().find(p => p.ch === ch);

  async function play(){
    const id = ++run;
    clear();
    let at = offscreen(stage.clientWidth / 2);
    fingerAt(at.x, at.y);
    try {
      await question(id);
      deal();
      await wait(T.settle, id);

      for(let m = 0; m < demo.moves.length; m++){
        const [ch, slotIdx] = demo.moves[m], first = m === 0;
        if(!tileOf(ch)) continue;
        // 1 · reach the tile: rise out of the bottom edge the first time, glide after that
        const from = first ? offscreen(grip(tileOf(ch)).x) : at;
        await tween(first ? T.rise : T.next, id, e => { const p = tileOf(ch) ? grip(tileOf(ch)) : from;
          fingerAt(from.x + (p.x - from.x) * e, from.y + (p.y - from.y) * e, first ? 1 : 0.93, first ? -14 + 8 * e : -6); });
        if(!tileOf(ch)) continue;
        const t = grip(tileOf(ch));

        // 2 · press: the finger dips, a ring spreads from the tip, and it takes hold
        press.style.left = (t.x + F.x) + 'px'; press.style.top = (t.y + F.y) + 'px';
        press.animate([{ opacity:0.9, transform:'scale(0.3)' }, { opacity:0, transform:'scale(1.5)' }],
                      { duration: 420 / speed, easing:'ease-out' });
        await tween(T.press, id, e => fingerAt(t.x, t.y + 3 * e, 1 - 0.07 * e, -6));
        /* Take hold of THIS tile. A grab takes the nearest tile to the point, and in a
           heap two can overlap — the wrong one came up and was dragged off the table.
           If it is not the one meant, let go and try again on its fresh centre. */
        let held = false;
        for(let k = 0; k < 4 && !held; k++){
          const c = tileOf(ch); if(!c) break;
          if(tbl.grab(ID, c.x, c.y)){
            if(tbl.heldCh(ID) === ch) held = true;
            else { tbl.drop(ID); await new Promise(r => requestAnimationFrame(r)); }
          }
        }
        if(!held) continue;

        // 3 · push it into its slot at a hand's pace, a slight curve like a real thumb
        const slot = tbl.slotBox(slotIdx);
        const a = { x: t.x, y: t.y }, b = { x: slot.x + G.x, y: slot.y + G.y };
        const bend = Math.sign(b.x - a.x || 1) * -16;
        await tween(first ? T.drag : T.dragNext, id, e => {
          const x = a.x + (b.x - a.x) * e + Math.sin(e * Math.PI) * bend, y = a.y + (b.y - a.y) * e;
          tbl.move(ID, x, y); fingerAt(x, y + 3, 0.93, -6);
        });
        /* Home it: the grip is off-centre, and a tile that landed tilted or upside
           down carries that offset rotated — so the tile's own centre is checked
           against the slot's and the grip nudged until they meet, then let go. A
           release that misses the slot is a demo teaching the wrong thing. */
        let gx = b.x, gy = b.y;
        for(let k = 0; k < 12; k++){
          const h = tileOf(ch); if(!h) break;
          const ex = slot.x - h.x, ey = slot.y - h.y;
          if(Math.abs(ex) < 2 && Math.abs(ey) < 2) break;
          gx += ex; gy += ey; tbl.move(ID, gx, gy); fingerAt(gx, gy + 3, 0.93, -6);
          await new Promise(r => requestAnimationFrame(r));
        }
        await wait(T.rest, id);
        tbl.drop(ID);
        window.__demoLog && window.__demoLog(ch, tbl);
        b.x = gx; b.y = gy;
        at = { x: b.x, y: b.y + 3 };
      }

      // 4 · every slot right: the shelf paints it green; the finger leaves
      tbl.setResult('right');
      const out = offscreen(at.x);
      await tween(T.sink, id, e => fingerAt(at.x + (out.x - at.x) * e, at.y + (out.y - at.y) * e, 0.93 + 0.07 * e, -6 - 8 * e));

      await wait(T.hold, id);
      play();
    } catch(_){ /* a newer run took over */ }
  }

  function choose(d){
    demo = d; run++;
    [...document.querySelectorAll('#rounds button')].forEach(b => {
      const on = b.dataset.id === d.id; b.classList.toggle('on', on);
      b.className = (on ? 'hd-tile yellow on' : 'hd-slot');
    });
    build(); play();
  }
  DEMOS.forEach(d => {
    const b = document.createElement('button'); b.dataset.id = d.id; b.textContent = d.label; b.className = 'hd-slot';
    b.onclick = () => choose(d); $('#rounds').appendChild(b);
  });

  (function loop(){ if(tbl){ tbl.step(); tbl.draw(); } requestAnimationFrame(loop); })();

  $('#replay').onclick = () => play();
  $('#slow').onclick = e => { speed = speed === 1 ? 0.5 : 1; e.currentTarget.classList.toggle('on', speed !== 1); play(); };
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { build(); play(); }, 200); });

  // ?round=<id> opens straight on one demo
  const want = new URLSearchParams(location.search).get('round');
  requestAnimationFrame(() => choose(DEMOS.find(d => d.id === want) || DEMOS[0]));
})();
</script>
</body>
</html>
