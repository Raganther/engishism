<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Round Demo</title>
<link rel="stylesheet" href="../game-hub/huddle.css?v=20261120b">
<!--
  Round demos — show, don't tell. A prototype of the animation a round plays in its
  intro beat, before the question appears: a finger playing one tiny example of the
  round, so a student knows what to do without reading a word.

  Multiple Choice first, on the REAL table: the same Kit.table a phone runs for the
  round's flick face (one slot, four word tiles, `count:1`, upright), dealt the same
  way, so the tiles fall and pile exactly as a student will see them. The finger is
  scripted through the shelf's own grab / move / drop — the path a student's thumb
  takes — so the tile travels, docks and lands with the real physics, and the slot
  goes green from the shelf's own setResult. The example is 2 + 2 so it needs no
  English.

  Standalone, no relay, no hub. Nothing here is wired into a game yet; when the look
  is agreed the demo moves onto the round's own declaration and the intro beat plays
  it. Tune the timeline in the TIMING block below.
-->
<style>
  html, body { margin:0; height:100%; background:var(--hd-ground); color:var(--hd-paper);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; height:100dvh; }
  #stage { position:relative; flex:1; overflow:hidden; }
  #head { position:absolute; left:0; right:0; top:0; padding:18px 16px 6px; text-align:center;
    font-size:clamp(2rem, 10vw, 3rem); font-weight:800; letter-spacing:0.02em; pointer-events:none; z-index:2; }
  #table { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* The finger: big, coming up out of the bottom of the screen. Its tip is the
     hotspot; the rest runs off the bottom edge. */
  #finger { position:absolute; left:0; top:0; width:120px; height:640px; pointer-events:none; z-index:4;
    transform-origin:60px 14px; filter:drop-shadow(0 10px 18px rgba(0,0,0,0.5)); will-change:transform; }
  #press { position:absolute; width:70px; height:70px; margin:-35px 0 0 -35px; border-radius:50%;
    border:4px solid rgba(255,255,255,0.9); opacity:0; pointer-events:none; z-index:3; }

  #bar { display:flex; gap:10px; justify-content:center; padding:10px 16px calc(12px + env(safe-area-inset-bottom)); }
  #bar button { font:inherit; font-size:0.95rem; padding:10px 16px; cursor:pointer; }
  #bar button.slot-btn { color:var(--hd-paper); }
  #bar button.on { border-style:solid; border-color:var(--hd-yellow); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="table"></canvas>
  <div id="head">2 + 2 = ?</div>
  <div id="press"></div>
  <svg id="finger" viewBox="0 0 120 640" aria-hidden="true">
    <defs>
      <linearGradient id="skin" x1="0" x2="1">
        <stop offset="0" stop-color="#f3c9a8"/><stop offset="0.55" stop-color="#ffdcc0"/><stop offset="1" stop-color="#e5b08c"/>
      </linearGradient>
    </defs>
    <!-- one long finger, the tip at (60, 14), the base running off the bottom -->
    <path d="M20 640 L20 70 Q20 8 60 8 Q100 8 100 70 L100 640 Z" fill="url(#skin)" stroke="#101318" stroke-width="4"/>
    <!-- the nail -->
    <path d="M38 64 Q38 24 60 24 Q82 24 82 64 L82 92 Q60 100 38 92 Z" fill="#fff3ea" stroke="#101318" stroke-width="3" opacity="0.95"/>
    <!-- knuckle creases -->
    <path d="M36 200 Q60 212 84 200" fill="none" stroke="#b9805e" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 214 Q60 222 80 214" fill="none" stroke="#b9805e" stroke-width="3" stroke-linecap="round"/>
    <path d="M36 380 Q60 392 84 380" fill="none" stroke="#b9805e" stroke-width="3" stroke-linecap="round"/>
  </svg>
</div>
<div id="bar">
  <button id="replay" class="hd-tile yellow">↻ Replay</button>
  <button id="slow" class="hd-slot slot-btn">Slow</button>
</div>

<script src="../game-hub/hub-brand.js?v=20261120b"></script>
<script src="../game-hub/matter.min.js?v=20261120b"></script>
<script>window.HubKit = window.HubKit || {};</script>
<script src="../game-hub/hub-table.js?v=20261120b"></script>
<script>
(function(){
  /* ---- TIMING (ms) — the whole beat ---- */
  const T = {
    settle: 1500,    // the deal falls and piles before the finger comes
    rise: 650,       // the finger comes up out of the bottom edge to the tile
    press: 250,      // it presses down
    drag: 900,       // it pushes the tile up into the slot, at a hand's pace
    rest: 180,       // a still moment over the slot so the release places, not flings
    sink: 550,       // the finger drops back out of the screen
    hold: 1400       // look at the answer, then go again
  };
  const OPTIONS = ['3', '5', '4', '6'];
  const ANSWER = '4';

  const $ = s => document.querySelector(s);
  const stage = $('#stage'), canvas = $('#table'), head = $('#head'), finger = $('#finger'), press = $('#press');
  const TIP = { x:60, y:14 };   // the fingertip inside the SVG
  const ID = 'demo';            // the pointer id the script grabs with
  let tbl = null, speed = 1, run = 0;

  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const fingerAt = (x, y, s, tilt) =>
    finger.style.transform = `translate(${x - TIP.x}px, ${y - TIP.y}px) rotate(${tilt == null ? -14 : tilt}deg) scale(${s || 1})`;
  const offscreen = x => ({ x: x + 60, y: stage.clientHeight + 40 });   // below the bottom edge, a little right

  // A promise that resolves after ms of demo time; a newer run cancels the older one.
  const wait = (ms, id) => new Promise((ok, no) => setTimeout(() => id === run ? ok() : no('stale'), ms / speed));
  // Animate t 0→1 over ms, calling fn(eased t) every frame.
  const tween = (ms, id, fn) => new Promise((ok, no) => {
    const t0 = performance.now();
    (function f(){
      if(id !== run) return no('stale');
      const t = Math.min(1, (performance.now() - t0) / (ms / speed));
      fn(ease(t), t);
      if(t < 1) requestAnimationFrame(f); else ok();
    })();
  });

  function build(){
    /* The phone's own table for a Multiple Choice flick: the shape the round's arm
       sends (cols 1, rows 1, count 1, bar, upright), slots before pieces. */
    const headTop = Math.ceil(head.getBoundingClientRect().height) + 8;
    tbl = window.HubKit.table({ canvas, upright: true, sweepGrid: false, lowLatency: true, ceiling: headTop });
    tbl.resize();
    tbl.slots({ cols:1, rows:1, bar:true, labels:OPTIONS, count:1, top:headTop });
    tbl.setPieces(OPTIONS);
  }

  function deal(){
    const headTop = Math.ceil(head.getBoundingClientRect().height) + 8;
    tbl.reset();
    tbl.slots({ cols:1, rows:1, bar:true, labels:OPTIONS, count:1, top:headTop });
    tbl.setPieces(OPTIONS);
    tbl.setResult(null);
  }

  async function play(){
    const id = ++run;
    if(tbl.heldBy(ID)) tbl.drop(ID);
    deal();
    const park = offscreen(stage.clientWidth / 2);
    fingerAt(park.x, park.y);
    try {
      await wait(T.settle, id);

      // 1 · the finger rises out of the bottom edge to the right answer, wherever it landed
      const tile = () => tbl.loose().find(p => p.ch === ANSWER);
      // grip the tile low and to the right, so the finger never covers the answer
      const G = { x: 24, y: 12 };
      const grip = p => ({ x: p.x + G.x, y: p.y + G.y });
      let t0 = tile(); if(!t0) return;
      let t = grip(t0);
      const from = offscreen(t.x);
      await tween(T.rise, id, e => { const p = tile() ? grip(tile()) : t;
        fingerAt(from.x + (p.x - from.x) * e, from.y + (p.y - from.y) * e, 1, -14 + 8 * e); });
      t = tile() ? grip(tile()) : t;

      // 2 · press: the finger dips, a ring spreads from the tip, and it takes hold
      press.style.left = t.x + 'px'; press.style.top = t.y + 'px';
      press.animate([{ opacity:0.9, transform:'scale(0.3)' }, { opacity:0, transform:'scale(1.5)' }],
                    { duration: 520 / speed, easing:'ease-out' });
      await tween(T.press, id, e => fingerAt(t.x, t.y + 3 * e, 1 - 0.07 * e, -6));
      if(!tbl.grab(ID, t.x, t.y)) return;

      // 3 · push it up into the slot at a hand's pace, a slight curve like a real thumb
      const slot = tbl.slotBox(0);
      const a = { x: t.x, y: t.y }, b = { x: slot.x + G.x, y: slot.y + G.y };
      await tween(T.drag, id, e => {
        const x = a.x + (b.x - a.x) * e + Math.sin(e * Math.PI) * 18, y = a.y + (b.y - a.y) * e;
        tbl.move(ID, x, y); fingerAt(x, y + 3, 0.93, -6);
      });
      tbl.move(ID, b.x, b.y);
      await wait(T.rest, id);

      // 4 · let go: a still release places it, the slot goes green
      tbl.drop(ID);
      tbl.setResult('right');
      const out = offscreen(b.x);
      await tween(T.sink, id, e => fingerAt(b.x + (out.x - b.x) * e, b.y + 3 + (out.y - b.y) * e, 0.93 + 0.07 * e, -6 - 8 * e));

      await wait(T.hold, id);
      play();
    } catch(_){ /* a newer run took over */ }
  }

  (function loop(){ if(tbl){ tbl.step(); tbl.draw(); } requestAnimationFrame(loop); })();

  $('#replay').onclick = () => play();
  $('#slow').onclick = e => { speed = speed === 1 ? 0.5 : 1; e.currentTarget.classList.toggle('on', speed !== 1); play(); };
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { tbl.resize(); play(); }, 200); });

  requestAnimationFrame(() => { build(); play(); });
})();
</script>
</body>
</html>
