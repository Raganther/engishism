<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Throw Lab — Engishism Playground</title>
<style>
  /* Playground page: its own chrome, NOT the hub skin — same as Thermometer and
     Connections. This one is rung 1 of the throw dynamic and proves exactly one
     thing: does flicking a letter box around feel good in the hand? No relay, no
     phones, no judging. The sliders are here so the feel can be dialled in live on
     a real device, because motion is the one thing a screenshot cannot settle. */
  :root{
    --bg:#101318; --panel:#171b22; --text:#f2f2ec; --muted:#9aa0aa;
    --border:#2a2f38; --accent:#00A0DF;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column;
    /* Stop the page itself from panning/zooming under a throw — the canvas owns
       the gesture. Without this, a fast drag scrolls the page on a phone. */
    touch-action:none; -webkit-user-select:none; user-select:none;
    overscroll-behavior:none;
  }
  header{
    flex:0 0 auto; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
    padding:10px 14px 6px;
  }
  h1{ font-size:1.15rem; margin:0; letter-spacing:0.01em; }
  h1 small{ color:var(--muted); font-weight:400; font-size:0.8rem; margin-left:6px; }
  .tune{ margin-left:auto; align-self:center; white-space:nowrap; }

  .controls{
    flex:0 0 auto; display:flex; gap:14px; flex-wrap:wrap; align-items:center;
    padding:4px 14px 10px; border-bottom:1px solid var(--border);
  }
  /* On a phone the eight sliders eat the play area — the Tune button folds them away. */
  body.controls-hidden .controls{ display:none; }
  .ctl{ display:flex; flex-direction:column; gap:2px; min-width:96px; }
  .ctl label{ font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  .ctl input[type=range]{ width:120px; accent-color:var(--accent); }
  .ctl .val{ font-size:0.72rem; color:var(--text); font-variant-numeric:tabular-nums; }
  .word{ display:flex; flex-direction:column; gap:2px; }
  .word label{ font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  .word input[type=text]{
    font:inherit; font-size:0.9rem; letter-spacing:0.12em; text-transform:uppercase;
    width:150px; padding:5px 9px; border-radius:8px;
    border:1px solid var(--border); background:var(--panel); color:var(--text);
  }
  button{
    font:inherit; font-size:0.82rem; padding:7px 14px; border-radius:999px;
    border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer;
  }
  button:hover{ border-color:var(--accent); }

  /* The QR of this page's own URL — the lab is the bench for the shared feel
     dials, and the device that matters is a real phone, so the desktop header
     offers the jump: scan, and the same lab opens in the hand. Hidden on
     narrow screens (that IS the phone) and on file:// (nothing to scan). */
  .pageqr{ display:none; background:#fff; padding:6px; border-radius:8px; line-height:0; align-self:center; }
  .pageqr svg{ width:84px; height:84px; display:block; }
  @media (min-width:720px){ body.qr-on .pageqr{ display:block; } }

  .stage{ flex:1 1 auto; position:relative; min-height:0; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  canvas.grabbing{ cursor:grabbing; }
  .hint{
    position:absolute; left:14px; top:12px; color:var(--muted); font-size:0.75rem;
    pointer-events:none; background:rgba(16,19,24,0.6); padding:4px 8px; border-radius:6px;
  }
</style>
</head>
<body>
  <header>
    <h1>Throw Lab <small>flick the scrambled letters into the slots to spell the word</small></h1>
    <div class="pageqr" id="pageqr" title="Scan to open this lab on your phone"></div>
    <button id="btn-tune" type="button" class="tune">⚙ Tune</button>
  </header>

  <div class="controls">
    <div class="word">
      <label for="word-in">Word</label>
      <input id="word-in" type="text" value="THROW" maxlength="12" autocomplete="off" spellcheck="false">
    </div>
    <!-- The physics rows are NOT here: Kit.table.dialsPanel builds them from
         the shelf's dial registry. This page is the BENCH those dials get
         tuned on — a number that feels right here is written into the
         registry once and every caller inherits it. -->
    <!-- "New word", not "Reset": the dial panel below carries its own
         Reset (the dials), and two Resets meaning different things is a
         button nobody can trust. -->
    <button id="btn-reset" type="button">New word ⟳</button>
  </div>

  <div class="stage">
    <canvas id="stage"></canvas>
    <div class="hint" id="status">Drag the scrambled letters into the slots to spell the word.</div>
  </div>

  <!-- The physics table is a shared shelf now (Kit.table), the same one the hub's
       Toss round will call. Throw Lab is its first caller — the workshop where the
       feel gets tuned. matter.min.js and hub-table.js live in game-hub/ beside the
       other shelves; hub-kit.js is the object Kit.table hangs off. -->
  <script src="../game-hub/hub-qr.js?v=20260827e"></script>
  <script src="../game-hub/matter.min.js?v=20260827e"></script>
  <script src="../game-hub/hub-kit.js?v=20260827e"></script>
  <script src="../game-hub/hub-table.js?v=20260827e"></script>
  <script>
  (function(){
    'use strict';
    const K = window.HubKit;
    if(!K || !K.table){ document.getElementById('status').textContent = 'Kit.table failed to load.'; return; }

    /* ============================ the caller ============================
       Throw Lab owns the word, the judging and the chrome; Kit.table owns the
       physics, the throw, the slots and the draw. The transport here is mouse
       and touch on this page, converted to canvas coords and handed to the
       table — the hub's Toss round will hand it coords from a scaled card, and
       the same table won't know the difference. */
    const canvas = document.getElementById('stage');
    const status = document.getElementById('status');

    let target = '';                       // the word to spell
    function setStatus(res){
      status.textContent = res === 'right' ? '✓ Correct — that spells the word.'
        : res === 'wrong' ? '✗ Not the word yet — pull a letter out and try again.'
        : 'Drag the scrambled letters into the slots to spell the word.';
      status.style.color = res === 'right' ? '#6FB04A' : res === 'wrong' ? '#E2603B' : '';
    }

    /* No feel overrides: the bench must feel exactly like the games it tunes
       for, so every number comes from the shelf's dial registry. */
    const world = K.table({
      canvas,
      onArrange(read, done){               // the table reports the arrangement; the caller judges
        const res = done ? (read === target ? 'right' : 'wrong') : null;
        world.setResult(res);
        setStatus(res);
      }
    });

    function letters(){
      return (document.getElementById('word-in').value || 'THROW').replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 12) || 'THROW';
    }
    function shuffle(word){                 // Fisher-Yates, retried until it isn't the answer
      const a = word.split('');
      for(let tries = 0; tries < 24; tries++){
        for(let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
        if(a.length < 2 || a.join('') !== word) break;
      }
      return a;
    }
    function newWord(){
      target = letters();
      world.reset();
      world.setPieces(shuffle(target));
      world.slots(target.length);
      world.setResult(null);
      setStatus(null);
    }

    world.resize();
    newWord();

    // Fixed-timestep loop: step the physics, draw what came out.
    (function loop(){ world.step(); world.draw(); requestAnimationFrame(loop); })();

    /* ---- pointer -> grab / move / drop (canvas-space coords) ---- */
    const pt = e => world.pt(e);   // the shelf maps a touch through the painted/natural ratio
    canvas.addEventListener('pointerdown', e => {
      const p = pt(e);
      if(world.grab(e.pointerId, p.x, p.y)){
        canvas.classList.add('grabbing');
        canvas.setPointerCapture(e.pointerId);
      }
    });
    canvas.addEventListener('pointermove', e => {
      if(world.heldBy(e.pointerId)){ const p = pt(e); world.move(e.pointerId, p.x, p.y); }
    });
    function endDrag(e){
      if(world.heldBy(e.pointerId)){
        world.drop(e.pointerId);
        try{ canvas.releasePointerCapture(e.pointerId); }catch(_){}
        if(!world.anyHeld()) canvas.classList.remove('grabbing');
      }
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    /* ---- feel sliders: built from the shelf's dial registry ---- */
    const controls = document.querySelector('.controls');
    K.table.dialsPanel(controls, world, {
      onChange(k){ if(k === 'size') newWord(); }   // a new box size wants a fresh scramble
    });
    controls.appendChild(document.getElementById('btn-reset'));   // Reset stays last

    document.getElementById('btn-reset').addEventListener('click', newWord);
    document.getElementById('word-in').addEventListener('change', newWord);

    /* ---- collapsible controls: folded away by default on a phone ---- */
    const btnTune = document.getElementById('btn-tune');
    function applyTune(){
      const hidden = document.body.classList.contains('controls-hidden');
      btnTune.textContent = hidden ? '⚙ Tune' : 'Close ✕';
      requestAnimationFrame(() => world.resize());
    }
    if(window.innerWidth < 720) document.body.classList.add('controls-hidden');
    applyTune();
    btnTune.addEventListener('click', () => { document.body.classList.toggle('controls-hidden'); applyTune(); });

    let rz;
    window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => world.resize(), 150); });

    /* The phone jump: a QR of this page's own URL in the desktop header.
       http(s) only — a file:// URL means nothing to another device. */
    if(/^https?:/.test(location.protocol) && window.qrcode){
      try{
        const q = window.qrcode(0, 'M');
        q.addData(location.href);
        q.make();
        document.getElementById('pageqr').innerHTML = q.createSvgTag({ cellSize:4, margin:0, scalable:true });
        document.body.classList.add('qr-on');
      }catch(e){}
    }

  })();
  </script>
</body>
</html>
