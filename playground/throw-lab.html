<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Throw Lab — Engishism Playground</title>
<style>
  /* Playground page: its own chrome, NOT the hub skin — same as Thermometer and
     Connections. This one is rung 1 of the throw dynamic and proves exactly one
     thing: does flicking a letter box around feel good in the hand? No relay, no
     phones, no judging. The sliders are here so the feel can be dialled in live on
     a real device, because motion is the one thing a screenshot cannot settle. */
  :root{
    --bg:#101318; --panel:#171b22; --text:#f2f2ec; --muted:#9aa0aa;
    --border:#2a2f38; --accent:#00A0DF;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column;
    /* Stop the page itself from panning/zooming under a throw — the canvas owns
       the gesture. Without this, a fast drag scrolls the page on a phone. */
    touch-action:none; -webkit-user-select:none; user-select:none;
    overscroll-behavior:none;
  }
  header{
    flex:0 0 auto; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
    padding:10px 14px 6px;
  }
  h1{ font-size:1.15rem; margin:0; letter-spacing:0.01em; }
  h1 small{ color:var(--muted); font-weight:400; font-size:0.8rem; margin-left:6px; }
  .tune{ margin-left:auto; align-self:center; white-space:nowrap; }

  .controls{
    flex:0 0 auto; display:flex; gap:14px; flex-wrap:wrap; align-items:center;
    padding:4px 14px 10px; border-bottom:1px solid var(--border);
  }
  /* On a phone the eight sliders eat the play area — the Tune button folds them away. */
  body.controls-hidden .controls{ display:none; }
  .ctl{ display:flex; flex-direction:column; gap:2px; min-width:96px; }
  .ctl label{ font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  .ctl input[type=range]{ width:120px; accent-color:var(--accent); }
  .ctl .val{ font-size:0.72rem; color:var(--text); font-variant-numeric:tabular-nums; }
  .word{ display:flex; flex-direction:column; gap:2px; }
  .word label{ font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  .word input[type=text]{
    font:inherit; font-size:0.9rem; letter-spacing:0.12em; text-transform:uppercase;
    width:150px; padding:5px 9px; border-radius:8px;
    border:1px solid var(--border); background:var(--panel); color:var(--text);
  }
  /* A scale is several words with commas — the letter-spacing and uppercasing
     that suit a single word make a comma-list hard to read, so word mode drops
     both and gives the field room. */
  body.words-mode .word input[type=text]{
    text-transform:none; letter-spacing:0.02em; width:280px;
  }
  .word select{
    font:inherit; font-size:0.9rem; padding:5px 9px; border-radius:8px;
    border:1px solid var(--border); background:var(--panel); color:var(--text);
  }
  .word input.dim{
    font:inherit; font-size:0.9rem; width:56px; padding:5px 9px; border-radius:8px;
    border:1px solid var(--border); background:var(--panel); color:var(--text);
  }
  button{
    font:inherit; font-size:0.82rem; padding:7px 14px; border-radius:999px;
    border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer;
  }
  button:hover{ border-color:var(--accent); }

  /* The QR of this page's own URL — the lab is the bench for the shared feel
     dials, and the device that matters is a real phone, so the desktop header
     offers the jump: scan, and the same lab opens in the hand. Hidden on
     narrow screens (that IS the phone) and on file:// (nothing to scan). */
  .pageqr{ display:none; background:#fff; padding:6px; border-radius:8px; line-height:0; align-self:center; }
  .pageqr svg{ width:84px; height:84px; display:block; }
  @media (min-width:720px){ body.qr-on .pageqr{ display:block; } }

  .stage{ flex:1 1 auto; position:relative; min-height:0; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  canvas.grabbing{ cursor:grabbing; }
  .hint{
    position:absolute; left:14px; top:12px; color:var(--muted); font-size:0.75rem;
    pointer-events:none; background:rgba(16,19,24,0.6); padding:4px 8px; border-radius:6px;
  }

  /* Phone preview: reframe the SAME canvas at a real handset's proportions with a
     minimal top strip, so the play surface (painted by Kit.table now) is designed and
     approved exactly as a phone shows it — full-bleed, no inner box. The canvas is
     unchanged; only its frame is. This is the bench for the minimal phone look. */
  .phone-strip{ display:none; }
  body.phone-preview .controls{ display:none; }
  body.phone-preview .hint{ display:none; }
  body.phone-preview .stage{
    max-width:390px; margin:10px auto; border:1px solid var(--border);
    border-radius:18px; overflow:hidden; display:flex; flex-direction:column;
  }
  body.phone-preview .stage canvas{ flex:1 1 auto; height:auto; min-height:0; }
  body.phone-preview .phone-strip{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    flex:0 0 auto; padding:9px 15px; font-size:0.72rem; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--muted); background:#0e1230;
  }
  .phone-strip b{ color:var(--text); font-weight:700; letter-spacing:0.08em; }
</style>
</head>
<body>
  <header>
    <h1>Throw Lab <small>flick the scrambled letters into the slots to spell the word</small></h1>
    <div class="pageqr" id="pageqr" title="Scan to open this lab on your phone"></div>
    <button id="btn-tune" type="button" class="tune">⚙ Tune</button>
    <button id="btn-phone" type="button">📱 Phone</button>
  </header>

  <div class="controls">
    <!-- Two shapes on one bench: square LETTER tiles (the throw dynamic's
         original) and wide WORD tiles in a vertical bar ladder (Word
         Thermometer's stack mode). A rectangle behaves differently from a
         square under the same physics — it can tip onto its narrow edge — so
         the feel has to be tuned against the real shape, which is why the
         bench carries both. Both default to Rotate — the single default every
         round inherits; the Rotation picker tries Upright or Locked live. -->
    <div class="word">
      <label for="mode-in">Tiles</label>
      <select id="mode-in">
        <option value="letters">Letters (square)</option>
        <option value="words">Words (bar ladder)</option>
      </select>
    </div>
    <!-- Layout: the slot ARRANGEMENT, composed with the Tiles shape above. Row is
         one line (1×N — a spelled word, a scale); Grid is cols×rows — a crossword
         like Battle Scrabble, a 2-column sort, anything. A game calls
         slots({cols,rows}); this is where you design and feel one first. Grid fills
         itself with tiles so the whole layout can be tried, not just a word's worth. -->
    <div class="word">
      <label for="layout-in">Layout</label>
      <select id="layout-in">
        <option value="row">Row (one line)</option>
        <option value="grid">Grid (cols × rows)</option>
      </select>
    </div>
    <div class="word" id="grid-dims" style="display:none;">
      <label>Grid — cols × rows</label>
      <span style="display:flex; gap:6px; align-items:center;">
        <input id="cols-in" type="number" min="1" max="9" value="3" class="dim">
        <span style="color:var(--muted);">×</span>
        <input id="rows-in" type="number" min="1" max="9" value="3" class="dim">
      </span>
    </div>
    <!-- Rotation is a shelf behaviour, not a tuned number, so it is a picker
         here rather than a saved dial. Rotate is the single default every round
         inherits — every tile swings and tumbles the same way whatever its
         shape. The other two are available to try but no round forces one:
         Upright lets a tile lean where it props but settles it flat, never on
         its edge (K.table({ upright: true })); Locked pins it dead flat
         (K.table({ lockRot: true })). -->
    <div class="word">
      <label for="rot-in">Rotation</label>
      <select id="rot-in">
        <option value="free">Rotate (default)</option>
        <option value="upright">Upright (lean, settle flat)</option>
        <option value="lock">Locked (all flat)</option>
      </select>
    </div>
    <div class="word">
      <label for="word-in" id="word-label">Word</label>
      <input id="word-in" type="text" value="THROW" maxlength="80" autocomplete="off" spellcheck="false">
    </div>
    <!-- The physics rows are NOT here: Kit.table.dialsPanel builds them from
         the shelf's dial registry. This page is the BENCH those dials get
         tuned on — a number that feels right here is written into the
         registry once and every caller inherits it. -->
    <!-- "New word", not "Reset": the dial panel below carries its own
         Reset (the dials), and two Resets meaning different things is a
         button nobody can trust. -->
    <button id="btn-reset" type="button">New deal ⟳</button>
  </div>

  <div class="stage">
    <div class="phone-strip"><b>Ana</b><span>Room <b>53950</b></span></div>
    <canvas id="stage"></canvas>
    <div class="hint" id="status">Drag the scrambled letters into the slots to spell the word.</div>
  </div>

  <!-- The physics table is a shared shelf now (Kit.table), the same one the hub's
       physics rounds (anagram flick, ordering stack) call. Throw Lab is its first caller — the workshop where the
       feel gets tuned. matter.min.js and hub-table.js live in game-hub/ beside the
       other shelves; hub-kit.js is the object Kit.table hangs off. -->
  <script src="../game-hub/hub-qr.js?v=20260902a"></script>
  <script src="../game-hub/matter.min.js?v=20260902a"></script>
  <script src="../game-hub/hub-kit.js?v=20260902a"></script>
  <script src="../game-hub/hub-table.js?v=20260902a"></script>
  <script>
  (function(){
    'use strict';
    const K = window.HubKit;
    if(!K || !K.table){ document.getElementById('status').textContent = 'Kit.table failed to load.'; return; }

    /* ============================ the caller ============================
       Throw Lab owns the word, the judging and the chrome; Kit.table owns the
       physics, the throw, the slots and the draw. The transport here is mouse
       and touch on this page, converted to canvas coords and handed to the
       table — a physics round hands it coords from a scaled card, and
       the same table won't know the difference. */
    const canvas = document.getElementById('stage');
    const status = document.getElementById('status');

    /* Two shapes, one bench. `letters` spells one word into square slots (the
       throw dynamic's original test); `words` orders a scale into a vertical
       bar ladder (Word Thermometer's stack mode) — the shape whose physics
       needed tuning. The mode picker chooses; everything below branches on it. */
    let mode = 'letters';
    let gridMode = false;                  // Layout picker: a cols×rows grid vs a row
    let target = '';                       // letters mode: the word to spell
    let targetOrder = [];                  // words mode: the scale, top-to-bottom

    function setStatus(res){
      if(gridMode){                        // a grid is a layout to feel, not a puzzle
        status.textContent = 'Flick the tiles into the grid — a layout to design and feel, no answer to check.';
        status.style.color = '';
        return;
      }
      const noun = mode === 'words' ? 'order' : 'word';
      status.textContent = res === 'right' ? '✓ Correct — that is the ' + noun + '.'
        : res === 'wrong' ? '✗ Not the ' + noun + ' yet — pull a tile out and try again.'
        : mode === 'words' ? 'Flick the words into order, top to bottom.'
        : 'Drag the scrambled letters into the slots to spell the word.';
      status.style.color = res === 'right' ? '#6FB04A' : res === 'wrong' ? '#E2603B' : '';
    }

    /* No feel overrides: the bench must feel exactly like the games it tunes
       for, so every number comes from the shelf's dial registry. */
    const world = K.table({
      canvas,
      onArrange(read, done){               // the table reports the arrangement; the caller judges
        let res = null;
        if(done && !gridMode){             // a grid has no answer — it is a layout to feel
          const ok = mode === 'words'
            ? world.cells().join('|').toLowerCase() === targetOrder.join('|').toLowerCase()
            : read === target;
          res = ok ? 'right' : 'wrong';
        }
        world.setResult(res);
        setStatus(res);
      }
    });

    function letters(){
      return (document.getElementById('word-in').value || 'THROW').replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 12) || 'THROW';
    }
    /* Words mode: the field is a comma-separated scale, weakest first. Falls
       back to the anger scale so an empty field still deals something to feel. */
    const SCALE = ['annoyed', 'irritated', 'angry', 'livid', 'furious'];
    function words(){
      const raw = String(document.getElementById('word-in').value || '')
        .split(',').map(s => s.trim()).filter(Boolean).slice(0, 8);
      return raw.length >= 2 ? raw : SCALE.slice();
    }
    function shuffleArr(arr){               // Fisher-Yates, retried until it isn't the answer
      const a = arr.slice();
      for(let tries = 0; tries < 24; tries++){
        for(let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
        if(a.length < 2 || a.join('|') !== arr.join('|')) break;
      }
      return a;
    }
    // Grid layout deals enough tiles to fill the whole cols×rows, so the layout can
    // be felt full: word tiles cycle the scale, letter tiles are random A–Z (a
    // Scrabble-ish board). A game never does this — it deals its own content — but
    // the bench needs something in every cell to design against.
    function clampDim(id){ const v = parseInt(document.getElementById(id).value, 10); return Math.max(1, Math.min(9, isNaN(v) ? 3 : v)); }
    function gridPieces(n){
      if(mode === 'words'){ const ws = words(); return Array.from({ length:n }, (_, i) => ws[i % ws.length]); }
      return Array.from({ length:n }, () => String.fromCharCode(65 + Math.floor(Math.random() * 26)));
    }
    function newWord(){
      world.reset();
      if(gridMode){
        const cols = clampDim('cols-in'), rows = clampDim('rows-in');
        /* Slots before pieces (the pile spread reads the declared slot width).
           Words → bar slots sized to the widest; letters → square cells. */
        world.slots(mode === 'words' ? { cols, rows, bar:true, labels: words() } : { cols, rows });
        world.setPieces(gridPieces(cols * rows));
        target = ''; targetOrder = [];
      } else if(mode === 'words'){
        targetOrder = words();
        /* Slots before pieces: the shelf's pile spread reads the declared slot
           width, so a hand of wide word tiles is dealt across the room they
           actually need — the same order Word Thermometer's stack mode uses. */
        world.slots({ cols:1, rows:targetOrder.length, bar:true, labels:targetOrder });
        world.setPieces(shuffleArr(targetOrder));
      } else {
        target = letters();
        world.setPieces(shuffleArr(target.split('')));
        world.slots(target.length);
      }
      world.setResult(null);
      setStatus(null);
    }

    world.resize();
    newWord();

    // Fixed-timestep loop: step the physics, draw what came out.
    (function loop(){ world.step(); world.draw(); requestAnimationFrame(loop); })();

    /* a driven test's handle — same kind of window as join.html's __tbl. The
       bench proves a bar tile settles flat, so it reads the loose tiles' angles. */
    window.__lab = { world, loose: () => world.loose(), mode: () => mode };

    /* ---- pointer -> grab / move / drop (canvas-space coords) ---- */
    const pt = e => world.pt(e);   // the shelf maps a touch through the painted/natural ratio
    canvas.addEventListener('pointerdown', e => {
      const p = pt(e);
      if(world.grab(e.pointerId, p.x, p.y)){
        canvas.classList.add('grabbing');
        canvas.setPointerCapture(e.pointerId);
      }
    });
    canvas.addEventListener('pointermove', e => {
      if(world.heldBy(e.pointerId)){ const p = pt(e); world.move(e.pointerId, p.x, p.y); }
    });
    function endDrag(e){
      if(world.heldBy(e.pointerId)){
        world.drop(e.pointerId);
        try{ canvas.releasePointerCapture(e.pointerId); }catch(_){}
        if(!world.anyHeld()) canvas.classList.remove('grabbing');
      }
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    /* ---- feel sliders: built from the shelf's dial registry ---- */
    const controls = document.querySelector('.controls');
    K.table.dialsPanel(controls, world, {
      // size and grid gap change the LAYOUT, so re-deal to reflow; grid line is
      // draw-only and updates live with no re-deal.
      onChange(k){ if(k === 'size' || k === 'gridGap') newWord(); }
    });
    controls.appendChild(document.getElementById('btn-reset'));   // Reset stays last

    document.getElementById('btn-reset').addEventListener('click', newWord);
    document.getElementById('word-in').addEventListener('change', newWord);

    /* ---- the tile-shape picker ---- */
    const modeIn = document.getElementById('mode-in');
    const wordIn = document.getElementById('word-in');
    const wordLabel = document.getElementById('word-label');
    function applyMode(){
      mode = modeIn.value === 'words' ? 'words' : 'letters';
      document.body.classList.toggle('words-mode', mode === 'words');
      // the one field carries a word or a scale; swap its default and label so
      // switching does not leave a single word sitting in a comma-list field
      if(mode === 'words'){
        wordLabel.textContent = 'Scale — weakest first, commas between';
        if(wordIn.value.indexOf(',') === -1) wordIn.value = SCALE.join(', ');
      } else {
        wordLabel.textContent = 'Word';
        if(wordIn.value.indexOf(',') !== -1) wordIn.value = 'THROW';
      }
      // Rotation is NOT reset on a shape switch: Rotate is the single default for
      // every shape now (no round overrides it); the picker still tries Upright
      // or Locked live, but nothing forces one.
      newWord();
    }
    modeIn.addEventListener('change', applyMode);

    /* ---- the layout picker: a row or a cols×rows grid ----
       Composes with the Tiles shape: Grid + Letters is a crossword of square
       cells (Battle Scrabble), Grid + Words a board of bar tiles, Row is the
       single line the rounds use. A game calls slots({cols,rows}); this designs
       and feels one before it does. */
    const layoutIn = document.getElementById('layout-in');
    const gridDims = document.getElementById('grid-dims');
    function applyLayout(){
      gridMode = layoutIn.value === 'grid';
      gridDims.style.display = gridMode ? '' : 'none';
      newWord();
    }
    layoutIn.addEventListener('change', applyLayout);
    document.getElementById('cols-in').addEventListener('change', () => { if(gridMode) newWord(); });
    document.getElementById('rows-in').addEventListener('change', () => { if(gridMode) newWord(); });

    /* ---- the rotation picker: a per-round behaviour tried live ----
       Rotate (default) lets every tile tumble; Locked pins them flat.
       setFeel carries it into the world, then a fresh deal shows it — the
       same lockRot a round would pass to K.table at construction. */
    const rotIn = document.getElementById('rot-in');
    function applyRot(){
      // three behaviours from the one picker: free tumble, upright (leans but
      // settles flat, never on its edge), and the hard flat lock.
      world.setFeel({ lockRot: rotIn.value === 'lock', upright: rotIn.value === 'upright' });
      newWord();
    }
    rotIn.addEventListener('change', applyRot);

    /* ---- collapsible controls: folded away by default on a phone ---- */
    const btnTune = document.getElementById('btn-tune');
    function applyTune(){
      const hidden = document.body.classList.contains('controls-hidden');
      btnTune.textContent = hidden ? '⚙ Tune' : 'Close ✕';
      requestAnimationFrame(() => world.resize());
    }
    if(window.innerWidth < 720) document.body.classList.add('controls-hidden');
    applyTune();
    btnTune.addEventListener('click', () => { document.body.classList.toggle('controls-hidden'); applyTune(); });

    /* Phone preview: reframe the stage to a handset's proportions so the play surface
       is seen as a phone shows it. Re-fit the canvas after the frame changes size. */
    document.getElementById('btn-phone').addEventListener('click', () => {
      document.body.classList.toggle('phone-preview');
      requestAnimationFrame(() => world.resize());
    });

    let rz;
    window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => world.resize(), 150); });

    /* The phone jump: a QR of this page's own URL in the desktop header.
       http(s) only — a file:// URL means nothing to another device. */
    if(/^https?:/.test(location.protocol) && window.qrcode){
      try{
        const q = window.qrcode(0, 'M');
        q.addData(location.href);
        q.make();
        document.getElementById('pageqr').innerHTML = q.createSvgTag({ cellSize:4, margin:0, scalable:true });
        document.body.classList.add('qr-on');
      }catch(e){}
    }

  })();
  </script>
</body>
</html>
