<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Scrabble — the board</title>
<style>
  /* The projector's half of Battle Scrabble. This page hosts the room and owns
     the truth the phones cannot: the seating circle (join order, wraparound),
     the standings, the clock, and who a throw actually lands on. Every phone
     runs battle-scrabble.html — the QR below points there, not at join.html.
     Chrome copied from the other playground boards; no hub skin. */
  :root{
    --bg:#101318; --panel:#171b22; --text:#f2f2ec; --muted:#9aa0aa;
    --border:#2a2f38; --accent:#00A0DF; --good:#6FB04A; --bad:#E2603B; --gold:#E8B93E;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column;
  }
  header{ flex:0 0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 18px; border-bottom:1px solid var(--border); }
  h1{ font-size:1.3rem; margin:0; }
  h1 small{ color:var(--muted); font-weight:400; font-size:0.85rem; margin-left:8px; }
  #room-slot{ margin-left:auto; }
  #settings-slot{ display:flex; gap:10px; align-items:center; }
  button{
    font:inherit; font-size:0.95rem; padding:9px 20px; border-radius:999px;
    border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer;
  }
  button:hover{ border-color:var(--accent); }
  #start{ background:var(--accent); border-color:var(--accent); color:#08131a; font-weight:700; }

  main{ flex:1 1 auto; display:flex; min-height:0; }
  .arena{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; padding:8px 16px 14px; }

  /* The clock, toast and crown line sit in a strip above the grids now that
     the grids ARE the screen. */
  #topstrip{ flex:0 0 auto; text-align:center; }
  #big-clock{ font-size:2.6rem; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1; }
  #big-clock.urgent{ color:var(--bad); }
  #toast{ min-height:1.3em; color:var(--bad); font-weight:600; }
  #banner{ color:var(--gold); font-size:1.5rem; font-weight:800; min-height:1.2em; }

  /* The main screen: every player's 8×8, live, side by side in SEAT ORDER —
     so neighbours on the ring are neighbours on the screen, and the room can
     watch each word form. Four seats maximum, so this row never wraps and
     never scrolls (the board rule). */
  #grids{ flex:1 1 auto; min-height:0; display:flex; gap:18px; justify-content:center; align-items:stretch; padding-top:8px; }
  /* Each mirror is PHONE-SHAPED — a tall rounded rectangle in handset
     proportions, grid up top where it sits on the real phone, empty pile
     space below, the live word in a bottom pill where BANK lives. A square
     box read as "a grid somewhere"; this reads as "that player's phone". */
  .panel{
    flex:0 1 auto; height:100%; aspect-ratio: 39 / 80; min-width:0;
    display:flex; flex-direction:column;
    background:var(--panel); border:2px solid #3a4356; border-radius:24px;
    padding:10px 12px 12px;
  }
  .panel .head{ flex:0 0 auto; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .panel .nm{ font-weight:700; font-size:1.05rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .panel .sc{ font-size:1.35rem; font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums; }
  /* the word this player is spelling right now — the bottom pill, where the
     BANK button sits on the handset; gold once it is a real word */
  .panel .lw{
    flex:0 0 auto; margin-top:auto; text-align:center;
    border:1px solid var(--border); border-radius:999px; padding:4px 10px;
    font-size:0.8rem; font-weight:700; letter-spacing:0.12em; min-height:1.6em; color:var(--muted);
  }
  .panel .lw.ok{ color:var(--gold); border-color:var(--gold); }
  .panel .cells{
    flex:0 0 auto;
    /* --gcols is set by render() from the grid the phone actually sent — the
       grid's shape has ONE home, the phone's COLS, and it travels on the wire
       as the message's length. 7 here is only the pre-first-message default. */
    display:grid; grid-template-columns:repeat(var(--gcols, 7), 1fr); gap:3px; margin-top:8px;
  }
  .panel .cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border:1px solid #39414f; border-radius:5px;
    font-weight:800; font-size:clamp(0.6rem, 1.4vw, 1rem); color:var(--text);
  }
  .panel .cell.on{ background:#2a3550; border-style:solid; border-color:#5a6473; }
  .panel .cell.ok{ background:rgba(232,185,62,0.22); border-color:var(--gold); color:var(--gold); }
  .panel.gone{ opacity:0.35; }
  .panel.hit{ animation:panel-shake 0.5s; border-color:var(--bad); }
  @keyframes panel-shake{
    0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-8px); }
    50%{ transform:translateX(8px); } 75%{ transform:translateX(-5px); }
  }

  aside{
    flex:0 0 240px; border-left:1px solid var(--border); padding:14px 16px;
    display:flex; flex-direction:column; gap:8px; overflow:hidden;
  }
  aside h2{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin:0; }
  .stand{ display:flex; justify-content:space-between; gap:8px; font-variant-numeric:tabular-nums; padding:4px 0; border-bottom:1px solid var(--border); }
  .stand b{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stand:first-of-type b{ color:var(--gold); }
  .hint{ color:var(--muted); font-size:0.8rem; }
</style>
</head>
<body>
  <header>
    <h1>Battle Scrabble <small>the board — phones scan the code and play</small></h1>
    <button id="start" type="button">Start ▶</button>
    <div id="settings-slot"></div>
    <div id="room-slot"></div>
  </header>
  <main>
    <div class="arena">
      <div id="topstrip">
        <div id="big-clock">–:––</div>
        <div id="toast"></div>
        <div id="banner"></div>
      </div>
      <div id="grids"></div>
    </div>
    <aside>
      <h2>Standings</h2>
      <div id="stand"></div>
      <p class="hint" id="hint">Waiting for players — phones scan the room code (top right) and join with their name.</p>
    </aside>
  </main>

<script src="../game-hub/hub-buzzer.js?v=20260829d"></script>
<script src="../game-hub/hub-qr.js?v=20260829d"></script>
<script src="bench-kit.js?v=20260829d"></script>
<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  if(!window.BenchKit){ $('hint').textContent = 'BenchKit failed to load.'; return; }

  /* ==================== the room — the protocol ====================
     Duplicated verbatim on the phone page (battle-scrabble.html): JSON rides
     the relay's existing messages — nothing new on the wire.
     Up, via respond() (<=120 chars), tagged `t`, per-phone sequence `q`
       (the receiver drops replays per TYPE — w and g leave as concurrent
       POSTs, so one shared counter dropped whichever lost the race):
       {"t":"s","q":7,"sc":41.5,"w":"QUIZ","n":4[,"f":1]}   score (f = final)
       {"t":"th","q":8,"d":"L","l":"Q","c":"#F5C542","vx":-14.2,"vy":-3.1,"ny":0.42}
         throw: the tile (letter and colour) plus the velocity it left the
         screen with — the tile itself travels to the neighbour
       {"t":"w","q":9,"w":"QUIZ","ok":1[,"x":2,"y":0,"o":"a"][,"k":1,"h":"Ben"]}
         word in progress (ok = a real word); a valid word carries its start
         cell and orientation (o = a/d, across/down) so neighbours can ghost
         it in place; k = this update is a knock's aftermath, h = who hit
       {"t":"g","q":10,"b":"<COLS*ROWS chars, . = empty>","v":"<hex valid mask, a nibble per 4 cells>"}
         the grid, row-major, for the main screen's live mirror — this page
         derives the grid's shape from b's length, never holds its own
     Down, to one phone via nope():
       {"t":"tile","by":"Maria","d":"L","l":"Q","c":"#F5C542","vx":-14.2,"vy":-3.1,"ny":0.42}
         an incoming tile, routed whole — the receiver spawns it moving as
         it left the thrower's screen, wearing its own colour, theirs now
       {"t":"nw","d":"l","w":"QUIZ","ok":1[,"x":2,"y":0,"o":"a"][,"k":1]}
         your left/right neighbour's word, position and knock flag carried
         through from their "w" — valid words ghost onto this grid in place
       {"t":"nb","l":"Maria","r":"Ken"}    your neighbours' names
       {"t":"hm","m":"ghost"|"edge"|"off"}  the room's word-hint mode (a board
         setting): in-place ghost, edge-anchored at row height, or none
       {"t":"sync","left":48}              clock sync for a late joiner
       {"t":"full"}                        the board seats four; this phone waits
     Start rides arm({mode:'answer',rethink:true,secs}); the board holds the
     room armed through a grace period after time-up so finals still land.
     Receivers ignore non-JSON and unknown `t` — that is the compat rule. */

  let host = null;
  const MAXP = 4;            // the screen holds four grids; the room seats four
  /* The seats: append-only ids, in join order, never reordered and never
     deleted — the neighbour pinning. The relay's roster drops a player who
     disconnects and re-appends them on return; this array is why that cannot
     shuffle who is throwing at whom. */
  const seats = [];
  const players = {};        // id -> { name, score, words, lastWord, lastQ (per message type), present, lastNb }
  let running = false, endsAt = 0, tick = null;

  const settings = BenchKit.settings($('settings-slot'), [
    { id:'secs', label:'Game time', default:'120',
      options:[ {value:'60',label:'1 min'}, {value:'120',label:'2 min'},
                {value:'180',label:'3 min'}, {value:'300',label:'5 min'} ] },
    /* How a neighbour's word shows on the phones — a ROOM rule, flipped here
       and pushed to every handset, so the whole class plays the same game.
       'ghost' is the original in-place overlay (right for a duel); 'edge'
       anchors each word to its owner's edge at its row height (the 4-player
       answer under trial); 'off' is surprise attacks only. */
    { id:'hintmode', label:'Word hints', default:'ghost',
      options:[ {value:'ghost',label:'Hints: on the grid'},
                {value:'edge', label:'Hints: on the edges'},
                {value:'off',  label:'Hints: off'} ] }
  ], id => { if(id === 'hintmode') pushHint(); });

  const room = BenchKit.room({
    mount: $('room-slot'),
    board: 'battle-scrabble-board.html',
    joinPath: '/playground/battle-scrabble.html',
    on: {
      ready(h){ host = h; },
      players(list){
        (list || []).forEach(p => {
          if(!players[p.id]){
            /* The board seats FOUR — the screen holds four grids and the ring
               four throwers. A fifth phone is told so and skipped everywhere;
               reconnects of already-seated ids are unaffected (same id, same
               seat, the append-only rule below). */
            if(seats.length >= MAXP){
              if(host) host.nope(p.id, JSON.stringify({ t:'full' }));
              return;
            }
            players[p.id] = { name:p.name, score:0, words:0, lastWord:'', lastQ:{}, present:true, lastNb:'', lastHm:'',
                              live:'', liveOk:false, lastNw:{ l:'', r:'' }, grid:'', gridV:'' };
            seats.push(p.id);
          }
          players[p.id].name = p.name;
        });
        const here = new Set((list || []).map(p => p.id));
        seats.forEach(id => { players[id].present = here.has(id); });
        render();
        pushNb();
        pushHint();
        /* A phone seen (or seen again) mid-game gets the real clock — the
           relay replays the original arm, whose secs are stale by now. */
        if(running && host){
          const left = Math.max(1, Math.round((endsAt - Date.now()) / 1000));
          (list || []).forEach(p => host.nope(p.id, JSON.stringify({ t:'sync', left })));
        }
      },
      response(d){
        const v = d && d.latest;
        if(!v || !host) return;
        let m = null;
        try{ m = JSON.parse(v.value || ''); }catch(_){ return; }
        if(!m || !m.t) return;
        const pl = players[v.id];
        if(!pl) return;
        /* The relay stores one value per player and replays it, so the same
           message can arrive twice — the sequence makes a replay a no-op.
           Deduped PER TYPE: the phone's w and g leave the same readBoard as
           two concurrent POSTs, and nothing orders two sockets — with one
           shared counter, a g (q=n+1) beating its w (q=n) to the relay made
           the board drop the w as a replay, permanently (the phone dedupes
           at send time and never re-sends a word it believes delivered).
           A replay is of ONE stored value, so per-type is what the guard
           always needed. */
        if(m.q != null){ if(m.q <= (pl.lastQ[m.t] || 0)) return; pl.lastQ[m.t] = m.q; }
        if(m.t === 's'){
          pl.score = Number(m.sc) || 0;
          pl.words = Number(m.n) || 0;
          pl.lastWord = String(m.w || '').slice(0, 12);
          render();
        } else if(m.t === 'th' && running){
          routeThrow(v.id, m);
        } else if(m.t === 'w'){
          /* the word in progress: shown on this player's panel, and routed to
             their two ring neighbours so the phones can light it up */
          pl.live = String(m.w || '').slice(0, 12);
          pl.liveOk = !!m.ok;
          render();
          routeLive(v.id, m);
          /* a knock's aftermath: the projector gets the same beat the victim's
             phone shows — who hit whose word — via the throw toast's mechanics,
             and the victim's panel takes the hit shake */
          if(m.k){
            $('toast').textContent = String(m.h || 'Someone').slice(0, 20) + ' hit ' + pl.name + "'s word!";
            setTimeout(() => { if(!$('banner').textContent) $('toast').textContent = ''; }, 2200);
            const el = document.querySelector('.panel[data-id="' + v.id + '"]');
            if(el){ el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }
          }
        } else if(m.t === 'g'){
          // the player's grid, mirrored live on the main screen. The length IS
          // the shape (render derives cols from it); the relay's 120-char cap
          // bounds it, the slice is only a guard against a malformed message.
          pl.grid = String(m.b || '').slice(0, 100);
          pl.gridV = String(m.v || '').slice(0, 25);
          render();
        }
      }
    }
  });

  /* Neighbours over the *present* seats, wrapping — the thrower's left is the
     previous seat, their right the next. The board is the one authority; the
     phones' zone labels come only from these pushes. */
  function presentSeats(){ return seats.filter(id => players[id].present); }
  function neighbours(id){
    const ring = presentSeats();
    const i = ring.indexOf(id);
    if(i === -1 || ring.length < 2) return null;
    return { l: ring[(i - 1 + ring.length) % ring.length],
             r: ring[(i + 1) % ring.length] };
  }
  function pushNb(){
    if(!host) return;
    presentSeats().forEach(id => {
      const nb = neighbours(id);
      const msg = JSON.stringify(nb
        ? { t:'nb', l: players[nb.l].name, r: players[nb.r].name }
        : { t:'nb', l:'', r:'' });
      if(players[id].lastNb === msg) return;      // only phones whose view changed
      players[id].lastNb = msg;
      host.nope(id, msg);
    });
  }

  /* The room's hint mode, pushed like the neighbour names: deduped per phone,
     re-sent to a phone that reconnects, and immediately on the select changing —
     mid-game flips are the whole point of the experiment. */
  function pushHint(){
    if(!host) return;
    const msg = JSON.stringify({ t:'hm', m: settings.get('hintmode') });
    presentSeats().forEach(id => {
      if(players[id].lastHm === msg) return;
      players[id].lastHm = msg;
      host.nope(id, msg);
    });
  }

  function routeThrow(fromId, m){
    const nb = neighbours(fromId);
    if(!nb) return;                                // nobody to hit
    const target = (String(m.d).toUpperCase() === 'L') ? nb.l : nb.r;
    /* The whole throw travels: letter, exit velocity, release height and the
       side it left through. The board routes, it does not interpret — the
       receiving phone spawns the tile moving as it left the thrower's screen. */
    host.nope(target, JSON.stringify({ t:'tile', by: players[fromId].name,
      d: String(m.d || 'R'), l: m.l || '', c: String(m.c || '').slice(0, 9),
      vx: Number(m.vx) || 0, vy: Number(m.vy) || 0, ny: Number(m.ny) || 0.3 }));
    $('toast').textContent = players[fromId].name + ' → ' + players[target].name + ' !';
    setTimeout(() => { if(!$('banner').textContent) $('toast').textContent = ''; }, 1800);
    const el = document.querySelector('.panel[data-id="' + target + '"]');
    if(el){ el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }
  }

  /* A player's word-in-progress goes to their two neighbours. The speller sits
     at their left neighbour's RIGHT edge (and vice versa), so the side flag is
     from the receiver's point of view. Deduped per target-per-side exactly as
     pushNb dedupes, or every re-render would re-send an unchanged word. */
  function routeLive(fromId, m){
    const nb = neighbours(fromId);
    if(!nb) return;
    const pl = players[fromId];
    [[nb.l, 'r'], [nb.r, 'l']].forEach(([target, side]) => {
      /* position and knock flag are carried whole, never interpreted — the
         receiving phone places the ghost and plays the bang. A knock always
         sends: the dedupe would swallow one whose word text happens to match
         the last push, and the bang is the message. */
      const o = { t:'nw', d: side, w: pl.live, ok: pl.liveOk ? 1 : 0 };
      if(m.x != null){ o.x = Number(m.x) || 0; o.y = Number(m.y) || 0; o.o = m.o === 'd' ? 'd' : 'a'; }
      if(m.k) o.k = 1;
      const msg = JSON.stringify(o);
      if(!m.k && players[target].lastNw[side] === msg) return;
      players[target].lastNw[side] = msg;
      host.nope(target, msg);
    });
  }

  /* ---- the game ---- */
  function start(){
    if(!host || !presentSeats().length) return;
    seats.forEach(id => { players[id].score = 0; players[id].words = 0; players[id].lastWord = ''; players[id].lastQ = {};
                          players[id].live = ''; players[id].liveOk = false; players[id].lastNw = { l:'', r:'' };
                          players[id].grid = ''; players[id].gridV = ''; });
    $('banner').textContent = ''; $('toast').textContent = '';
    const secs = Number(settings.get('secs')) || 120;
    /* rethink lets every phone respond as often as it banks; answer is a
       whitelisted mode (an unknown one silently downgrades to buzz, which
       would kill every respond). Re-arming clears stored responses — correct
       at the start of a game. */
    host.arm('', { mode:'answer', rethink:true, secs });
    pushHint();
    running = true;
    endsAt = Date.now() + secs * 1000;
    clearInterval(tick);
    tick = setInterval(paintClock, 250);
    paintClock();
    pushNb();
    $('start').textContent = 'Again ⟳';
    render();
  }
  function paintClock(){
    const left = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
    $('big-clock').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    $('big-clock').classList.toggle('urgent', running && left <= 10);
    if(running && left <= 0) endGame();
  }
  function endGame(){
    running = false;
    clearInterval(tick); tick = null;
    /* The room stays armed through a grace beat so every phone's final score
       report still lands — respond needs an armed room. */
    setTimeout(() => { if(host && !running) host.disarm(); }, 4000);
    setTimeout(crown, 1500);          // let the last finals arrive, then crown
  }
  function crown(){
    if(running) return;
    const ring = seats.filter(id => players[id].words || players[id].score);
    if(!ring.length){ $('banner').textContent = 'Time!'; return; }
    const top = ring.slice().sort((a, b) => players[b].score - players[a].score)[0];
    $('banner').textContent = '🏆 ' + players[top].name + ' — ' + players[top].score;
    $('toast').textContent = '';
    render();
  }

  /* ---- painting ---- */
  function render(){
    /* One panel per seat, appended once in SEAT ORDER (seats only ever append,
       so DOM order stays ring order and neighbours stand side by side). The
       cells are built per panel and repainted in place; their COUNT follows
       the grid the phone sends (length = shape, cols = its square root), so
       the phone's COLS constant stays the one home and this page needs no
       edit when the grid changes shape. 49 is only the pre-message default. */
    const box = $('grids');
    box.querySelectorAll('.panel').forEach(el => {
      if(seats.indexOf(el.dataset.id) === -1) el.remove();
    });
    seats.forEach(id => {
      let el = box.querySelector('.panel[data-id="' + id + '"]');
      if(!el){
        el = document.createElement('div');
        el.className = 'panel'; el.dataset.id = id;
        el.innerHTML = '<div class="head"><span class="nm"></span><span class="sc"></span></div>' +
                       '<div class="cells"></div>' +
                       '<div class="lw"></div>';
        box.appendChild(el);
      }
      const pl = players[id];
      el.classList.toggle('gone', !pl.present);
      el.querySelector('.nm').textContent = pl.name;
      el.querySelector('.sc').textContent = pl.score;
      const lw = el.querySelector('.lw');
      lw.textContent = pl.live || (pl.lastWord ? pl.lastWord + ' · ' + pl.words : '');
      lw.classList.toggle('ok', !!pl.liveOk && !!pl.live);
      const g = pl.grid || '', mask = pl.gridV || '';
      const n = g.length || 49;
      const cellBox = el.querySelector('.cells');
      if(cellBox.childElementCount !== n){
        cellBox.innerHTML = '<span class="cell"></span>'.repeat(n);
        cellBox.style.setProperty('--gcols', String(Math.round(Math.sqrt(n))));
      }
      const cells = cellBox.querySelectorAll('.cell');
      for(let i = 0; i < n; i++){
        const ch = g[i] && g[i] !== '.' ? g[i] : '';
        if(cells[i].textContent !== ch) cells[i].textContent = ch;
        cells[i].classList.toggle('on', !!ch);
        const nib = mask ? (parseInt(mask[i >> 2], 16) || 0) : 0;
        cells[i].classList.toggle('ok', !!(nib & (8 >> (i & 3))));
      }
    });
    const stand = $('stand');
    stand.innerHTML = '';
    seats.slice().sort((a, b) => players[b].score - players[a].score).forEach(id => {
      const row = document.createElement('div');
      row.className = 'stand';
      row.innerHTML = '<b></b><span></span>';
      row.querySelector('b').textContent = players[id].name;
      row.querySelector('span').textContent = players[id].score;
      stand.appendChild(row);
    });
    $('hint').style.display = seats.length ? 'none' : '';
  }

  $('start').addEventListener('click', start);
  window.addEventListener('resize', render);

  // the suite's handle
  window.__bsb = { seats, players, start, running: () => running, host: () => host,
    // the suite's fast-forward: pull the end of the game to s seconds from now
    hurry: s => { if(running){ endsAt = Date.now() + s * 1000; paintClock(); } } };
})();
</script>
</body>
</html>
