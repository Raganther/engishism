<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sort It — Engishism Playground</title>
<style>
  /* Playground page: a sandbox for one dynamic. "Sort It" is the classic
     two-column classroom exercise made physical — words are Kit.table tiles you
     FLICK into one of two columns, and the column a tile lands in IS the answer.
     Super-minimal on purpose: two topic columns and the tiles, nothing else, so it
     reads on a phone held in the hand. */
  :root{
    --bg:#fafaf8; --text:#121212; --muted:#8a8a82; --border:#e2e2da;
    --a:#3E7CB1;   /* left column  */
    --b:#B5651D;   /* right column */
  }
  *{ box-sizing:border-box; }
  html, body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    /* 100dvh + a visualViewport refit (below): the mobile browser bar changes the
       visible height without a window resize, and vh would leave a tile parked
       under the bar. dvh tracks the visible box. */
    height:100dvh; overflow:hidden;
    display:flex; flex-direction:column;
  }

  /* A whisper-thin control strip. Muted, one line — the game is the columns. */
  .bar{ display:flex; align-items:center; gap:6px; padding:6px 8px; flex:0 0 auto; }
  .bar select{
    font:inherit; font-size:0.8rem; padding:4px 8px; border-radius:8px;
    border:1px solid var(--border); background:#fff; color:var(--muted); max-width:60%;
  }
  .bar .spring{ flex:1; }
  .bar button{
    font:inherit; font-size:1rem; line-height:1; padding:6px 10px; border-radius:8px;
    border:1px solid var(--border); background:#fff; color:var(--text); cursor:pointer;
  }
  .bar button.go{ border-color:var(--text); }
  .bar button.on{ background:var(--text); color:var(--bg); border-color:var(--text); }

  /* The two topic columns, named once across the top — the swatch matches the tint
     a column's tiles get when checked. Split 50/50 to sit over the two tile columns. */
  .heads{ display:flex; flex:0 0 auto; gap:8px; padding:0 8px 6px; }
  .heads .h{
    flex:1 1 0; min-width:0; text-align:center; font-weight:800; font-size:1.1rem;
    text-transform:lowercase; letter-spacing:0.01em; color:#fff; padding:8px 6px;
    border-radius:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .heads .h.a{ background:var(--a); } .heads .h.b{ background:var(--b); }

  /* The play surface: the physics canvas fills everything that's left. */
  .stage{ flex:1 1 auto; min-height:0; padding:0 8px 8px; }
  canvas#stage{ display:block; width:100%; height:100%; touch-action:none;
                border-radius:12px; background:#fff; }

  .status{ position:fixed; left:50%; bottom:10px; transform:translateX(-50%);
           z-index:3; font-weight:700; font-size:1.05rem; padding:6px 14px; border-radius:999px;
           background:rgba(18,18,18,0.86); color:#fff; pointer-events:none; opacity:0;
           transition:opacity 0.2s; white-space:nowrap; }
  .status.show{ opacity:1; }
  .status.good{ background:rgba(88,150,58,0.95); } .status.bad{ background:rgba(198,66,44,0.95); }
</style>
</head>
<body>
  <div class="bar">
    <select id="puzzle-select" aria-label="Choose puzzle"></select>
    <span class="spring"></span>
    <button id="style-btn" title="Tile shape: square boxes or wide bars">▦</button>
    <button id="shuffle-btn" title="Re-deal">↻</button>
    <button id="reveal-btn" title="Show answer">👁</button>
    <button id="check-btn" class="go" title="Check">✓</button>
  </div>

  <div class="heads">
    <div class="h a" id="head-a"></div>
    <div class="h b" id="head-b"></div>
  </div>

  <div class="stage"><canvas id="stage"></canvas></div>

  <div class="status" id="status"></div>

<script src="../game-hub/hub-qr.js?v=20260902c"></script>
<script src="../game-hub/matter.min.js?v=20260902c"></script>
<script src="../game-hub/hub-kit.js?v=20260902c"></script>
<script src="../game-hub/hub-table.js?v=20260902c"></script>
<script>
'use strict';
/* ================= PUZZLES — edit or add puzzles here =================
   Each puzzle sorts single-word tiles into ONE OF TWO columns. Give each side a
   short label and its words. Keep the two sides the same size (the columns size
   themselves to the larger side) and every word to one tile's worth. All words in
   a puzzle must be different. */
const PUZZLES = [
  { title: "make or do?", level: "A2–B1",
    a: { label: "make", words: ["a decision", "a mistake", "progress", "friends"] },
    b: { label: "do",   words: ["homework", "exercise", "business", "the dishes"] } },

  { title: "Countable or uncountable?", level: "B1",
    a: { label: "countable",   words: ["apple", "chair", "idea", "suggestion"] },
    b: { label: "uncountable", words: ["advice", "water", "information", "luggage"] } },

  { title: "Regular or irregular past?", level: "A2–B1",
    a: { label: "regular",   words: ["play", "want", "watch", "decide"] },
    b: { label: "irregular", words: ["go", "buy", "think", "catch"] } },

  { title: "Formal or informal?", level: "B2",
    a: { label: "formal",   words: ["purchase", "assist", "require", "depart"] },
    b: { label: "informal", words: ["buy", "help", "need", "leave"] } },

  { title: "much or many?", level: "A2",
    a: { label: "many",  words: ["books", "people", "chairs", "ideas"] },
    b: { label: "much",  words: ["water", "time", "money", "advice"] } }
];
/* ================= end of puzzles ================= */

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const K = window.HubKit;

let puzzleIndex = 0;
let perColumn = 4;                // rows = the larger side, so a correct sort always fits
let wordCat = {};                 // word -> 'a' (left col) | 'b' (right col)
const canvas = $('stage');
let checked = false, statusTimer = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function allWords(p){ return p.a.words.concat(p.b.words); }

/* One live table for the page's life. `upright` keeps a word tile the right way up.
   onArrange clears a stale Check tint the moment the board changes. */
const world = K && K.table ? K.table({
  canvas, upright: true,
  /* sweepGrid:false — this is a sort, not a crossword. A flicked tile that lands
     near the columns should rest naturally, not be shoved and spun out of the grid
     (Battle Scrabble's "no tile rests in the grid" rule read as a jiggle here). */
  sweepGrid: false,
  onArrange(){ if(checked){ world.setResult(null); checked = false; } }
}) : null;

/* Tile SHAPE — square boxes (like the letter tiles) or wide bars fitted to the
   word. A deal-time choice (the slots are square vs bar), persisted per device;
   localStorage may be blocked on file:// so fall back to bars. */
let boxes = false;
try{ boxes = localStorage.getItem('engishism.sort.boxes') === '1'; }catch(_){}
function applyStyle(){ $('style-btn').classList.toggle('on', boxes); }

/* The slot SHAPE only — SIZE and every feel dial are Throw Lab's, inherited by the
   world at construction. A game calls the shape it needs (square boxes or wide
   bars) and sets nothing else, so a size tuned and saved on Throw Lab flows
   straight through to both shapes. Tune the tile size on Throw Lab. */
function shapeSlots(p){
  if(boxes) world.slots({ cols: 2, rows: perColumn, top: 8 });                           // square boxes
  else      world.slots({ cols: 2, rows: perColumn, bar: true, top: 8, labels: allWords(p) });  // wide bars
}

function deal(){
  if(!world) return;
  const p = PUZZLES[puzzleIndex];
  wordCat = {};
  p.a.words.forEach(w => wordCat[w] = 'a');
  p.b.words.forEach(w => wordCat[w] = 'b');
  perColumn = Math.max(p.a.words.length, p.b.words.length);
  world.reset();
  /* TWO COLUMNS: col 0 (left) = side A, col 1 (right) = side B, `perColumn` rows
     each. Slots before pieces so the pile spreads at the real slot width. */
  shapeSlots(p);
  world.setPieces(shuffle(allWords(p)));
  world.setResult(null);
  checked = false;
  world.resize();
}

/* Judge by COLUMN, not row: cells() is row-major, so slot k is in column k % 2 —
   column 0 = 'a' (left), column 1 = 'b' (right). Per-slot green/red tint; a word
   still in the pile is unsorted. */
function check(){
  if(!world) return;
  const cells = world.cells();
  const right = [], wrong = [];
  let placed = 0;
  for(let k=0; k<cells.length; k++){
    const w = cells[k];
    if(!w) continue;
    placed++;
    const want = (k % 2 === 0) ? 'a' : 'b';
    (wordCat[w] === want ? right : wrong).push(k);
  }
  world.setResult(null);
  if(right.length) world.setResult('right', right);
  if(wrong.length) world.setResult('wrong', wrong);
  checked = true;
  const total = Object.keys(wordCat).length;
  const unsorted = total - placed;
  if(right.length === total) showStatus('All sorted — ' + total + '/' + total + ' ✓', 'good');
  else showStatus(right.length + '/' + total + ' right'
                  + (unsorted ? '  · ' + unsorted + ' still in the pile' : ''),
                  wrong.length ? 'bad' : '');
}

/* Show answer: drop every word into a correct-column slot. */
function reveal(){
  if(!world) return;
  const p = PUZZLES[puzzleIndex];
  world.reset();
  shapeSlots(p);
  world.setPieces(allWords(p));
  p.a.words.forEach((w, i) => world.place(i*2, w));       // col 0 slots: 0,2,4,…
  p.b.words.forEach((w, i) => world.place(i*2 + 1, w));   // col 1 slots: 1,3,5,…
  world.setResult('right', p.a.words.map((_, i) => i*2).concat(p.b.words.map((_, i) => i*2 + 1)));
  checked = true;
  world.resize();
  showStatus('The answer.', '');
}

function showStatus(text, cls){
  const s = $('status');
  s.textContent = text;
  s.className = 'status show' + (cls ? ' ' + cls : '');
  if(statusTimer) clearTimeout(statusTimer);
  statusTimer = setTimeout(() => s.classList.remove('show'), 2600);
}

/* ---------------- pointer -> grab / move / drop ---------------- */
if(world){
  const pt = e => world.pt(e);
  canvas.addEventListener('pointerdown', e => {
    const p = pt(e);
    if(world.grab(e.pointerId, p.x, p.y)) canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => { if(world.heldBy(e.pointerId)){ const p = pt(e); world.move(e.pointerId, p.x, p.y); } });
  const end = e => { if(world.heldBy(e.pointerId)){ world.drop(e.pointerId); try{ canvas.releasePointerCapture(e.pointerId); }catch(_){} } };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);

  (function loop(){ world.step(); world.draw(); requestAnimationFrame(loop); })();
  /* The browser bar changing height fires visualViewport resize (not window
     resize) — refit so no tile is left under the bar. */
  window.addEventListener('resize', () => world.resize());
  if(window.visualViewport) window.visualViewport.addEventListener('resize', () => world.resize());
}

/* driven-test handle — place() fires no onArrange, so a probe places then checks. */
window.__sort = {
  world, deal, check, reveal,
  state: () => ({ puzzle: PUZZLES[puzzleIndex].title, perColumn,
                  wordCat: Object.assign({}, wordCat),
                  cells: world ? world.cells() : [], loose: world ? world.loose().map(t => t.ch) : [] }),
  solveCorrect(){
    const p = PUZZLES[puzzleIndex];
    p.a.words.forEach((w, i) => world.place(i*2, w));
    p.b.words.forEach((w, i) => world.place(i*2 + 1, w));
  },
  // put one word in a chosen column ('a'=left / 'b'=right) at its first free slot
  put(word, side){
    const off = side === 'b' ? 1 : 0;
    for(let r=0; r<perColumn; r++){ if(world.place(r*2 + off, word)) return true; }
    return false;
  }
};

/* ---------------- toolbar ---------------- */
function loadPuzzle(i){
  puzzleIndex = i;
  const p = PUZZLES[i];
  $('head-a').textContent = p.a.label;
  $('head-b').textContent = p.b.label;
  deal();
}
function initToolbar(){
  const sel = $('puzzle-select');
  PUZZLES.forEach((p, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = (i+1) + '. ' + p.title;
    sel.appendChild(o);
  });
  sel.addEventListener('change', () => loadPuzzle(Number(sel.value)));
  $('shuffle-btn').addEventListener('click', deal);
  $('check-btn').addEventListener('click', check);
  $('reveal-btn').addEventListener('click', reveal);
  $('style-btn').addEventListener('click', () => {
    boxes = !boxes;
    try{ localStorage.setItem('engishism.sort.boxes', boxes ? '1' : '0'); }catch(_){}
    applyStyle();
    deal();               // the shape is chosen when the slots are built
  });
}

const start = params.has('p') ? (Number(params.get('p')) - 1)
            : Math.floor(Date.now()/86400000) % PUZZLES.length;
initToolbar();
loadPuzzle(Math.min(Math.max(start, 0), PUZZLES.length - 1));
$('puzzle-select').value = puzzleIndex;
applyStyle();
</script>
</body>
</html>
