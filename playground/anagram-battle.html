<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Anagram Battle — Engishism Playground</title>
<!--
  ANAGRAM BATTLE — a phone-only party game (playground, standalone).

  Stage 1 (this file so far): the SOLO word-stream, which is also the degradation
  path — a plain URL is a complete single-player game with no relay, exactly as the
  playground rule demands. A target word appears, its letters rain in as Kit.table
  tiles, you flick/drag them into the slots; a correct fill scores and the next word
  appears; most words before the clock wins. Stages 2–3 (rooms, tiles thrown between
  phones, one phone hosting the ring while also playing) build on top without
  touching this loop.

  Reuse, not reinvention (see docs/dynamics-three-hosts.md):
    - the physics is Kit.table (game-hub/hub-table.js) — the same shelf throw-lab,
      the anagram flick round and Battle Scrabble ride;
    - the completion check is lifted from the anagram round (anagram.js, ~line 256) —
      every slot filled AND positionally equal to the target word.
-->
<style>
  :root{
    --surface:#0e1230; --text:#f2f2ec; --muted:#9aa0aa; --accent:#00A0DF;
    --good:#3ddc84; --bad:#ff5d5d;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    /* A handset game: size to the REAL visible viewport (browser chrome changes the
       height without a window resize — refit on visualViewport below), and stop the
       page itself panning/zooming under a flick so the canvas owns the gesture. */
    height:100dvh; overflow:hidden;
    background:var(--surface); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column;
    touch-action:none; -webkit-user-select:none; user-select:none; overscroll-behavior:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* A small top strip — the one bit of chrome. Target word left, score + clock right. */
  #strip{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:8px 14px; min-height:46px;
  }
  #target{ font-size:1.5rem; font-weight:800; letter-spacing:0.16em; }
  #target small{ display:block; font-size:0.6rem; font-weight:600; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--muted); letter-spacing:0.18em; margin-bottom:1px; }
  #meta{ display:flex; gap:16px; align-items:baseline; }
  #meta b{ font-size:1.4rem; font-weight:800; }
  #meta span{ display:block; font-size:0.55rem; font-weight:600; letter-spacing:0.16em;
    text-transform:uppercase; color:var(--muted); text-align:right; }
  #time.low b{ color:var(--bad); }
  /* The play surface fills everything under the strip. Kit.table paints its own
     background, so the canvas is edge to edge. */
  #stage{ flex:1 1 auto; position:relative; min-height:0; }
  #board{ width:100%; height:100%; display:block; touch-action:none; }
  #board.grabbing{ cursor:grabbing; }
  /* Overlays — start and game over. Fixed, out of flow (a banner in the flow would
     shove the board under a thumb mid-drag). */
  #veil{
    position:fixed; inset:0; z-index:5; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center;
    background:rgba(8,10,26,0.94); padding:24px;
  }
  #veil[hidden]{ display:none; }
  #veil h1{ margin:0; font-size:2rem; font-weight:900; letter-spacing:0.02em; }
  #veil p{ margin:0; color:var(--muted); max-width:22rem; line-height:1.5; }
  #veil .score{ font-size:3rem; font-weight:900; color:var(--good); }
  button.go{
    font:inherit; font-weight:800; font-size:1.1rem; letter-spacing:0.04em;
    padding:14px 34px; border:none; border-radius:999px; cursor:pointer;
    background:var(--accent); color:#04121b;
  }
  button.go:active{ transform:translateY(1px); }
  button.go[disabled]{ opacity:0.5; }
  /* Lobby (host: QR + code + who has joined; joiner: waiting). Lives in the veil. */
  #lobby{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  #lobby[hidden]{ display:none; }
  #room-qr{ width:172px; height:172px; background:#fff; border-radius:12px; padding:8px; }
  #room-qr[hidden]{ display:none; }
  #room-qr svg{ width:100%; height:100%; display:block; }
  #room-code{ font-size:1.5rem; font-weight:800; letter-spacing:0.28em; }
  #room-code small{ display:block; font-size:0.55rem; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--muted); letter-spacing:0.2em; margin-bottom:2px; }
  #room-players{ font-size:0.85rem; color:var(--muted); min-height:1.2em; }
  #layout-pick[hidden]{ display:none; }
  #layout-pick small{ display:block; font-size:0.55rem; letter-spacing:0.2em;
    text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  #layout-pick .segs{ display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; }
  .seg{ font:inherit; font-size:0.85rem; font-weight:700; padding:7px 16px; border:none;
    background:transparent; color:var(--muted); cursor:pointer; }
  .seg.on{ background:var(--accent); color:#04121b; }
  /* Standings — a thin fixed strip, OUT of flow so it never shoves the board under a
     thumb mid-drag. Every phone shows it, because there is no projector to hold it. */
  #stand{ position:fixed; left:0; right:0; bottom:0; z-index:4; display:flex; gap:12px;
    justify-content:center; flex-wrap:wrap; align-items:center;
    padding:5px 10px calc(5px + env(safe-area-inset-bottom));
    background:rgba(8,10,26,0.72); font-size:0.72rem; letter-spacing:0.04em; }
  #stand[hidden]{ display:none; }
  #stand .p{ color:var(--muted); }
  #stand .p b{ color:var(--text); font-weight:800; }
  #stand .p.me b{ color:var(--accent); }
</style>
</head>
<body>
  <div id="strip">
    <div id="target"><small>Spell</small><span id="word">—</span></div>
    <div id="meta">
      <div><span>Words</span><b id="score">0</b></div>
      <div id="time"><span>Time</span><b id="clock">—</b></div>
    </div>
  </div>
  <div id="stage"><canvas id="board"></canvas></div>
  <div id="stand" hidden></div>

  <div id="veil">
    <h1>Anagram Battle</h1>
    <p id="veil-msg">Flick the letters into the boxes to spell the word. Complete as many
       as you can before the clock runs out.</p>
    <!-- Lobby: shown only once a real room exists. Host sees the QR + code + who has
         joined and the Start button; a joiner sees the code and waits for the host. -->
    <div id="lobby" hidden>
      <div id="room-qr" hidden></div>
      <div id="room-code"><small>Room</small><span id="code-val">—</span></div>
      <div id="room-players">Waiting for players…</div>
      <!-- Host only: how are players sitting? Decides which edge a thrown tile enters. -->
      <div id="layout-pick" hidden>
        <small>Seating</small>
        <div class="segs">
          <button type="button" class="seg on" data-v="row">In a row</button>
          <button type="button" class="seg" data-v="facing">Facing</button>
        </div>
      </div>
    </div>
    <div class="score" id="veil-score" hidden>0</div>
    <button class="go" id="veil-btn">Start</button>
  </div>

  <!-- Content: the word bank. A teacher can edit this list. Short, common words so the
       tiles and slots read on a phone. (Stage 1 shows the target word; a later mode can
       hide it behind a clue, which is the anagram round's real puzzle.) -->
  <script>
    window.WORDS = [
      "PLANET","GARDEN","ORANGE","SILVER","MARKET","WINTER","FRIEND","BRIDGE",
      "CASTLE","PENCIL","ROCKET","JUNGLE","ISLAND","MONKEY","GUITAR","YELLOW",
      "PURPLE","DRAGON","FLOWER","WIZARD","CAMERA","TIGER","LEMON","CLOUD",
      "RIVER","STORM","BEACH","HONEY","PIANO","CANDLE","FOREST","PICNIC"
    ];
  </script>

  <script src="../game-hub/hub-qr.js?v=20260903g"></script>
  <script src="../game-hub/hub-buzzer.js?v=20260903g"></script>
  <script src="../game-hub/matter.min.js?v=20260903g"></script>
  <script src="../game-hub/hub-kit.js?v=20260903g"></script>
  <script src="../game-hub/hub-table.js?v=20260903g"></script>
  <script src="phone-profiles.js?v=20260903g"></script>
  <script src="bench-kit.js?v=20260903g"></script>
  <script>
  (function(){
    const K = window.HubKit;
    if(!K || !K.table){ document.getElementById('veil-msg').textContent =
      'Physics failed to load — check the script tags.'; return; }

    const ROUND_SECS = 90;
    const $ = id => document.getElementById(id);
    const canvas = $('board');

    /* Game state. `word` is the current target (UPPERCASE); the table holds its
       scrambled letters; a correct arrangement scores and deals the next. */
    const G = { word:'', score:0, left:ROUND_SECS, running:false, tick:null };
    let net = null;              // the room layer (Stage 2), assigned once a room exists
    let layout = 'row';          // seating: 'row' (beside) | 'facing' (across) — host-set, pushed
    const ROOM_DECOYS = 2;       // spare letters dealt as ammo when playing in a room

    /* Tell a phone-aware bench (phone-bench) that this "board" is itself a handset, so
       the host pane is sized as a phone rather than a 1280 projector. Harmless
       elsewhere — only phone-bench reads it. */
    window.HubBoardSize = (window.PHONE_PROFILES && PHONE_PROFILES.standard) || { w:390, h:664 };

    /* The table. onArrange(read, done) — the shelf reports the spelled word and
       whether every slot is filled; the page judges (the anagram round's rule:
       done AND the read equals the target, positionally). No feel overrides — the
       throw-feel is Throw Lab's, inherited. */
    /* The judge, one function so the pointer path (onArrange) and a driven test run
       identical code. The anagram round's rule: every slot filled AND the spelled
       word equals the target, positionally. */
    function evaluate(read, done){
      if(!G.running) return null;
      if(done && String(read).toUpperCase() === G.word){
        world.setResult('right');
        G.score++; $('score').textContent = G.score;
        if(net) net.report(G.score);                          // push my score to the room's standings
        setTimeout(()=>{ if(G.running) nextWord(); }, 480);   // brief green flash, then next
        return 'right';
      }
      world.setResult(done ? 'wrong' : null);
      return done ? 'wrong' : null;
    }
    const world = K.table({
      canvas,
      onArrange(read, done){ evaluate(read, done); },
      /* A tile flicked off an open side edge travels to a neighbour (Stage 2). Fires
         only once a room has opened the sides; solo keeps both sides closed. */
      onExit(t){ if(net) net.throw(t); },
      /* A thrown tile knocked one of my placed letters out. The shelf has already
         freed that slot and made the victim loose again, so there is nothing to undo
         here — the letter is back in play for the player to re-place. */
      onKnock(){ /* freed-slot feedback is the loose tile itself */ }
    });

    function shuffled(word){
      const a = word.split('');
      for(let tries = 0; tries < 24; tries++){
        for(let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
        if(a.join('') !== word) break;
      }
      return a;
    }
    /* Pick a fresh word (avoid repeating the one just done). */
    function pickWord(){
      const pool = (window.WORDS || []).filter(w => w && w !== G.word);
      const src = pool.length ? pool : (window.WORDS || ['PLANET']);
      return String(src[Math.floor(Math.random()*src.length)]).toUpperCase();
    }
    /* Spare letters, dealt only in a room: they are clutter you must sort around AND
       your ammo — flick one off an edge and it flies at a neighbour. Drawn from a
       common-letter bag; a decoy that happens to match a needed letter is harmless
       (either copy spells the word). */
    function decoys(n){
      const bag = 'ETAOINSRHLDCUMPFGWYB'.split('');
      const out = [];
      for(let i = 0; i < n; i++) out.push(bag[Math.floor(Math.random()*bag.length)]);
      return out;
    }
    function nextWord(){
      G.word = pickWord();
      $('word').textContent = G.word;
      world.reset();
      const spare = !!(net && net.live && net.live());   // an opponent to throw at?
      const tiles = shuffled(G.word).concat(spare ? decoys(ROOM_DECOYS) : []);
      world.setPieces(tiles);              // word letters (+ decoys when opposed), scattered
      world.slots(G.word.length);          // only the word's slots; decoys stay loose
      world.setResult(null);
      world.openSides(spare ? { l:true, r:true } : { l:false, r:false });  // travel only when opposed
    }

    function paintClock(){
      $('clock').textContent = G.left;
      $('time').classList.toggle('low', G.left <= 10);
    }
    function beginPlay(secs){
      G.score = 0; G.left = secs || ROUND_SECS; G.running = true;
      $('score').textContent = '0'; paintClock();
      $('veil').hidden = true;
      $('stand').hidden = true;              // renderStand reveals it once ≥2 are playing
      if(net) net.report(0);
      nextWord();
      clearInterval(G.tick);
      G.tick = setInterval(()=>{
        G.left--; paintClock();
        if(G.left <= 0) endGame();
      }, 1000);
    }
    function endGame(){
      G.running = false;
      clearInterval(G.tick); G.tick = null;
      if(net) world.openSides({ l:false, r:false });   // no more travel between screens
      world.reset();
      $('word').textContent = '—';
      if(net) net.report(G.score);
      $('veil-msg').hidden = true;
      $('veil-score').hidden = false; $('veil-score').textContent = G.score +
        (G.score === 1 ? ' word' : ' words');
      $('veil-btn').hidden = false;
      $('veil-btn').textContent = net ? 'New game' : 'Play again';
      $('veil').hidden = false;
    }
    /* The veil button's job depends on the role, so it is swappable. Solo: play. Host:
       arm the room then play (set by the room layer). Joiner: hidden — the host starts. */
    let onGo = ()=> beginPlay(ROUND_SECS);
    $('veil-btn').addEventListener('click', ()=> onGo());

    /* Boot + the fixed-timestep loop. step() advances by WALL CLOCK, so a 120Hz phone
       and a 60Hz one play at the same speed. */
    world.resize();
    (function loop(){ world.step(); world.draw(); requestAnimationFrame(loop); })();

    /* Size to the real visible viewport, and refit when mobile chrome changes it
       (no window resize fires for that). */
    function refit(){ world.resize(); }
    window.addEventListener('resize', refit);
    if(window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    /* Pointer → grab / move / drop, in canvas-space coords (world.pt maps through the
       painted/natural ratio). */
    const pt = e => world.pt(e);
    canvas.addEventListener('pointerdown', e => {
      const p = pt(e);
      if(world.grab(e.pointerId, p.x, p.y)){ canvas.classList.add('grabbing'); canvas.setPointerCapture(e.pointerId); }
    });
    canvas.addEventListener('pointermove', e => {
      if(world.heldBy(e.pointerId)){ const p = pt(e); world.move(e.pointerId, p.x, p.y); }
    });
    function endDrag(e){
      if(world.heldBy(e.pointerId)){
        world.drop(e.pointerId);
        try{ canvas.releasePointerCapture(e.pointerId); }catch(_){}
        if(!world.anyHeld()) canvas.classList.remove('grabbing');
      }
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    /* A driven-test handle (the __bs style the playground skill asks for): the world,
       game state, and the entry points a test needs to place letters and read the
       board without a pointer. `place(order)` fills the slots in a given letter order;
       `solve()` places the correct order; `read()` re-derives the spelled word. */
    window.__ab = {
      world,
      state: ()=>({ word:G.word, score:G.score, left:G.left, running:G.running }),
      start: ()=> beginPlay(ROUND_SECS),
      next: nextWord,
      loose: ()=> world.loose(),
      read: ()=> world.read(),
      /* Fill the slots with a letter sequence, then run the SAME judge the pointer
         path runs — `place()` docks without firing onArrange (the shelf contract), so
         a driven test calls evaluate() itself, exactly as a real drop would. */
      fill(order){
        order.forEach((ch, i)=> world.place(i, String(ch).toUpperCase()));
        return evaluate(world.read(), world.filled());
      },
      /* Solve the current word (place its letters in order) and score it. */
      solve(){ return this.fill(G.word.split('')); },
      /* Wire-level throw for a driven room test — sends a tile up the same path a real
         flick's onExit would (host loopback or joiner→relay→host), skipping the
         physics timing that makes a real flick flaky headless. */
      wireThrow(tile){ return net && net.throw(tile); },
      inRoom(){ return !!net; }
    };

    /* ============================ Stage 2 — the room ============================
       Everyone opens the SAME page. No `?code` → this phone HOSTS: mints a room, shows
       the QR, runs the ring, AND plays as seat 0 — the local loopback in `deliver()` is
       what lets the host be a player despite there being no self-`nope` path. `?code`
       present → this phone JOINS. The solo loop above is untouched; this only adds the
       wire, and a host playing alone stays pure solo (no opponent → no decoys, sides
       shut) so a dead relay still leaves a fully playable game (the playground rule). */

    const parts = new URLSearchParams(location.search);
    /* Which relay to reach. Same-origin ('') by default — right when the site is served
       from the relay (Render) itself, and for the local test relay. But GitHub Pages is
       static with NO relay at its origin, so the shareable Pages link would never form a
       room; there, reach across to the deployed Render relay so the plain link just works.
       `?relay=` always overrides. */
    const RELAY = parts.get('relay') ||
      (/github\.io$/i.test(location.hostname) ? 'https://engishism-buzzer.onrender.com' : '');
    function joinURL(code){
      return location.origin + location.pathname + '?code=' + code +
        (parts.get('relay') ? '&relay=' + encodeURIComponent(parts.get('relay')) : '');
    }
    function showQR(url){
      const el = $('room-qr');
      if(/^https?:/.test(location.protocol) && window.qrcode){
        const q = window.qrcode(0, 'M'); q.addData(url); q.make();
        el.innerHTML = q.createSvgTag({ cellSize:4, margin:0, scalable:true });
        el.hidden = false;
      } else el.hidden = true;                       // file:// → no QR; the code still shows
    }

    /* A tile arriving from a neighbour — identical on both roles. Spawn it as a loose,
       "shot" body entering from the correct edge (it left their L → enters my R), so it
       can knock a placed letter out. `hue` keeps the thrower's colour; `tag` their name. */
    function onIncoming(tile){
      if(!tile || !tile.ch) return;
      const w = canvas.clientWidth || 360, h = canvas.clientHeight || 500;
      const exit = tile.side === 'l' ? 'l' : 'r';
      const ny0 = tile.ny != null ? tile.ny : 0.3;
      let entry, ny, vy;
      if(layout === 'facing'){
        /* The neighbour's phone is 180° to me: a tile off their right comes at my right,
           and top/bottom flips. */
        entry = exit; ny = 1 - ny0; vy = -(Number(tile.vy) || 0);
      } else {
        /* Row / beside, same way up: their right edge faces my left — mirror L↔R,
           vertical unchanged. (This is Stage 2's original mapping.) */
        entry = exit === 'l' ? 'r' : 'l'; ny = ny0; vy = Number(tile.vy) || 0;
      }
      const x = entry === 'l' ? 14 : w - 14;
      const vx = (entry === 'l' ? 1 : -1) * Math.abs(Number(tile.vx) || 10);
      world.addPiece(String(tile.ch).toUpperCase(), {
        x, y:ny * h, vx, vy, hue:tile.hue, shot:true, tag:tile.by || '?'
      });
      window.__ab.lastIn = { entrySide:entry, ny:Math.round(ny*100)/100, layout, ch:String(tile.ch).toUpperCase() };
    }

    function renderStand(rows){
      const el = $('stand');
      const show = G.running && rows && rows.length >= 2;
      if(!show){ el.hidden = true; return; }
      rows = rows.slice().sort((a, b) => (b.score||0) - (a.score||0));
      el.innerHTML = '';
      rows.forEach(r => {
        const s = document.createElement('span');
        s.className = 'p' + (r.me ? ' me' : '');
        s.innerHTML = (r.name || '?') + ' <b>' + (r.score||0) + '</b>';
        el.appendChild(s);
      });
      el.hidden = false;
    }

    const simSeat = (window.HubBuzzer && HubBuzzer.sim) ? HubBuzzer.sim() : null;
    const joinCode = simSeat ? simSeat.code : parts.get('code');

    if(joinCode && window.HubBuzzer){
      /* -------------------------------- JOINER -------------------------------- */
      const seq = {};
      const nextq = t => (seq[t] = (seq[t] || 0) + 1);
      const SEAT_KEY = 'engishism.anagrambattle.seat';   // our own key, never join.html's
      const nm = (simSeat && simSeat.name) || ('P' + Math.floor(Math.random()*90 + 10));
      let myId = simSeat && simSeat.id;
      if(!myId && !simSeat){                              // a real phone reuses its seat on reconnect
        try{ const s = JSON.parse(localStorage.getItem(SEAT_KEY) || 'null'); if(s && s.code === joinCode) myId = s.id; }catch(_){}
      }
      if(!myId) myId = 'p' + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36);
      if(!simSeat){ try{ localStorage.setItem(SEAT_KEY, JSON.stringify({ code:joinCode, id:myId })); }catch(_){} }

      const client = HubBuzzer.player({ relay:RELAY, code:joinCode, name:nm, id:myId });
      net = {
        live: ()=> true,                                 // a joiner is in a real room
        report(score){ client.respond(JSON.stringify({ t:'s', sc:score, q:nextq('s') })); },
        throw(tile){ client.respond(JSON.stringify({ t:'th', ch:tile.ch, hue:tile.hue, side:tile.side, vx:tile.vx, vy:tile.vy, ny:tile.ny, q:nextq('th') })); }
      };
      const armState = (d, live) => { if(!G.running && (live || (d && d.armed))) beginPlay(d && d.secs); };
      client.on('armed',  d => armState(d, true));
      client.on('joined', d => armState(d, false));
      client.on('disarmed', ()=>{ if(G.running) endGame(); });
      client.on('nope', d => {
        let m = null; try{ m = JSON.parse((d && d.word) || ''); }catch(_){ return; }
        if(!m || !m.t) return;
        if(m.t === 'tile') onIncoming(m);
        else if(m.t === 'layout') layout = (m.v === 'facing') ? 'facing' : 'row';
        else if(m.t === 'stand') renderStand((m.rows || []).map(r => ({ name:r.name, score:r.score, me:r.id === myId })));
      });
      $('lobby').hidden = false; $('room-qr').hidden = true;
      $('code-val').textContent = joinCode;
      $('room-players').textContent = 'Joined — waiting for the host to start.';
      $('veil-btn').hidden = true;                       // the host starts the game

    } else if(window.BenchKit && /^https?:/.test(location.protocol)){
      /* --------------------------- HOST (also plays) -------------------------- */
      const HOST = 'HOST';
      const seats = [HOST];                              // append-only; seat 0 is me
      const players = { [HOST]: { name:'You', score:0, present:true, lastQ:{} } };
      let host = null;

      /* Show the lobby the moment we start hosting, in a "connecting" state — the relay
         (Render, free tier) can take 30–60s to wake, and a blank Start screen looks like
         a dead solo game. `ready` below fills in the QR/code/seating; a fallback says so
         if it never connects (Start still plays solo — host stays null). */
      $('lobby').hidden = false; $('room-qr').hidden = true;
      $('code-val').textContent = '…';
      $('room-players').textContent = 'Connecting to the room server…';
      /* Render's free tier sleeps and can take ~a minute to wake on the first hit, and
         BenchKit keeps retrying under us — so a cold start reads as "waking", not
         failure. Only after a long wait do we call it unreachable; a later `ready`
         still clears both and shows the QR. */
      const connTimers = [
        setTimeout(()=>{ if(!host) $('room-players').textContent = 'Waking the room server — this can take up to a minute on the first go…'; }, 8000),
        setTimeout(()=>{ if(!host) $('room-players').textContent = "Still can't reach the room server. You can play solo (tap Start), or reload."; }, 90000)
      ];

      const presentSeats = () => seats.filter(id => id === HOST || (players[id] && players[id].present));
      function neighbourId(fromId, side){
        const ring = presentSeats();
        const i = ring.indexOf(fromId);
        if(i === -1 || ring.length < 2) return null;
        const j = side === 'l' ? (i - 1 + ring.length) % ring.length : (i + 1) % ring.length;
        return ring[j];
      }
      function deliver(fromId, tile){                    // the ring router — adapted from battle-scrabble-board
        const target = neighbourId(fromId, tile.side);
        if(!target) return;                              // nobody to throw at yet
        if(target === HOST) onIncoming(tile);            // the local loopback — host is a player
        else if(host) host.nope(target, JSON.stringify({ t:'tile', ch:tile.ch, hue:tile.hue, side:tile.side, vx:tile.vx, vy:tile.vy, ny:tile.ny, by:'You' }));
      }
      function rowsOf(){ return presentSeats().map(id => ({ id, name:players[id].name, score:players[id].score || 0 })); }
      function broadcastStand(){
        const rs = rowsOf();
        if(host) presentSeats().forEach(id => { if(id !== HOST) host.nope(id, JSON.stringify({ t:'stand', rows:rs })); });
        renderStand(rs.map(r => ({ name:r.name, score:r.score, me:r.id === HOST })));
      }
      function pushNb(){
        if(!host) return;
        const ring = presentSeats();
        ring.forEach((id, i) => {
          if(id === HOST) return;
          const l = ring[(i - 1 + ring.length) % ring.length], r = ring[(i + 1) % ring.length];
          host.nope(id, JSON.stringify({ t:'nb', l:players[l].name, r:players[r].name }));
        });
      }
      function renderLobby(){
        const others = presentSeats().length - 1;
        $('room-players').textContent = others
          ? others + (others === 1 ? ' player joined — tap Start' : ' players joined — tap Start')
          : 'Waiting for players to scan…';
      }
      function pushLayout(){
        if(host) presentSeats().forEach(id => { if(id !== HOST) host.nope(id, JSON.stringify({ t:'layout', v:layout })); });
      }
      function setLayout(v){
        layout = (v === 'facing') ? 'facing' : 'row';
        const pick = $('layout-pick');
        if(pick) pick.querySelectorAll('.seg').forEach(b => b.classList.toggle('on', b.dataset.v === layout));
        pushLayout();
      }
      net = {
        live: ()=> presentSeats().length > 1,            // decoys/throwing only once someone joined
        report(score){ players[HOST].score = score; broadcastStand(); },
        throw(tile){ deliver(HOST, tile); }
      };

      const sink = document.createElement('div');        // BenchKit's own chip lands here, unused
      BenchKit.room({
        mount: sink, relay: RELAY, board:'anagram-battle.html', joinPath:'/playground/anagram-battle.html',
        on: {
          ready(h){
            connTimers.forEach(clearTimeout);
            host = h; $('lobby').hidden = false; $('code-val').textContent = h.code;
            showQR(joinURL(h.code)); renderLobby();
            const pick = $('layout-pick'); pick.hidden = false;
            pick.querySelectorAll('.seg').forEach(b => b.addEventListener('click', ()=> setLayout(b.dataset.v)));
          },
          players(list){
            (list || []).forEach(p => {
              if(seats.indexOf(p.id) === -1) seats.push(p.id);
              players[p.id] = players[p.id] || { name:p.name, score:0, lastQ:{} };
              if(p.name) players[p.id].name = p.name;
              players[p.id].present = true;
            });
            const ids = (list || []).map(p => p.id);
            seats.forEach(id => { if(id !== HOST) players[id].present = ids.indexOf(id) !== -1; });
            renderLobby(); pushNb(); pushLayout(); broadcastStand();
          },
          response(d){
            const v = d && d.latest; if(!v || !host) return;
            let m = null; try{ m = JSON.parse(v.value || ''); }catch(_){ return; }
            if(!m || !m.t) return;
            const pl = players[v.id]; if(!pl) return;
            if(m.q != null){ if(m.q <= (pl.lastQ[m.t] || 0)) return; pl.lastQ[m.t] = m.q; }   // per-type replay guard
            if(m.t === 'th' && G.running) deliver(v.id, m);
            else if(m.t === 's'){ pl.score = Number(m.sc) || 0; broadcastStand(); }
          }
        }
      });
      onGo = ()=>{ if(host) host.arm('', { mode:'answer', rethink:true, secs:ROUND_SECS }); beginPlay(ROUND_SECS); };
      $('veil-btn').textContent = 'Start';

      /* Expose the ring for a driven room test (the host side of __ab). */
      window.__ab.host = { deliver:(from, tile)=>deliver(from, tile), seats:()=>seats.slice(), present:presentSeats, players:()=>players };
      window.__ab.setLayout = setLayout;
    }
    // else: no room layer (file:// or no BenchKit) → pure solo; the veil's Start plays.
  })();
  </script>
</body>
</html>
