<body>
<div id="game-hub-root"></div>

<!-- The lab unit, and only the lab unit. `game-hub.html` deliberately does not
     load it: this board exists to try question dynamics inside the real engine
     without any of it reaching a class. Everything below is the ordinary hub —
     same engine, same clue card, same scoring, same phones. That is the point of
     the experiment; a special engine would prove nothing about the real one. -->
<script src="game-hub/content/unit-lab.js?v=20260827e"></script>
<script src="game-hub/hub-qr.js?v=20260827e"></script>
<script src="game-hub/hub-buzzer.js?v=20260827e"></script>
<script src="game-hub/hub-kit.js?v=20260827e"></script>
<!-- Physics table shelf for the Toss round: Matter first (hub-table
     destructures window.Matter at load), then the shelf onto window.HubKit. -->
<script src="game-hub/matter.min.js?v=20260827e"></script>
<script src="game-hub/hub-table.js?v=20260827e"></script>
<script src="game-hub/hub-rounds.js?v=20260827e"></script>
<script src="game-hub/rounds/default.js?v=20260827e"></script>
<script src="game-hub/rounds/grouping.js?v=20260827e"></script>

<script src="game-hub/hub-round-settings.js?v=20260827e"></script>
<script src="game-hub/hub-games.js?v=20260827e"></script>
<!-- Games in their own files register here, before the engine loads and consumes
     everything registered — the same pattern as rounds/*.js into hub-rounds.js. -->
<script src="game-hub/games/jeopardy.js?v=20260827e"></script>
<script src="game-hub/games/bingo.js?v=20260827e"></script>
<script src="game-hub/games/quickfire.js?v=20260827e"></script>

<script src="game-hub/games/race.js?v=20260827e"></script>
<script src="game-hub/games/blockbusters.js?v=20260827e"></script>
<!-- Round-first PROBE — lab board only, deliberately not in the class shells. -->
<script src="game-hub/games/connections.js?v=20260827e"></script>
<script src="game-hub/hub-engine.js?v=20260827e"></script>
<script>
/* The reveal clues have nothing to reveal with hints switched off, and this board
   exists to try them — so it turns them on once, the first time it is opened, and
   never fights the teacher about it afterwards. A lab that silently does nothing
   is worse than one that says what it did. */
(function(){
  try{
    const S = window.HubSettings;
    if(!S || localStorage.getItem('engishism.lab.primed')) return;
    S.set('jHints', true, 'jeopardy');
    localStorage.setItem('engishism.lab.primed', '1');
  }catch(e){}
})();
</script>
</body>
